<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>던전 곱셈 모험</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --stone:#3a3357;
    --stone-dark:#2a2440;
    --torch:#ffb347;
    --torch-glow:#ff8c2e;
    --gold:#ffd95e;
    --door:#7a4a2b;
    --door-light:#a8662f;
    --green:#5fd97a;
    --red:#ff7a8a;
    --paper:#f4e9d0;
  }
  html,body{ height:100%; }
  body{
    font-family:'Jua', sans-serif;
    background:
      radial-gradient(circle at 50% 0%, #4a3f6e 0%, #2a2440 60%, #1a162b 100%);
    color:var(--paper);
    display:flex; flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
    user-select:none;
  }
  #app{
    flex:1; display:flex; flex-direction:column;
    max-width:520px; margin:0 auto; width:100%;
    padding:16px 16px 28px;
  }

  /* ===== 상단 진행 표시 ===== */
  header{ text-align:center; margin-bottom:10px; }
  h1{ font-size:28px; color:var(--gold); text-shadow:0 3px 0 #00000040; letter-spacing:1px; }
  .progress-wrap{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin-top:12px; flex-wrap:wrap;
  }
  .room-dot{
    width:30px; height:30px; border-radius:8px;
    background:var(--stone-dark);
    border:2px solid #00000040;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; transition:.3s;
  }
  .room-dot.done{ background:var(--green); }
  .room-dot.current{ background:var(--torch); box-shadow:0 0 14px var(--torch-glow); transform:scale(1.15); }
  .room-dot.exit{ font-size:18px; }

  /* ===== 던전 그림 ===== */
  .dungeon-scene{
    position:relative;
    background:linear-gradient(180deg,#2a2440,#1f1a33);
    border:4px solid #00000050;
    border-radius:18px;
    padding:18px 14px 14px;
    margin-bottom:18px;
    box-shadow:inset 0 0 40px #00000060;
    overflow:hidden;
  }
  /* 돌바닥 무늬 */
  .dungeon-scene::after{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(90deg, #ffffff08 1px, transparent 1px),
      linear-gradient(#ffffff08 1px, transparent 1px);
    background-size:26px 26px;
    pointer-events:none;
  }
  .torch-row{ display:flex; justify-content:space-between; padding:0 8px; margin-bottom:6px; }
  .torch{ font-size:26px; animation:flicker 1.4s infinite alternate; }
  .torch:nth-child(2){ animation-delay:.5s; }
  @keyframes flicker{
    0%{ opacity:.7; transform:translateY(0) scale(1); filter:drop-shadow(0 0 4px var(--torch-glow)); }
    100%{ opacity:1; transform:translateY(-2px) scale(1.08); filter:drop-shadow(0 0 12px var(--torch-glow)); }
  }

  .room-label{
    text-align:center; font-size:20px; color:var(--gold);
    position:relative; z-index:2; margin-bottom:6px;
  }

  /* 문 */
  .door-stage{ position:relative; z-index:2; display:flex; justify-content:center; padding:6px 0 2px; }
  .door-frame{
    width:170px; height:200px;
    background:var(--stone);
    border-radius:90px 90px 12px 12px;
    padding:12px;
    box-shadow:0 8px 0 #00000050, inset 0 0 20px #00000060;
    position:relative;
  }
  .door{
    width:100%; height:100%;
    background:linear-gradient(160deg,var(--door-light),var(--door));
    border-radius:78px 78px 6px 6px;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 18px #00000070;
    transition:transform .6s ease, opacity .6s;
    transform-origin:left center;
  }
  .door .plank{
    position:absolute; top:8%; bottom:6%; width:2px; background:#00000035;
  }
  .door .plank.p1{ left:35%; } .door .plank.p2{ left:65%; }
  .door .knob{
    position:absolute; right:16px; top:50%; width:16px; height:16px;
    background:var(--gold); border-radius:50%; box-shadow:0 0 8px var(--gold);
  }
  .door-question{
    font-size:30px; color:#fff5dd; text-shadow:0 2px 0 #00000060; z-index:3;
  }
  .door.opening{ transform:perspective(600px) rotateY(-105deg); opacity:.25; }

  /* 캐릭터 */
  .hero{
    font-size:40px; position:relative; z-index:3;
    text-align:center; margin-top:4px;
    animation:bob 1.4s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

  /* ===== 문제 / 보기 ===== */
  .question-big{
    text-align:center; font-size:40px; color:var(--gold);
    margin:4px 0 14px; text-shadow:0 3px 0 #00000050;
  }
  .options{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .opt-btn{
    font-family:'Jua',sans-serif;
    font-size:34px; color:var(--stone-dark);
    background:linear-gradient(180deg,#fff8e6,var(--paper));
    border:none; border-radius:18px;
    padding:24px 0;
    box-shadow:0 6px 0 #b89b6a, 0 8px 14px #00000040;
    cursor:pointer; transition:transform .08s, box-shadow .08s;
  }
  .opt-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b89b6a; }
  .opt-btn.correct{ background:linear-gradient(180deg,#bff7c8,var(--green)); color:#1d5b2c; }
  .opt-btn.wrong{ background:linear-gradient(180deg,#ffd0d6,var(--red)); animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);} }
  .opt-btn:disabled{ cursor:default; }

  .feedback{
    text-align:center; font-size:24px; margin-top:18px; min-height:34px;
    transition:.2s;
  }
  .feedback.good{ color:var(--green); }
  .feedback.try{ color:var(--torch); }

  /* ===== 시작 / 종료 화면 ===== */
  .center-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:20px;
  }
  .big-emoji{ font-size:90px; }
  .screen-title{ font-size:40px; color:var(--gold); text-shadow:0 4px 0 #00000050; }
  .screen-sub{ font-size:22px; color:var(--paper); line-height:1.6; }
  .start-btn{
    font-family:'Jua',sans-serif; font-size:30px; color:var(--stone-dark);
    background:linear-gradient(180deg,var(--gold),#f0b93e);
    border:none; border-radius:22px; padding:20px 44px;
    box-shadow:0 7px 0 #a87d1f, 0 10px 18px #00000050;
    cursor:pointer; transition:transform .08s;
  }
  .start-btn:active{ transform:translateY(4px); }

  /* 별 스티커 */
  .stars{ display:flex; gap:10px; font-size:46px; }
  .stars span{ animation:pop .5s backwards; }
  .stars span:nth-child(2){ animation-delay:.15s; }
  .stars span:nth-child(3){ animation-delay:.3s; }
  @keyframes pop{ 0%{transform:scale(0) rotate(-40deg);opacity:0;} 70%{transform:scale(1.3);} 100%{transform:scale(1);opacity:1;} }

  /* 색종이 */
  .confetti{ position:fixed; top:-20px; width:12px; height:18px; z-index:99; pointer-events:none; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); opacity:0; } }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- 시작 화면 -->
  <div id="startScreen" class="center-screen">
    <div class="big-emoji">🏰</div>
    <div class="screen-title">던전 곱셈 모험</div>
    <div class="screen-sub">문에 적힌 구구단 문제를 풀고<br>방을 하나씩 통과해 보세요!<br>마지막 방까지 가면 던전 탈출 성공! 🎉</div>
    <button class="start-btn" onclick="startGame()">모험 시작 ▶</button>
  </div>

  <!-- 게임 화면 -->
  <div id="gameScreen" class="hidden">
    <header>
      <h1>🗝️ 던전 곱셈 모험</h1>
      <div class="progress-wrap" id="progress"></div>
    </header>

    <div class="dungeon-scene">
      <div class="torch-row"><span class="torch">🔥</span><span class="torch">🔥</span></div>
      <div class="room-label" id="roomLabel">첫 번째 방</div>
      <div class="door-stage">
        <div class="door-frame">
          <div class="door" id="door">
            <span class="plank p1"></span><span class="plank p2"></span>
            <span class="knob"></span>
            <span class="door-question" id="doorQ">? × ?</span>
          </div>
        </div>
      </div>
      <div class="hero">🧒</div>
    </div>

    <div class="question-big" id="bigQ">3 × 4 = ?</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- 종료 화면 -->
  <div id="endScreen" class="center-screen hidden">
    <div class="big-emoji">🎉</div>
    <div class="screen-title">던전 탈출 성공!</div>
    <div class="stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="screen-sub" id="endMsg">모든 방을 통과했어요!<br>정말 멋져요! 👏</div>
    <button class="start-btn" onclick="startGame()">🔄 다시 도전</button>
  </div>

</div>

<script>
  const TOTAL_ROOMS = 6;          // 방 개수 (5~7 사이)
  const ROOM_NAMES = ["첫 번째 방","두 번째 방","세 번째 방","네 번째 방","다섯 번째 방","여섯 번째 방","일곱 번째 방"];
  let currentRoom = 0;
  let problems = [];
  let locked = false;

  // 구구단 문제 만들기 (2단~9단)
  function makeProblem(){
    const a = Math.floor(Math.random()*8)+2;  // 2~9
    const b = Math.floor(Math.random()*8)+2;  // 2~9
    const answer = a*b;
    // 보기 4개 만들기
    const opts = new Set([answer]);
    while(opts.size < 4){
      let wrong = answer + (Math.floor(Math.random()*9)-4);
      if(wrong > 0 && wrong !== answer) opts.add(wrong);
    }
    const options = [...opts].sort(()=>Math.random()-0.5);
    return {a,b,answer,options};
  }

  function startGame(){
    currentRoom = 0;
    locked = false;
    problems = Array.from({length:TOTAL_ROOMS}, makeProblem);
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    buildProgress();
    loadRoom();
  }

  function buildProgress(){
    const p = document.getElementById('progress');
    p.innerHTML = '';
    for(let i=0;i<TOTAL_ROOMS;i++){
      const d = document.createElement('div');
      d.className = 'room-dot';
      d.id = 'dot'+i;
      d.textContent = '🚪';
      p.appendChild(d);
    }
    const exit = document.createElement('div');
    exit.className = 'room-dot exit';
    exit.id = 'dotExit';
    exit.textContent = '🏁';
    p.appendChild(exit);
  }

  function updateProgress(){
    for(let i=0;i<TOTAL_ROOMS;i++){
      const d = document.getElementById('dot'+i);
      d.className = 'room-dot';
      if(i < currentRoom){ d.classList.add('done'); d.textContent='✅'; }
      else if(i === currentRoom){ d.classList.add('current'); d.textContent='🧒'; }
      else { d.textContent='🚪'; }
    }
  }

  function loadRoom(){
    locked = false;
    const prob = problems[currentRoom];
    document.getElementById('roomLabel').textContent = ROOM_NAMES[currentRoom];
    document.getElementById('doorQ').textContent = prob.a + ' × ' + prob.b;
    document.getElementById('bigQ').textContent = prob.a + ' × ' + prob.b + ' = ?';
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';

    const door = document.getElementById('door');
    door.classList.remove('opening');

    const box = document.getElementById('options');
    box.innerHTML = '';
    prob.options.forEach(n=>{
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = n;
      btn.onclick = ()=>choose(btn, n, prob.answer);
      box.appendChild(btn);
    });
    updateProgress();
  }

  function choose(btn, picked, answer){
    if(locked) return;
    const fb = document.getElementById('feedback');
    if(picked === answer){
      locked = true;
      btn.classList.add('correct');
      fb.textContent = '문이 열렸어요! 🎉';
      fb.className = 'feedback good';
      document.getElementById('door').classList.add('opening');
      [...document.querySelectorAll('.opt-btn')].forEach(b=>b.disabled=true);
      setTimeout(nextRoom, 1100);
    } else {
      btn.classList.add('wrong');
      fb.textContent = '한 번 더 생각해 볼까? 🤔';
      fb.className = 'feedback try';
      setTimeout(()=>btn.classList.remove('wrong'), 400);
    }
  }

  function nextRoom(){
    currentRoom++;
    if(currentRoom >= TOTAL_ROOMS){
      finishGame();
    } else {
      loadRoom();
    }
  }

  function finishGame(){
    document.getElementById('gameScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.remove('hidden');
    launchConfetti();
  }

  function launchConfetti(){
    const colors = ['#ffd95e','#5fd97a','#ff7a8a','#ffb347','#7ec8ff','#c89bff'];
    for(let i=0;i<60;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animation = `fall ${1.5+Math.random()*1.5}s linear ${Math.random()*0.6}s forwards`;
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), 3500);
    }
  }
</script>
</body>
</html>
