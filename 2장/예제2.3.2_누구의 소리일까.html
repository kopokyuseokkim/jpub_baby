<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>무슨 소리일까요?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#aee9ff;
    --sky2:#d9f6ff;
    --sun:#ffd86b;
    --grass:#9be38a;
    --card:#ffffff;
    --ink:#4a3b2a;
    --good:#5fc97f;
    --warn:#ff9d52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Jua',sans-serif;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,#eafff0 100%);
    color:var(--ink);
    overflow-x:hidden;
    touch-action:manipulation;
  }
  /* 둥실둥실 떠다니는 구름 배경 */
  .cloud{position:fixed;background:#fff;border-radius:50px;opacity:.7;filter:blur(.3px);z-index:0;}
  .cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%;}
  .c1{width:120px;height:34px;top:8%;left:-130px;animation:drift 38s linear infinite;}
  .c1:before{width:55px;height:55px;top:-26px;left:18px;}
  .c1:after{width:40px;height:40px;top:-18px;left:60px;}
  .c2{width:90px;height:26px;top:22%;left:-100px;animation:drift 52s linear infinite;animation-delay:-10s;}
  .c2:before{width:40px;height:40px;top:-20px;left:14px;}
  .c2:after{width:30px;height:30px;top:-12px;left:46px;}
  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(115vw);}}

  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 16px 32px;min-height:100%;display:flex;flex-direction:column;}

  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .progress{font-size:20px;background:#fff;padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 #d7d0c2;}
  .score{font-size:20px;background:var(--sun);padding:6px 16px;border-radius:999px;box-shadow:0 4px 0 #e0b53e;}
  .score b{font-family:'Gaegu';}

  .title{text-align:center;font-size:30px;margin:10px 0 4px;text-shadow:0 2px 0 #fff;}

  /* 큰 소리 재생 버튼 */
  .sound-btn{
    margin:16px auto 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:190px;height:190px;border:none;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 35% 30%,#ffe49a,var(--sun));
    box-shadow:0 10px 0 #e0a93a,0 14px 26px rgba(0,0,0,.18);
    color:#7a5a14;font-family:'Jua';font-size:26px;transition:transform .08s;
  }
  .sound-btn:active{transform:translateY(6px);box-shadow:0 4px 0 #e0a93a,0 6px 14px rgba(0,0,0,.18);}
  .sound-btn .ico{font-size:64px;line-height:1;margin-bottom:4px;}
  .sound-btn.playing{animation:pulse .5s ease infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  .hint{text-align:center;font-size:18px;color:#6b7a8c;margin:4px 0 2px;min-height:26px;}

  /* 그림 카드 4장 */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
  .card{
    position:relative;background:var(--card);border:none;border-radius:26px;cursor:pointer;
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 0 #d7d0c2,0 10px 20px rgba(0,0,0,.10);
    transition:transform .08s;overflow:hidden;
  }
  .card:active{transform:translateY(5px);box-shadow:0 3px 0 #d7d0c2;}
  .card svg{width:74%;height:74%;}
  .card .name{position:absolute;bottom:8px;font-size:18px;color:#8a7a64;}
  .card.correct{animation:hop .6s ease;box-shadow:0 0 0 6px var(--good),0 8px 0 #d7d0c2;}
  .card.wrong{animation:shake .45s ease;box-shadow:0 0 0 6px var(--warn),0 8px 0 #d7d0c2;}
  .card.dim{opacity:.45;}
  @keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-4deg)}55%{transform:translateY(0)}72%{transform:translateY(-10px)}100%{transform:translateY(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-6px)}}

  /* 정답/오답 큰 안내 배너 */
  .banner{
    position:fixed;left:50%;top:38%;z-index:5;
    transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;
    background:#fff;padding:22px 34px;border-radius:30px;font-size:34px;text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.22);transition:transform .25s,opacity .25s;
  }
  .banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .banner.good{color:var(--good);}
  .banner.warn{color:var(--warn);font-size:26px;}

  /* 결과 화면 */
  .result{text-align:center;padding:20px 6px;}
  .result h2{font-size:34px;margin:6px 0;}
  .stars{font-size:46px;letter-spacing:6px;margin:14px 0;}
  .bigscore{font-family:'Gaegu';font-size:80px;color:var(--good);line-height:1;margin:6px 0;}
  .again{
    margin-top:18px;border:none;background:var(--good);color:#fff;font-family:'Jua';font-size:26px;
    padding:18px 40px;border-radius:999px;cursor:pointer;box-shadow:0 8px 0 #3da45e;
  }
  .again:active{transform:translateY(5px);box-shadow:0 3px 0 #3da45e;}

  .hide{display:none !important;}
  .confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:4;border-radius:3px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:1;}}
</style>
</head>
<body>
<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="wrap">
  <!-- 게임 화면 -->
  <div id="game">
    <div class="topbar">
      <div class="progress">🎯 <span id="qnum">1</span> / 10</div>
      <div class="score">⭐ <b id="score">0</b></div>
    </div>
    <div class="title">무슨 소리일까요?</div>

    <button class="sound-btn" id="soundBtn">
      <span class="ico">🔊</span>
      <span>소리 듣기</span>
    </button>
    <div class="hint" id="hint">버튼을 눌러 소리를 들어 보세요!</div>

    <div class="grid" id="grid"></div>
  </div>

  <!-- 결과 화면 -->
  <div id="result" class="result hide"></div>
</div>

<div class="banner" id="banner"></div>

<script>
/* ---------- 동물·사물 그림 (SVG로 직접 그림) ---------- */
const ART = {
  cat:`<svg viewBox="0 0 100 100"><g><polygon points="28,30 22,8 42,22" fill="#f4a259"/><polygon points="72,30 78,8 58,22" fill="#f4a259"/><circle cx="50" cy="58" r="34" fill="#f4a259"/><circle cx="38" cy="54" r="6" fill="#fff"/><circle cx="62" cy="54" r="6" fill="#fff"/><circle cx="38" cy="55" r="3" fill="#222"/><circle cx="62" cy="55" r="3" fill="#222"/><polygon points="50,62 45,68 55,68" fill="#e76f51"/><path d="M50 68 v6" stroke="#333" stroke-width="2"/><path d="M20 64 h16 M20 70 h16 M80 64 h-16 M80 70 h-16" stroke="#333" stroke-width="2" stroke-linecap="round"/></g></svg>`,
  dog:`<svg viewBox="0 0 100 100"><ellipse cx="24" cy="46" rx="13" ry="22" fill="#8d6748"/><ellipse cx="76" cy="46" rx="13" ry="22" fill="#8d6748"/><circle cx="50" cy="56" r="32" fill="#c79a6b"/><circle cx="39" cy="50" r="5" fill="#222"/><circle cx="61" cy="50" r="5" fill="#222"/><ellipse cx="50" cy="64" rx="12" ry="9" fill="#fff"/><ellipse cx="50" cy="62" rx="6" ry="4.5" fill="#3a2a1a"/><path d="M50 66 v6 M50 72 q-7 4 -12 0 M50 72 q7 4 12 0" stroke="#3a2a1a" stroke-width="2" fill="none" stroke-linecap="round"/></g></svg>`,

  duck:`<svg viewBox="0 0 100 100"><circle cx="44" cy="52" r="30" fill="#ffd84d"/><circle cx="68" cy="34" r="16" fill="#ffd84d"/><circle cx="70" cy="31" r="3" fill="#222"/><path d="M80 36 q14 -2 14 5 q-2 6 -14 3z" fill="#ff9b3d"/><path d="M30 70 q-12 8 -18 2" stroke="#ff9b3d" stroke-width="6" fill="none" stroke-linecap="round"/></svg>`,

  car:`<svg viewBox="0 0 100 100"><rect x="14" y="50" width="72" height="24" rx="8" fill="#ef5350"/><path d="M26 50 l10 -16 h28 l10 16z" fill="#ef5350"/><rect x="34" y="38" width="14" height="12" rx="3" fill="#bfe6ff"/><rect x="52" y="38" width="14" height="12" rx="3" fill="#bfe6ff"/><circle cx="32" cy="76" r="9" fill="#333"/><circle cx="68" cy="76" r="9" fill="#333"/><circle cx="32" cy="76" r="3.5" fill="#bbb"/><circle cx="68" cy="76" r="3.5" fill="#bbb"/></svg>`,
  bell:`<svg viewBox="0 0 100 100"><path d="M50 18 a6 6 0 0 1 6 6 c14 4 18 18 18 30 c0 8 4 12 6 16 h-60 c2 -4 6 -8 6 -16 c0 -12 4 -26 18 -30 a6 6 0 0 1 6 -6z" fill="#ffca3a"/><ellipse cx="50" cy="82" rx="9" ry="6" fill="#e0a93a"/></svg>`,
  horn:`<svg viewBox="0 0 100 100"><rect x="20" y="44" width="34" height="16" rx="4" fill="#444"/><path d="M54 38 l24 -10 v44 l-24 -10z" fill="#ffca3a"/><path d="M82 40 q10 8 0 18" stroke="#444" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`
};

/* ---------- 문제 데이터 (소리는 코드로 합성) ---------- */
const ITEMS = [
  {key:'cat',  name:'고양이', sound:'meow'},
  {key:'dog',  name:'강아지', sound:'woof'},
  {key:'cow',  name:'소',     sound:'moo'},
  {key:'pig',  name:'돼지',   sound:'oink'},
  {key:'duck', name:'오리',   sound:'quack'},
  {key:'sheep',name:'양',     sound:'baa'},
  {key:'frog', name:'개구리', sound:'ribbit'},
  {key:'car',  name:'자동차', sound:'horn'},
];

/* ---------- 소리 합성 (Web Audio API) ---------- */
let actx;
function ensureAudio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }
// 음정이 곡선처럼 미끄러지는 소리 (포인트들을 따라 주파수가 움직임)
function glide(points,dur,opts={}){
  const t0=actx.currentTime+(opts.start||0);
  const type=opts.type||'sawtooth', vol=opts.vol||0.25;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(points[0][1],t0);
  points.forEach(([p,f])=>o.frequency.linearRampToValueAtTime(f,t0+p*dur));
  // 비브라토(떨림) — 동물 울음의 생동감
  if(opts.vibrato){
    const lfo=actx.createOscillator(), lg=actx.createGain();
    lfo.frequency.value=opts.vibrato; lg.gain.value=opts.vibratoDepth||12;
    lfo.connect(lg).connect(o.frequency); lfo.start(t0); lfo.stop(t0+dur+0.05);
  }
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.03);
  g.gain.setValueAtTime(vol,t0+dur*0.7);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  let node=o;
  if(opts.filter){ const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=opts.filter; o.connect(f); node=f; }
  node.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
// 바람 새는 듯한 노이즈 (꽥꽥, 자동차 경적 질감용)
function noiseBurst(start,dur,freq,q,vol){
  const len=Math.floor(actx.sampleRate*dur);
  const buf=actx.createBuffer(1,len,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const src=actx.createBufferSource(); src.buffer=buf;
  const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=actx.createGain(); const t0=actx.currentTime+start;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  src.connect(f).connect(g).connect(actx.destination);
  src.start(t0); src.stop(t0+dur);
}
// 경적용 깔끔한 화음
function honk(start,dur){
  [294,370,440].forEach(fr=>{
    const t0=actx.currentTime+start;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sawtooth'; o.frequency.value=fr;
    const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(0.12,t0+0.02);
    g.gain.setValueAtTime(0.12,t0+dur-0.04);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(f).connect(g).connect(actx.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  });
}

const SOUNDS = {
  // 고양이: 높이 올라갔다 내려오는 "야~옹", 떨림 있음
  meow(){ glide([[0,540],[0.25,900],[0.5,820],[1,360]],0.55,{type:'sawtooth',vol:0.2,filter:2600,vibrato:14,vibratoDepth:30}); },
  // 강아지: 짧고 굵게 두 번 "멍! 멍!"
  woof(){ glide([[0,260],[0.3,150],[1,110]],0.16,{type:'square',vol:0.28,filter:900});
          glide([[0,260],[0.3,150],[1,110]],0.16,{start:0.25,type:'square',vol:0.28,filter:900}); },
  // 소: 길고 낮게 "음~매~"
  moo(){ glide([[0,150],[0.4,165],[0.6,150],[1,120]],0.9,{type:'sawtooth',vol:0.22,filter:700,vibrato:6,vibratoDepth:8}); },
  // 돼지: 코로 킁킁 세 번
  oink(){ for(let i=0;i<3;i++) glide([[0,260],[0.5,330],[1,240]],0.13,{start:i*0.16,type:'square',vol:0.2,filter:1100,vibrato:30,vibratoDepth:25}); },
  // 오리: 콧소리 섞인 "꽥꽥" — 노이즈 더해 부리 느낌
  quack(){ for(let i=0;i<2;i++){ glide([[0,500],[0.4,440],[1,380]],0.16,{start:i*0.22,type:'sawtooth',vol:0.18,filter:1800,vibrato:25,vibratoDepth:40}); noiseBurst(i*0.22,0.14,1200,3,0.06);} },
  // 양: 떨리는 "매~에~에"
  baa(){ glide([[0,430],[1,400]],0.6,{type:'sawtooth',vol:0.18,filter:1600,vibrato:18,vibratoDepth:35}); },
  // 개구리: 낮게 두 번 "개굴개굴"
  ribbit(){ glide([[0,150],[0.5,110],[1,140]],0.18,{type:'square',vol:0.24,filter:600,vibrato:40,vibratoDepth:30});
            glide([[0,150],[0.5,110],[1,140]],0.18,{start:0.24,type:'square',vol:0.24,filter:600,vibrato:40,vibratoDepth:30}); },
  // 자동차: 또렷한 경적 "빵! 빵!"
  horn(){ honk(0,0.28); honk(0.36,0.34); },
};

/* ---------- 게임 로직 ---------- */
let questions=[], qIndex=0, score=0, current=null, answered=false;

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function buildQuestions(){
  const pick = shuffle(ITEMS).slice(0,10>ITEMS.length?ITEMS.length:10);
  // 10문제: 종류가 8개라 일부 반복하되 연속 중복은 피함
  const order=[];
  while(order.length<10){
    const s=shuffle(ITEMS);
    for(const it of s){ if(order.length<10 && order[order.length-1]!==it) order.push(it); }
  }
  return order.map(answer=>{
    const distract = shuffle(ITEMS.filter(x=>x.key!==answer.key)).slice(0,3);
    const choices = shuffle([answer,...distract]);
    return {answer,choices};
  });
}

const el = id=>document.getElementById(id);

function startGame(){
  questions=buildQuestions(); qIndex=0; score=0;
  el('result').classList.add('hide');
  el('game').classList.remove('hide');
  el('score').textContent=0;
  loadQuestion();
}

function loadQuestion(){
  answered=false;
  current=questions[qIndex];
  el('qnum').textContent=qIndex+1;
  el('hint').textContent='버튼을 눌러 소리를 들어 보세요!';
  const grid=el('grid'); grid.innerHTML='';
  current.choices.forEach(item=>{
    const b=document.createElement('button');
    b.className='card';
    b.innerHTML = ART[item.key] + `<span class="name">${item.name}</span>`;
    b.onclick=()=>choose(item,b);
    grid.appendChild(b);
  });
}

/* ---------- 진짜 동물 소리 (BigSoundBank, CC0 퍼블릭 도메인) ---------- */
/* 인터넷이 연결된 브라우저에서는 실제 녹음된 소리가 나오고,
   연결이 안 되거나 차단된 환경에서는 자동으로 아래 합성 소리로 대체됩니다. */
const REAL_SOUNDS = {
  meow:  {url:'https://bigsoundbank.com/UPLOAD/mp3/1890.mp3', dur:3000},
  woof:  {url:'https://bigsoundbank.com/UPLOAD/mp3/2352.mp3', dur:3200},
  moo:   {url:'https://bigsoundbank.com/UPLOAD/mp3/2386.mp3', dur:2500},
  oink:  {url:'https://bigsoundbank.com/UPLOAD/mp3/1658.mp3', dur:3000},
  quack: {url:'https://bigsoundbank.com/UPLOAD/mp3/0276.mp3', dur:3000},
  baa:   {url:'https://bigsoundbank.com/UPLOAD/mp3/2343.mp3', dur:2000},
  ribbit:{url:'https://bigsoundbank.com/UPLOAD/mp3/0998.mp3', dur:3500},
  horn:  {url:'https://bigsoundbank.com/UPLOAD/mp3/0257.mp3', dur:1800},
};
const players = {};
function getPlayer(key){
  if(!players[key]){
    const a = new Audio(REAL_SOUNDS[key].url);
    a.preload = 'auto';
    players[key] = a;
  }
  return players[key];
}
let stopTimer = null;
function stopAllReal(){
  clearTimeout(stopTimer);
  Object.values(players).forEach(a=>{ try{ a.pause(); a.currentTime=0; }catch(e){} });
}

// 한국어로 동물/사물 이름 말해주기
function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=0.85; u.pitch=1.3;
  speechSynthesis.speak(u);
}

function playCurrent(){
  ensureAudio();
  stopAllReal();
  const btn=el('soundBtn');
  btn.classList.add('playing');
  setTimeout(()=>btn.classList.remove('playing'),900);

  const key = current.answer.sound;
  const real = REAL_SOUNDS[key];
  const audio = getPlayer(key);
  const afterMs = real.dur + 200;

  audio.currentTime = 0;
  const p = audio.play();
  if(p && p.then){
    p.then(()=>{
      // 진짜 소리 재생 성공: 지정 길이만 들려주고 멈춤 → 이름 말하기
      stopTimer = setTimeout(()=>{ try{audio.pause();}catch(e){} }, real.dur);
      setTimeout(()=>speak(current.answer.name), afterMs);
    }).catch(()=>{
      // 재생 실패(인터넷 없음/차단): 합성 소리로 자동 대체
      SOUNDS[key]();
      setTimeout(()=>speak(current.answer.name), 1000);
    });
  } else {
    SOUNDS[key]();
    setTimeout(()=>speak(current.answer.name), 1000);
  }
}

function showBanner(text,type){
  const b=el('banner');
  b.textContent=text; b.className='banner show '+type;
  setTimeout(()=>b.classList.remove('show'),1100);
}

function choose(item,btn){
  if(answered) return;
  if(item.key===current.answer.key){
    answered=true;
    btn.classList.add('correct');
    // 정답 외 카드 흐리게
    [...el('grid').children].forEach(c=>{ if(c!==btn) c.classList.add('dim'); });
    score++; el('score').textContent=score;
    stopAllReal();
    if('speechSynthesis' in window) speechSynthesis.cancel();
    successChime();
    setTimeout(()=>speak('정답이에요'),350);
    showBanner('정답이에요! 🎉','good');
    confetti();
    setTimeout(nextQuestion,1500);
  } else {
    // 틀림: 흔들고 안내, 같은 소리 다시 들려주기
    btn.classList.add('wrong');
    setTimeout(()=>btn.classList.remove('wrong'),500);
    el('hint').textContent='다시 한 번 들어 볼까요? 🎧';
    showBanner('다시 한 번!','warn');
    setTimeout(playCurrent,650);
  }
}

function successChime(){ ensureAudio();
  glide([[0,523],[1,523]],0.12,{type:'sine',vol:0.2});
  glide([[0,659],[1,659]],0.12,{start:0.12,type:'sine',vol:0.2});
  glide([[0,784],[1,784]],0.2,{start:0.24,type:'sine',vol:0.2});
}

function nextQuestion(){
  stopAllReal();
  qIndex++;
  if(qIndex>=questions.length){ showResult(); return; }
  loadQuestion();
  setTimeout(playCurrent,300); // 다음 문제 소리 자동 한 번 들려주기
}

function showResult(){
  el('game').classList.add('hide');
  const r=el('result'); r.classList.remove('hide');
  let stars = score>=9?'⭐⭐⭐':score>=6?'⭐⭐':score>=3?'⭐':'🌱';
  let msg = score>=9?'정말 대단해요!':score>=6?'아주 잘했어요!':score>=3?'잘하고 있어요!':'다시 도전해 볼까요?';
  r.innerHTML=`
    <div class="title" style="font-size:34px;">놀이 끝! 🎈</div>
    <div class="stars">${stars}</div>
    <div class="bigscore">${score}<span style="font-size:34px;color:#8a7a64;"> / 10</span></div>
    <h2>${msg}</h2>
    <button class="again" onclick="startGame()">다시 하기 🔁</button>`;
  if(score>=6){ for(let i=0;i<3;i++) setTimeout(confetti,i*250); }
}

function confetti(){
  const colors=['#ff6b6b','#ffd93d','#6bcB77','#4d96ff','#ff8fab','#b983ff'];
  for(let i=0;i<26;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    c.style.transform='rotate('+Math.random()*360+'deg)';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3200);
  }
}

el('soundBtn').addEventListener('click',playCurrent);
startGame();
</script>
</body>
</html>
