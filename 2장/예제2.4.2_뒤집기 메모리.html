<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>같은 그림 짝 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Jua', sans-serif;
    background: linear-gradient(160deg, #fff3c4 0%, #ffd6e0 50%, #c4f0ff 100%);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    position: relative;
  }

  /* ===== 화면 공통 ===== */
  .screen {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }
  .hidden { display: none !important; }

  h1 {
    font-size: 2.4rem;
    color: #5b3a8a;
    text-align: center;
    text-shadow: 2px 2px 0 #fff;
    line-height: 1.3;
  }
  .subtitle {
    font-size: 1.3rem;
    color: #8a5a3a;
  }

  /* ===== 난이도 버튼 ===== */
  .level-btns {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 320px;
  }
  .level-btn {
    font-family: 'Jua', sans-serif;
    font-size: 1.5rem;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 20px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .level-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .lv-easy { background: #ff9f6e; }
  .lv-mid  { background: #6ec6ff; }
  .lv-hard { background: #b18cff; }

  /* ===== 게임 화면 ===== */
  #gameScreen { justify-content: flex-start; gap: 14px; padding-top: 8px; }
  .topbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.7);
    border-radius: 20px;
    padding: 12px 20px;
    font-size: 1.4rem;
    color: #5b3a8a;
  }
  .topbar .home {
    font-family: 'Jua', sans-serif;
    font-size: 1.1rem;
    background: #ffd166;
    border: none;
    border-radius: 14px;
    padding: 8px 16px;
    color: #7a4a00;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  .topbar .home:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }

  .grid {
    display: grid;
    gap: 12px;
    width: 100%;
    flex: 1;
    align-content: center;
    justify-content: center;
  }

  .card {
    position: relative;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    perspective: 600px;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.4s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 0 rgba(0,0,0,0.12);
  }
  .card-back {
    background: linear-gradient(135deg, #7c5cff, #b18cff);
    font-size: 2.2rem;
  }
  .card-front {
    background: #ffffff;
    transform: rotateY(180deg);
    border: 4px solid #ffd166;
  }
  .card-emoji { line-height: 1; }
  .card.matched .card-front {
    border-color: #7ad67a;
    animation: pop 0.5s;
  }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.15); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  /* 칭찬 토스트 */
  #toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    background: #7ad67a;
    color: #fff;
    font-size: 1.8rem;
    padding: 18px 36px;
    border-radius: 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
  }
  #toast.show { animation: toastPop 1s ease; }
  @keyframes toastPop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
    70% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }

  /* ===== 결과 화면 ===== */
  #winScreen .big { font-size: 6rem; animation: bounce 1s infinite; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  .result-card {
    background: rgba(255,255,255,0.8);
    border-radius: 24px;
    padding: 24px 36px;
    font-size: 1.5rem;
    color: #5b3a8a;
    text-align: center;
  }
  .replay-btn {
    font-family: 'Jua', sans-serif;
    font-size: 1.6rem;
    color: #fff;
    background: #ff7eb6;
    border: none;
    border-radius: 24px;
    padding: 20px 48px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .replay-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }

  /* 색종이 */
  .confetti {
    position: fixed;
    top: -20px;
    width: 12px;
    height: 12px;
    z-index: 40;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.9; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- 시작 화면 -->
  <div class="screen" id="startScreen">
    <h1>🐶 같은 그림<br>짝 맞추기 🍎</h1>
    <p class="subtitle">단계를 골라 주세요!</p>
    <div class="level-btns">
      <button class="level-btn lv-easy" data-pairs="2">🌱 아주 쉬움 (4장)</button>
      <button class="level-btn lv-mid"  data-pairs="3">⭐ 쉬움 (6장)</button>
      <button class="level-btn lv-hard" data-pairs="8">🔥 도전 (16장)</button>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div class="screen hidden" id="gameScreen">
    <div class="topbar">
      <button class="home" id="homeBtn">🏠 처음</button>
      <span>⭐ 짝: <b id="score">0</b></span>
      <span>👆 횟수: <b id="tries">0</b></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- 결과 화면 -->
  <div class="screen hidden" id="winScreen">
    <div class="big">🎉</div>
    <h1>다 맞혔어요!</h1>
    <div class="result-card">
      <div id="winText"></div>
    </div>
    <button class="replay-btn" id="replayBtn">다시 하기 🔄</button>
  </div>

</div>

<div id="toast">짝을 찾았어요! 🎈</div>

<script>
(function(){
  // 친숙한 그림 모음 (동물·과일·탈것)
  const EMOJIS = ['🐶','🐱','🐰','🐸','🦁','🐼','🦊','🐯',
                  '🍎','🍌','🍓','🍇','🍊','🍉','🥝','🍑',
                  '🚗','🚌','🚒','✈️','🚂','🚀','🚲','🛵'];

  const startScreen = document.getElementById('startScreen');
  const gameScreen  = document.getElementById('gameScreen');
  const winScreen   = document.getElementById('winScreen');
  const grid    = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const triesEl = document.getElementById('tries');
  const toast   = document.getElementById('toast');

  let firstCard = null, lock = false;
  let score = 0, tries = 0, totalPairs = 0;

  // 소리 (Web Audio - 파일 없이 생성)
  let actx = null;
  function beep(freq, dur, type){
    try {
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.3, actx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
      o.start(); o.stop(actx.currentTime+dur);
    } catch(e){}
  }
  function soundMatch(){ beep(660,0.12); setTimeout(()=>beep(880,0.18),120); }
  function soundFlip(){ beep(440,0.08,'triangle'); }
  function soundWin(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.25),i*150)); }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function startGame(pairs){
    totalPairs = pairs;
    score = 0; tries = 0; firstCard = null; lock = false;
    scoreEl.textContent = '0';
    triesEl.textContent = '0';
    grid.innerHTML = '';

    // 그림 쌍 만들기
    const chosen = shuffle([...EMOJIS]).slice(0, pairs);
    const deck = shuffle([...chosen, ...chosen]);

    // 카드 수에 맞춰 열 개수 정하기
    const total = deck.length;
    let cols;
    if(total <= 4) cols = 2;
    else if(total <= 6) cols = 2;
    else if(total <= 12) cols = 3;
    else cols = 4;
    grid.style.gridTemplateColumns = 'repeat('+cols+', 1fr)';

    deck.forEach(emoji => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.emoji = emoji;
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="card-face card-back">❓</div>' +
          '<div class="card-face card-front"><span class="card-emoji">'+emoji+'</span></div>' +
        '</div>';
      card.addEventListener('click', ()=>flip(card));
      grid.appendChild(card);
    });

    // 카드 글자 크기를 칸 수에 맞춰 조정
    const size = cols >= 4 ? '2rem' : cols >= 3 ? '2.6rem' : '3.4rem';
    grid.querySelectorAll('.card-emoji').forEach(e=>e.style.fontSize=size);

    show(gameScreen);
  }

  function flip(card){
    if(lock) return;
    if(card.classList.contains('flipped') || card.classList.contains('matched')) return;

    card.classList.add('flipped');
    soundFlip();

    if(!firstCard){
      firstCard = card;
      return;
    }

    // 두 번째 카드
    tries++;
    triesEl.textContent = tries;
    const second = card;

    if(firstCard.dataset.emoji === second.dataset.emoji){
      // 짝 맞음
      lock = true;
      setTimeout(()=>{
        firstCard.classList.add('matched');
        second.classList.add('matched');
        firstCard = null; lock = false;
        score++;
        scoreEl.textContent = score;
        soundMatch();
        showToast();
        if(score === totalPairs) setTimeout(winGame, 700);
      }, 350);
    } else {
      // 짝 다름 → 잠깐 보여주고 다시 뒤집기
      lock = true;
      setTimeout(()=>{
        firstCard.classList.remove('flipped');
        second.classList.remove('flipped');
        firstCard = null; lock = false;
      }, 900);
    }
  }

  function showToast(){
    toast.classList.remove('show');
    void toast.offsetWidth; // 재시작 트릭
    toast.classList.add('show');
  }

  function winGame(){
    soundWin();
    document.getElementById('winText').innerHTML =
      '👆 ' + tries + '번 만에<br>모든 짝을 찾았어요!';
    show(winScreen);
    confetti();
  }

  function confetti(){
    const colors = ['#ff7eb6','#ffd166','#6ec6ff','#7ad67a','#b18cff'];
    for(let i=0;i<40;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100+'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
      const dur = 2+Math.random()*2;
      c.style.animation = 'fall '+dur+'s linear forwards';
      c.style.animationDelay = Math.random()*0.5+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(), (dur+1)*1000);
    }
  }

  function show(screen){
    [startScreen,gameScreen,winScreen].forEach(s=>s.classList.add('hidden'));
    screen.classList.remove('hidden');
  }

  // 버튼 연결
  document.querySelectorAll('.level-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> startGame(parseInt(btn.dataset.pairs,10)));
  });
  document.getElementById('homeBtn').addEventListener('click', ()=>show(startScreen));
  document.getElementById('replayBtn').addEventListener('click', ()=>show(startScreen));
})();
</script>
</body>
</html>
