<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>끝말잇기 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --cream: #FFF8E7;
    --sky: #8ED1FC;
    --sky-deep: #4FB3E8;
    --sun: #FFD23F;
    --coral: #FF8C66;
    --grass: #7DD181;
    --grass-deep: #5BB85F;
    --ink: #5A4632;
    --bubble-bot: #FFFFFF;
    --bubble-me: #FFE08A;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Jua', sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #B8E6FF 0%, #DFF4FF 45%, #FFF8E7 100%);
  }
  body {
    display: flex;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background:
      radial-gradient(circle at 80% 12%, rgba(255,210,63,0.55) 0 38px, transparent 40px),
      linear-gradient(180deg, #B8E6FF 0%, #DFF4FF 45%, #FFF8E7 100%);
  }
  /* 구름 장식 */
  .cloud {
    position: absolute; background: rgba(255,255,255,0.85);
    border-radius: 50px; z-index: 0; pointer-events: none;
  }
  .cloud::before, .cloud::after {
    content:''; position:absolute; background: rgba(255,255,255,0.85); border-radius:50%;
  }
  .c1 { width:70px; height:26px; top:60px; left:18px; }
  .c1::before{ width:34px; height:34px; top:-16px; left:10px; }
  .c1::after{ width:26px; height:26px; top:-12px; left:38px; }
  .c2 { width:54px; height:20px; top:118px; left:60%; opacity:0.7; }
  .c2::before{ width:26px; height:26px; top:-12px; left:8px; }

  /* 헤더 */
  header {
    flex: 0 0 auto;
    text-align: center;
    padding: 14px 12px 8px;
    z-index: 2;
  }
  header h1 {
    font-size: 30px;
    color: var(--ink);
    text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(0,0,0,0.08);
    letter-spacing: 1px;
  }
  header .deco { font-size: 22px; }

  /* 대화창 */
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 1;
  }
  .row { display: flex; align-items: flex-end; gap: 8px; animation: pop .3s ease; }
  .row.me { flex-direction: row-reverse; }
  @keyframes pop { from { opacity:0; transform: translateY(12px) scale(.9);} to {opacity:1; transform:none;} }
  .avatar {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  .avatar.bot { background: var(--sky); }
  .avatar.me { background: var(--coral); }
  .bubble {
    max-width: 72%;
    padding: 14px 18px;
    border-radius: 22px;
    font-size: 26px;
    line-height: 1.35;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    word-break: keep-all;
  }
  .bubble.bot { background: var(--bubble-bot); border-bottom-left-radius: 6px; }
  .bubble.me { background: var(--bubble-me); border-bottom-right-radius: 6px; }
  .bubble.system {
    background: #FFE3D6; font-size: 20px; max-width: 86%;
    align-self: center; border-radius: 18px; text-align:center;
  }
  .bubble .word { font-size: 34px; color: var(--sky-deep); }
  .bubble.me .word { color: var(--coral); }
  .hint-words { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; justify-content:center;}
  .hint-chip {
    background: var(--sun); padding: 6px 14px; border-radius: 14px; font-size: 22px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.12);
  }
  .last-char {
    display:inline-block; background: var(--grass); color:#fff; border-radius: 10px;
    padding: 0 8px; margin: 0 2px;
  }

  /* 입력 표시줄 */
  #inputbar {
    flex: 0 0 auto;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(4px);
    border-top: 3px solid #fff;
    padding: 8px 12px;
    z-index: 3;
  }
  #display {
    min-height: 54px;
    background: #fff;
    border-radius: 16px;
    border: 3px dashed var(--sky-deep);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: var(--ink); margin-bottom: 8px;
    padding: 4px 12px;
  }
  #display .placeholder { color: #C9BCA8; font-size: 22px; }
  #display .cursor { color: var(--coral); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 키보드 */
  #keyboard { display: flex; flex-direction: column; gap: 6px; }
  .krow { display: flex; gap: 6px; justify-content: center; }
  .key {
    flex: 1 1 0;
    min-width: 0;
    height: 50px;
    border: none;
    border-radius: 12px;
    background: #fff;
    font-family: 'Jua', sans-serif;
    font-size: 26px;
    color: var(--ink);
    box-shadow: 0 4px 0 #D9CBB2;
    cursor: pointer;
    transition: transform .05s, box-shadow .05s;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 #D9CBB2; }
  .key { position: relative; }
  .key .badge {
    position: absolute; top: 2px; right: 5px;
    font-size: 13px; color: var(--coral);
  }
  .key.wide { flex: 1.6 1 0; }
  .key.back { background: var(--coral); color:#fff; box-shadow: 0 4px 0 #D9694A; }
  .key.back:active { box-shadow: 0 1px 0 #D9694A; }

  /* 하단 액션 버튼 */
  #actions { display: flex; gap: 8px; margin-top: 8px; }
  .act {
    flex: 1; height: 62px; border: none; border-radius: 18px;
    font-family: 'Jua', sans-serif; font-size: 24px; color:#fff; cursor: pointer;
    display:flex; align-items:center; justify-content:center; gap:6px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    transition: transform .05s, box-shadow .05s;
  }
  .act:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .act.send { background: var(--grass); box-shadow: 0 5px 0 var(--grass-deep); }
  .act.hint { background: var(--sun); color: var(--ink); box-shadow: 0 5px 0 #D9A800; }
  .act.mic { background: var(--sky-deep); box-shadow: 0 5px 0 #2E89BD; flex: 0 0 64px; }
  .act.mic.listening { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }

  /* 결과 화면 */
  #result {
    position: absolute; inset: 0; z-index: 10;
    background: linear-gradient(180deg, #FFD23F 0%, #FF8C66 100%);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 18px;
  }
  #result.show { display: flex; animation: pop .4s ease; }
  #result h2 { font-size: 40px; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,0.15); }
  #result .count { font-size: 26px; color: var(--ink); background:#fff; padding:8px 20px; border-radius: 20px; }
  #result .chain {
    background: rgba(255,255,255,0.9); border-radius: 20px; padding: 16px;
    font-size: 24px; line-height: 1.8; max-width: 100%; max-height: 40vh; overflow-y:auto;
    word-break: keep-all;
  }
  #result .chain .arrow { color: var(--coral); }
  #result .restart {
    height: 70px; padding: 0 40px; border:none; border-radius: 22px;
    background: var(--grass); color:#fff; font-family:'Jua',sans-serif; font-size: 30px;
    box-shadow: 0 6px 0 var(--grass-deep); cursor:pointer;
  }
  #result .restart:active { transform: translateY(3px); box-shadow:0 3px 0 var(--grass-deep); }

  /* 끝내기(결과 보기) 작은 버튼 */
  #finishBtn {
    position:absolute; top:16px; right:14px; z-index:4;
    background:#fff; border:none; border-radius:14px; padding:6px 14px;
    font-family:'Jua',sans-serif; font-size:18px; color:var(--ink);
    box-shadow:0 3px 0 rgba(0,0,0,0.12); cursor:pointer;
  }
  #finishBtn:active { transform: translateY(2px); }
</style>
</head>
<body>
<div id="app">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>

  <header>
    <h1><span class="deco">🐣</span> 끝말잇기 놀이 <span class="deco">🌈</span></h1>
  </header>
  <button id="finishBtn">그만할래요</button>

  <div id="chat"></div>

  <div id="inputbar">
    <div id="display"><span class="placeholder">여기에 단어가 나와요</span></div>
    <div id="keyboard"></div>
    <div id="actions">
      <button class="act mic" id="micBtn" title="말하기">🎤</button>
      <button class="act hint" id="hintBtn">💡 힌트</button>
      <button class="act send" id="sendBtn">✅ 정답!</button>
    </div>
  </div>

  <div id="result">
    <h2>🎉 잘했어요! 🎉</h2>
    <div class="count" id="resultCount"></div>
    <div class="chain" id="resultChain"></div>
    <button class="restart" id="restartBtn">🔄 다시 하기</button>
  </div>
</div>

<script>
/* ===========================================================
   단어 사전 — 쉬운 일상 단어 위주.
   '으뜸 글자'(첫 글자)별로 묶어두어 봇이 고르고 힌트를 줄 때 사용.
   끝 글자가 ㄹ/ㅋ 등 어려운 받침으로 끝나는 단어는 넣지 않음.
   =========================================================== */
const WORDS = [
  "사과","과자","자전거","거북이","이불","불고기","기차","차표","표범","범벅",
  "나무","무지개","개나리","리본","본드","드럼","머리","리어카","카메라","라면",
  "면도","도토리","토끼","끼니","니은","바나나","나비","비누","누나","나라",
  "라디오","오리","리스","스키","키위","위인","인사","사자","자두","두부",
  "부엉이","이마","마차","차도","도시","시소","소나기","기린","린스","스님",
  "사탕","탕수육","육지","지구","구두","두더지","지우개","개구리","리코더","더위",
  "위로","로봇","봇짐","짐승","승강기","기와","와플","플라스틱","틱장난",
  "참외","외투","투수","수박","박수","수영","영어","어부","부채","채소",
  "소금","금붕어","어항","항구","구슬","슬리퍼","퍼즐","즐거움","움막",
  "감자","자물쇠","쇠고기","기와집","집게","게으름","음악","악어","어린이","이마트",
  "토마토","토스트","트럭","럭비","비행기","기차역","역기","기침","침대","대추",
  "추석","석류","류현진","진주","주사위","위성","성냥","냥이","이야기","기저귀",
  "구름","음료수","수도","도라지","지렁이","이슬","슬픔","픔새",
  "거미","미소","소라","라일락","락카","카드","드레스","스웨터","터널","널빤지",
  "딸기","기차표","표지판","판다","다람쥐","쥐포","포도","도장","장미","미역",
  "역사","사슴","슴베","베개","개미","미꾸라지","지팡이","이파리","리어카","카레",
  "양파","파리","리듬","듬뿍","뿍새","새우","우산","산토끼","끼리","리코더",
  "호랑이","이끼","끼치","치즈","즈믄","믄날","바위","위인전","전화","화분",
  "분수","수레","레몬","몬스터","터미널","널뛰기","기러기","기름","름새",
  "초록","록담","담요","요리","리어카","카누","누에","에어컨","컨디션","션샤인",
  "별","별똥","똥차","차고","고래","래미안","안경","경찰","찰떡","떡국",
  "국수","수박씨","씨앗","앗차","차차차","책상","상자","자석","석탑","탑돌이"
];

// 끝 글자가 어려운 받침(ㄹ,ㅋ 등)으로 끝나면 봇이 잇기 부담 → 봇은 그런 단어로 잇지 않음
// (위 목록은 대부분 안전. 추가로 한 글자 단어/너무 어려운 단어는 사전 자체에서 배제)

// 빠른 조회용: 첫 글자별 단어 묶음
const byFirst = {};
for (const w of WORDS) {
  if (w.length < 2) continue;
  const f = w[0];
  (byFirst[f] = byFirst[f] || []).push(w);
}

/* ---------- 한글 두벌식 자판 조합 엔진 ---------- */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
// 모음 합성 (ㅗ+ㅏ=ㅘ 등)
const JUNG_COMBINE = {"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
// 받침 합성
const JONG_COMBINE = {"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
// 받침 분해 (지우기 / 다음 글자 초성으로 넘길 때)
const JONG_SPLIT = {"ㄳ":["ㄱ","ㅅ"],"ㄵ":["ㄴ","ㅈ"],"ㄶ":["ㄴ","ㅎ"],"ㄺ":["ㄹ","ㄱ"],"ㄻ":["ㄹ","ㅁ"],"ㄼ":["ㄹ","ㅂ"],"ㄽ":["ㄹ","ㅅ"],"ㄾ":["ㄹ","ㅌ"],"ㄿ":["ㄹ","ㅍ"],"ㅀ":["ㄹ","ㅎ"],"ㅄ":["ㅂ","ㅅ"]};

function compose(cho, jung, jong) {
  const ci = CHO.indexOf(cho), ji = JUNG.indexOf(jung), ki = JONG.indexOf(jong||"");
  if (ci<0||ji<0||ki<0) return null;
  return String.fromCharCode(0xAC00 + (ci*21 + ji)*28 + ki);
}
function decompose(ch) {
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return null;
  return { cho: CHO[Math.floor(code/588)], jung: JUNG[Math.floor((code%588)/28)], jong: JONG[code%28] };
}

// 조합 상태
let text = "";        // 완성된 앞부분
let buf = null;       // 조합 중인 글자 {cho,jung,jong}

function bufToChar() {
  if (!buf) return "";
  if (buf.cho && buf.jung) return compose(buf.cho, buf.jung, buf.jong) || "";
  return buf.cho || ""; // 자음만 입력된 상태
}
function currentInput() { return text + bufToChar(); }

function isConsonant(j) { return CHO.includes(j) && !JUNG.includes(j); }
function isVowel(j) { return JUNG.includes(j); }

// 같은 자음을 두 번 누르면 쌍자음으로 (휴대폰 자판처럼)
const DOUBLE = { "ㄱ":"ㄲ", "ㄷ":"ㄸ", "ㅂ":"ㅃ", "ㅅ":"ㅆ", "ㅈ":"ㅉ" };
// 받침으로 쓸 수 있는 쌍자음
const DOUBLE_JONG = { "ㄱ":"ㄲ", "ㅅ":"ㅆ" };

function inputJamo(j) {
  if (!buf) {
    if (isVowel(j)) { text += j; return; } // 모음 단독은 그냥 글자로
    buf = { cho: j, jung: "", jong: "" };
    return;
  }
  if (isConsonant(j)) {
    if (!buf.jung) {
      // 초성만 있는 상태에서 같은 자음을 또 누르면 → 쌍자음
      if (DOUBLE[buf.cho] === DOUBLE[j] && buf.cho === j) { buf.cho = DOUBLE[j]; return; }
      // 다른 자음이면 앞글자 확정, 새 글자 시작
      text += buf.cho; buf = { cho: j, jung: "", jong: "" }; return;
    }
    if (!buf.jong) {
      if (JONG.includes(j)) { buf.jong = j; } else { text += bufToChar(); buf={cho:j,jung:"",jong:""}; }
      return;
    }
    // 받침과 같은 자음을 또 누르면 → 받침을 떼어 쌍자음 초성으로 새 글자 시작
    if (buf.jong === j && DOUBLE[j]) {
      buf.jong = "";
      text += bufToChar();
      buf = { cho: DOUBLE[j], jung: "", jong: "" };
      return;
    }
    // 받침 합성 시도
    const combo = JONG_COMBINE[buf.jong + j];
    if (combo) { buf.jong = combo; return; }
    // 안되면 새 글자
    text += bufToChar(); buf = { cho: j, jung: "", jong: "" }; return;
  }
  if (isVowel(j)) {
    if (!buf.jung) {
      if (buf.cho) { buf.jung = j; return; }
      text += j; return;
    }
    // 받침이 없을 때만 모음 합성 (ㅘ 등)
    if (!buf.jong) {
      const combo = JUNG_COMBINE[buf.jung + j];
      if (combo) { buf.jung = combo; return; }
      // 받침 없이 모음 또 → 새 글자(모음 단독)
      text += bufToChar(); buf=null; text += j; return;
    }
    // 받침을 다음 글자 초성으로 넘김
    let moved = buf.jong, prev = "";
    if (JONG_SPLIT[buf.jong]) { [prev, moved] = JONG_SPLIT[buf.jong]; }
    buf.jong = prev;
    text += bufToChar();
    buf = { cho: moved, jung: j, jong: "" };
    return;
  }
}

function backspace() {
  if (buf) {
    if (buf.jong) {
      if (JONG_SPLIT[buf.jong]) buf.jong = JONG_SPLIT[buf.jong][0];
      else buf.jong = "";
    } else if (buf.jung) {
      // 합성모음 분해는 생략하고 통째로 제거
      buf.jung = "";
    } else if (buf.cho) {
      buf = null;
    }
    if (buf && !buf.cho && !buf.jung && !buf.jong) buf = null;
  } else if (text.length) {
    // 마지막 완성 글자를 조합상태로 되돌리지 않고 단순 삭제(아이용 단순화)
    text = text.slice(0, -1);
  }
}
function clearInput() { text=""; buf=null; }

/* ---------- 화면 그리기 ---------- */
const chatEl = document.getElementById('chat');
const displayEl = document.getElementById('display');
const kbEl = document.getElementById('keyboard');

const KB_LAYOUT = [
  ["ㅂ","ㅈ","ㄷ","ㄱ","ㅅ","ㅛ","ㅕ","ㅑ","ㅐ","ㅔ"],
  ["ㅁ","ㄴ","ㅇ","ㄹ","ㅎ","ㅗ","ㅓ","ㅏ","ㅣ"],
  ["ㅋ","ㅌ","ㅊ","ㅍ","ㅠ","ㅜ","ㅡ"]
];
function buildKeyboard() {
  kbEl.innerHTML = "";
  KB_LAYOUT.forEach((rowKeys, idx) => {
    const row = document.createElement('div'); row.className='krow';
    rowKeys.forEach(k => {
      const b = document.createElement('button'); b.className='key';
      if (DOUBLE[k]) {
        // 두 번 누르면 쌍자음이 되는 키에 작은 안내 표시
        b.innerHTML = `<span class="badge">${DOUBLE[k]}</span>${k}`;
      } else {
        b.textContent = k;
      }
      b.addEventListener('click', () => { inputJamo(k); renderDisplay(); });
      row.appendChild(b);
    });
    if (idx === 2) {
      const back = document.createElement('button');
      back.className='key wide back'; back.textContent='⌫ 지우기';
      back.addEventListener('click', () => { backspace(); renderDisplay(); });
      row.appendChild(back);
    }
    kbEl.appendChild(row);
  });
}
function renderDisplay() {
  const v = currentInput();
  if (!v) { displayEl.innerHTML = '<span class="placeholder">여기에 단어가 나와요</span>'; return; }
  displayEl.innerHTML = v + '<span class="cursor">|</span>';
}

function addBubble(side, html, type) {
  const row = document.createElement('div');
  row.className = 'row ' + (side==='me'?'me':'');
  if (type === 'system') {
    const b = document.createElement('div'); b.className='bubble system'; b.innerHTML = html;
    row.style.justifyContent='center'; row.appendChild(b);
  } else {
    const av = document.createElement('div');
    av.className = 'avatar ' + (side==='me'?'me':'bot');
    av.textContent = side==='me' ? '🧒' : '🐥';
    const b = document.createElement('div');
    b.className = 'bubble ' + (side==='me'?'me':'bot');
    b.innerHTML = html;
    row.appendChild(av); row.appendChild(b);
  }
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

/* ---------- 게임 로직 ---------- */
let usedWords = new Set();     // 이미 쓴 단어
let chain = [];                // 주고받은 순서
let lastChar = "";             // 이어야 할 글자
let speakOn = true;

function speak(t) {
  if (!speakOn || !('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ko-KR'; u.rate = 0.95; u.pitch = 1.15;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch(e){}
}

function lastSyllable(word) { return word[word.length-1]; }

// 봇이 lastChar로 시작하는, 아직 안 쓴 단어 고르기
function botPick(startChar) {
  const cands = (byFirst[startChar] || []).filter(w => !usedWords.has(w));
  if (cands.length === 0) return null;
  return cands[Math.floor(Math.random()*cands.length)];
}

function pushWord(side, word) {
  usedWords.add(word);
  chain.push(word);
  lastChar = lastSyllable(word);
}

function startGame() {
  chatEl.innerHTML = "";
  usedWords = new Set(); chain = []; clearInput(); renderDisplay();
  document.getElementById('result').classList.remove('show');

  addBubble('bot', '안녕! 나랑 끝말잇기 하자 🌟<br>내가 먼저 시작할게!', null);
  addBubble('system', 'ㄲ·ㄸ·ㅃ·ㅆ·ㅉ는 ㄱ·ㄷ·ㅂ·ㅅ·ㅈ를 두 번 누르면 나와요! 😊', 'system');
  // 시작 단어: 쉬운 단어 중 끝글자로 이어갈 후보가 있는 것
  const startPool = ["사과","바나나","나무","토끼","구두","사자","호랑이","포도","수박","기차"];
  let first = startPool[Math.floor(Math.random()*startPool.length)];
  if (usedWords.has(first)) first = "사과";
  setTimeout(() => {
    pushWord('bot', first);
    addBubble('bot', `<span class="word">${first}!</span>`, null);
    promptNext();
    speak(first);
  }, 700);
}

function promptNext() {
  addBubble('system', `이제 <span class="last-char">${lastChar}</span> (으)로 시작하는 단어를 말해 볼까요?`, 'system');
}

function submitWord() {
  const word = currentInput().trim();
  if (!word) { addBubble('system','단어를 먼저 적어 주세요 ✏️','system'); return; }
  if (word.length < 2) {
    addBubble('system','두 글자 이상인 단어로 해 볼까요? 😊','system'); return;
  }
  // 첫 글자 검사
  if (word[0] !== lastChar) {
    addBubble('me', `<span class="word">${word}</span>`, null);
    addBubble('bot', `이런! <span class="last-char">${lastChar}</span> (으)로 시작해야 해요. 다시 해 볼까요? 💪`, null);
    clearInput(); renderDisplay(); return;
  }
  // 중복 검사
  if (usedWords.has(word)) {
    addBubble('me', `<span class="word">${word}</span>`, null);
    addBubble('bot', `그 단어는 아까 썼어요. 다른 단어를 떠올려 볼까요? 🤔`, null);
    clearInput(); renderDisplay(); return;
  }
  // 사전에 없는 단어도 일단 받아줌(아이 격려) — 단, 봇이 이어야 하니 너무 어려운 끝글자면 칭찬 후 새 시작
  pushWord('me', word);
  addBubble('me', `<span class="word">${word}</span>`, null);
  speak(word);
  clearInput(); renderDisplay();

  // 봇 차례
  setTimeout(() => {
    const next = botPick(lastChar);
    if (!next) {
      addBubble('bot', `우아~ <span class="last-char">${lastChar}</span> 로 시작하는 단어가 떠오르지 않아요. 네가 이겼어요! 🏆`, null);
      setTimeout(showResult, 900);
      return;
    }
    pushWord('bot', next);
    addBubble('bot', `<span class="word">${next}!</span>`, null);
    speak(next);
    promptNext();
  }, 800);
}

function giveHint() {
  const cands = (byFirst[lastChar] || []).filter(w => !usedWords.has(w));
  if (cands.length === 0) {
    addBubble('bot', `<span class="last-char">${lastChar}</span> (으)로 시작하는 단어가 잘 안 떠오르네요. 아무 단어나 좋아요! 😄`, null);
    return;
  }
  // 두세 개 살짝 보여주기
  const picks = [];
  const shuffled = [...cands].sort(()=>Math.random()-0.5);
  for (const w of shuffled) { if (picks.length>=3) break; picks.push(w); }
  const chips = picks.map(w=>`<span class="hint-chip">${w}</span>`).join("");
  addBubble('bot', `힌트예요! 💡 <div class="hint-words">${chips}</div>`, null);
  speak("힌트는 " + picks.join(", "));
}

/* ---------- 음성 입력 ---------- */
let recog = null, listening = false;
function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if (!SR) {
    micBtn.addEventListener('click', () => {
      addBubble('system','이 기기에서는 말하기 기능을 쓸 수 없어요. 자판으로 입력해 주세요 😊','system');
    });
    return;
  }
  recog = new SR();
  recog.lang = 'ko-KR'; recog.interimResults = false; recog.maxAlternatives = 1;
  micBtn.addEventListener('click', () => {
    if (listening) { recog.stop(); return; }
    try { recog.start(); } catch(e){}
  });
  recog.onstart = () => { listening = true; micBtn.classList.add('listening'); micBtn.textContent='👂'; };
  recog.onend = () => { listening = false; micBtn.classList.remove('listening'); micBtn.textContent='🎤'; };
  recog.onerror = () => { listening = false; micBtn.classList.remove('listening'); micBtn.textContent='🎤'; };
  recog.onresult = (e) => {
    let said = (e.results[0][0].transcript || "").replace(/[^가-힣]/g,'');
    if (said) { text = said; buf = null; renderDisplay(); }
  };
}

/* ---------- 결과 ---------- */
function showResult() {
  const myWords = chain.filter((_,i)=> i%2===1).length;
  document.getElementById('resultCount').textContent = `우리가 함께 만든 단어 ${chain.length}개!`;
  document.getElementById('resultChain').innerHTML =
    chain.map(w=>`<span>${w}</span>`).join('<span class="arrow"> → </span>');
  document.getElementById('result').classList.add('show');
  speak("정말 잘했어요!");
}

/* ---------- 이벤트 연결 ---------- */
document.getElementById('sendBtn').addEventListener('click', submitWord);
document.getElementById('hintBtn').addEventListener('click', giveHint);
document.getElementById('finishBtn').addEventListener('click', () => {
  if (chain.length === 0) { startGame(); return; }
  showResult();
});
document.getElementById('restartBtn').addEventListener('click', startGame);

buildKeyboard();
setupMic();
startGame();
</script>
