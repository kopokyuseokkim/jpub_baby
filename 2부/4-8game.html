<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🍕 피자 나눗셈 게임</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Jua', 'Arial Rounded MT Bold', sans-serif;
    background: linear-gradient(160deg, #fff9f0 0%, #fff3e0 50%, #ffecd2 100%);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
  }
  #game-container {
    max-width: 420px;
    margin: 0 auto;
    padding: 10px 10px 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 8px 16px;
    background: #ff7043;
    border-radius: 22px;
    box-shadow: 0 4px 14px rgba(255,112,67,0.4);
  }
  .score-box {
    font-size: 13px;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.2;
  }
  .score-num { font-size: 28px; color: #ffe082; }
  .title-text { font-size: 20px; color: #fff; text-align: center; }
  .progress-row { display: flex; gap: 6px; justify-content: center; }
  .prog-dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: #ffccbc; transition: background 0.3s, transform 0.2s;
  }
  .prog-dot.done-correct { background: #66bb6a; }
  .prog-dot.done-wrong   { background: #ef5350; }
  .prog-dot.current      { background: #ff7043; transform: scale(1.4); }
  .pizza-area {
    display: flex; flex-direction: column;
    align-items: center; gap: 4px; width: 100%;
  }
  .section-label {
    font-size: 14px; font-weight: bold;
    padding: 3px 14px; border-radius: 14px;
  }
  .pizza-label { color: #bf360c; background: #ffe0b2; }
  #pizza-svg-wrap { width: 175px; height: 175px; }
  .question-box {
    width: 100%; background: #fff;
    border-radius: 22px; padding: 12px 14px 10px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(255,112,67,0.13);
    border: 2.5px solid #ffcc80;
  }
  .question-text { font-size: 15px; color: #5d4037; line-height: 1.6; }
  .question-math { font-size: 28px; color: #e64a19; margin-top: 4px; letter-spacing: 2px; }
  .choices-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; width: 100%; padding: 0 2px;
  }
  .choice-btn {
    background: linear-gradient(135deg, #ff7043, #ff8a65);
    color: #fff; border: none; border-radius: 20px;
    font-family: inherit; font-size: 34px;
    padding: 16px 10px; cursor: pointer;
    box-shadow: 0 5px 0 #bf360c, 0 6px 14px rgba(255,112,67,0.25);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .choice-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #bf360c; }
  .choice-btn.correct {
    background: linear-gradient(135deg, #43a047, #66bb6a);
    box-shadow: 0 5px 0 #2e7d32;
    animation: correctPop 0.4s ease;
  }
  .choice-btn.wrong {
    background: linear-gradient(135deg, #e53935, #ef5350);
    box-shadow: 0 5px 0 #b71c1c;
    animation: shake 0.4s ease;
  }
  @keyframes correctPop {
    0%{transform:scale(1)} 40%{transform:scale(1.13)} 100%{transform:scale(1)}
  }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)}
  }
  .feedback-banner {
    width: 100%; text-align: center;
    font-size: 17px; padding: 10px 14px;
    border-radius: 18px;
    opacity: 0; transform: scale(0.9);
    transition: opacity 0.3s, transform 0.3s;
    min-height: 46px; line-height: 1.4;
  }
  .feedback-banner.show { opacity: 1; transform: scale(1); }
  .feedback-banner.correct { background: #e8f5e9; color: #2e7d32; border: 2px solid #a5d6a7; }
  .feedback-banner.wrong   { background: #fff3e0; color: #e65100; border: 2px solid #ffcc80; }
  .friends-area {
    display: flex; flex-direction: column;
    align-items: center; gap: 5px; width: 100%;
  }
  .friends-label { color: #4527a0; background: #ede7f6; }
  .friends-row {
    display: flex; justify-content: center;
    gap: 6px; flex-wrap: wrap; width: 100%;
  }
  .friend-box {
    display: flex; flex-direction: column;
    align-items: center; gap: 1px;
  }
  .friend-svg { display: block; }
  .plate-area { position: relative; width: 54px; height: 32px; }
  .plate-svg-wrap { position: absolute; bottom: 0; left: 0; width: 54px; height: 22px; }
  .slice-count {
    position: absolute; bottom: 18px;
    font-size: 11px; text-align: center; width: 100%;
    opacity: 0; transform: scale(0.5) translateY(-8px);
    transition: opacity 0.3s, transform 0.3s;
    line-height: 1.1;
  }
  .slice-count.visible { opacity: 1; transform: scale(1) translateY(0); }
  .friend-name { font-size: 11px; color: #795548; margin-top: 2px; }
  /* Result */
  #result-screen {
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px; text-align: center;
    width: 100%; min-height: 100vh; padding: 30px 20px;
    background: linear-gradient(160deg, #fff9f0, #ffecd2);
  }
  .result-emoji { font-size: 76px; animation: bounce 1s infinite alternate; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-16px)} }
  .result-title { font-size: 30px; color: #e64a19; }
  .result-score-box {
    font-size: 22px; color: #5d4037;
    background: #fff; border-radius: 22px;
    padding: 16px 32px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    border: 2px solid #ffcc80;
  }
  .result-msg { font-size: 17px; color: #795548; max-width: 290px; line-height: 1.7; }
  .retry-btn {
    background: linear-gradient(135deg, #ff7043, #ff8a65);
    color: #fff; border: none; border-radius: 26px;
    font-family: inherit; font-size: 22px;
    padding: 17px 44px; cursor: pointer;
    box-shadow: 0 5px 0 #bf360c;
    transition: transform 0.1s;
  }
  .retry-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #bf360c; }
</style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <div class="score-box">
      <span style="font-size:12px">점수</span>
      <span class="score-num" id="score-display">0</span>
    </div>
    <div class="title-text">🍕 피자 나눗셈</div>
    <div class="score-box">
      <span style="font-size:12px">문제</span>
      <span class="score-num" id="qnum-display">1/10</span>
    </div>
  </div>

  <div class="progress-row" id="progress-row"></div>

  <div class="pizza-area">
    <div class="section-label pizza-label" id="pizza-label">🍕 피자</div>
    <div id="pizza-svg-wrap"></div>
  </div>

  <div class="question-box">
    <div class="question-text" id="question-text"></div>
    <div class="question-math" id="question-math"></div>
  </div>

  <div class="choices-grid" id="choices-grid"></div>

  <div class="feedback-banner" id="feedback-banner"></div>

  <div class="friends-area">
    <div class="section-label friends-label" id="friends-label">👧 친구들 👦</div>
    <div class="friends-row" id="friends-row"></div>
  </div>
</div>

<div id="result-screen">
  <div class="result-emoji" id="result-emoji">🎉</div>
  <div class="result-title">10문제 다 풀었어요!</div>
  <div class="result-score-box" id="result-score"></div>
  <div class="result-msg" id="result-msg"></div>
  <button class="retry-btn" onclick="startGame()">🔄 다시 하기!</button>
</div>

<script>
/* ===== Problem generation ===== */
let PROBLEMS = [], currentQ = 0, score = 0, answered = false, results = [];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateProblems() {
  const pool = [];
  for (let d = 2; d <= 9; d++)
    for (let q = 2; q <= 9; q++) {
      const t = d * q;
      if (t >= 6 && t <= 48) pool.push({ total: t, divisor: d, answer: q });
    }
  PROBLEMS = shuffle(pool).slice(0, 10);
}

function makeChoices(answer, total) {
  const wrongs = shuffle(
    Array.from({length: 20}, (_, i) => i + 1)
      .filter(v => v !== answer)
  ).slice(0, 3);
  return [answer, ...wrongs].sort((a, b) => a - b);
}

/* ===== SVG Helpers ===== */
function pizzaSVG(total, eaten) {
  const cx = 87, cy = 87, r = 80;
  const step = 2 * Math.PI / total;
  const cols = ['#ff7043','#ff8a65','#ffa07a','#ff6b35','#e8602c','#ff9e80'];
  let paths = '';
  for (let i = 0; i < total; i++) {
    const a0 = i * step - Math.PI / 2;
    const a1 = a0 + step;
    const x1 = (cx + r * Math.cos(a0)).toFixed(1);
    const y1 = (cy + r * Math.sin(a0)).toFixed(1);
    const x2 = (cx + r * Math.cos(a1)).toFixed(1);
    const y2 = (cy + r * Math.sin(a1)).toFixed(1);
    const lg = step > Math.PI ? 1 : 0;
    const fill = i < eaten ? '#d0d0d0' : cols[i % cols.length];
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${lg} 1 ${x2},${y2} Z" fill="${fill}" stroke="#fff" stroke-width="2.5"/>`;
    if (i >= eaten) {
      const ma = a0 + step / 2;
      const dr = r * 0.55;
      const dx = (cx + dr * Math.cos(ma)).toFixed(1);
      const dy = (cy + dr * Math.sin(ma)).toFixed(1);
      paths += `<circle cx="${dx}" cy="${dy}" r="4.5" fill="#ffe082" opacity="0.8"/>`;
    }
  }
  return `<svg viewBox="0 0 174 174" xmlns="http://www.w3.org/2000/svg" style="width:175px;height:175px;filter:drop-shadow(0 6px 18px rgba(255,112,67,0.3))">
    <circle cx="${cx}" cy="${cy}" r="${r+1}" fill="none" stroke="#ffcc80" stroke-width="6" opacity="0.5"/>
    ${paths}
    <circle cx="${cx}" cy="${cy}" r="7" fill="#fff" stroke="#ffb74d" stroke-width="2"/>
  </svg>`;
}

function friendSVG(i) {
  const skins  = ['#FFDBB4','#F4A460','#C68642','#FFE0BD','#F1C27D','#EFC081','#D4956B','#FFCBA4'];
  const shirts = ['#42a5f5','#ec407a','#66bb6a','#ab47bc','#ff7043','#26c6da','#ffa726','#5c6bc0'];
  const hairs  = ['#5d4037','#212121','#f57f17','#e65100','#1a237e','#880e4f'];
  const sk = skins[i % skins.length], sh = shirts[i % shirts.length], hr = hairs[i % hairs.length];
  return `<svg width="56" height="68" viewBox="0 0 56 68" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="28" cy="16" rx="13" ry="9" fill="${hr}"/>
    <circle cx="28" cy="21" r="13" fill="${sk}"/>
    <circle cx="23" cy="19.5" r="2.2" fill="#333"/>
    <circle cx="33" cy="19.5" r="2.2" fill="#333"/>
    <circle cx="23.8" cy="18.7" r="0.9" fill="#fff"/>
    <circle cx="33.8" cy="18.7" r="0.9" fill="#fff"/>
    <path d="M22,24 Q28,30 34,24" stroke="#c0392b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <ellipse cx="20" cy="23" rx="3" ry="2" fill="#ffb3ba" opacity="0.6"/>
    <ellipse cx="36" cy="23" rx="3" ry="2" fill="#ffb3ba" opacity="0.6"/>
    <rect x="16" y="33" width="24" height="22" rx="8" fill="${sh}"/>
    <rect x="6"  y="34" width="10" height="6" rx="3" fill="${sh}"/>
    <rect x="40" y="34" width="10" height="6" rx="3" fill="${sh}"/>
    <circle cx="9"  cy="42" r="4" fill="${sk}"/>
    <circle cx="47" cy="42" r="4" fill="${sk}"/>
  </svg>`;
}

function plateSVG() {
  return `<svg viewBox="0 0 54 22" xmlns="http://www.w3.org/2000/svg" style="width:54px;height:22px">
    <ellipse cx="27" cy="14" rx="25" ry="8" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1.5"/>
    <ellipse cx="27" cy="12" rx="21" ry="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
  </svg>`;
}

/* ===== Render ===== */
function renderProgress() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const d = document.createElement('div');
    d.className = 'prog-dot';
    if (i < currentQ) d.classList.add(results[i] ? 'done-correct' : 'done-wrong');
    else if (i === currentQ) d.classList.add('current');
    row.appendChild(d);
  }
}

function renderFriends(count, plates) {
  const names = ['지우','민준','서연','하준','지유','수빈','준서','예린','도윤','소율'];
  const row = document.getElementById('friends-row');
  row.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const box = document.createElement('div');
    box.className = 'friend-box';
    box.innerHTML = `
      <div>${friendSVG(i)}</div>
      <div class="plate-area">
        <div class="plate-svg-wrap">${plateSVG()}</div>
        <div class="slice-count${plates[i] ? ' visible' : ''}" id="plate-slice-${i}">
          ${sliceText(plates[i] || 0)}
        </div>
      </div>
      <div class="friend-name">${names[i]}</div>`;
    row.appendChild(box);
  }
}

function sliceText(n) {
  if (n === 0) return '';
  if (n <= 3) return '🍕'.repeat(n);
  return `🍕×${n}`;
}

function renderQuestion() {
  answered = false;
  const p = PROBLEMS[currentQ];

  document.getElementById('score-display').textContent = score;
  document.getElementById('qnum-display').textContent = `${currentQ + 1}/10`;
  document.getElementById('pizza-label').textContent = `🍕 피자 ${p.total}조각`;
  document.getElementById('pizza-svg-wrap').innerHTML = pizzaSVG(p.total, 0);
  document.getElementById('question-text').textContent = `피자 ${p.total}조각을 친구 ${p.divisor}명에게\n똑같이 나누면?`;
  document.getElementById('question-math').textContent = `${p.total} ÷ ${p.divisor} = ?`;
  document.getElementById('friends-label').textContent = `👧 친구 ${p.divisor}명 👦`;

  const grid = document.getElementById('choices-grid');
  grid.innerHTML = '';
  makeChoices(p.answer, p.total).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c;
    btn.onclick = () => onAnswer(c, btn);
    grid.appendChild(btn);
  });

  const fb = document.getElementById('feedback-banner');
  fb.className = 'feedback-banner';
  fb.textContent = '';

  renderFriends(p.divisor, []);
}

function onAnswer(chosen, btn) {
  if (answered) return;
  answered = true;
  const p = PROBLEMS[currentQ];
  const ok = chosen === p.answer;

  document.querySelectorAll('.choice-btn').forEach(b => b.style.pointerEvents = 'none');

  if (ok) {
    btn.classList.add('correct');
    score++;
    results.push(true);
    showFeedback(true);
    animateDistribute(p.total, p.divisor);
  } else {
    btn.classList.add('wrong');
    results.push(false);
    showFeedback(false);
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (+b.textContent === p.answer) b.classList.add('correct');
    });
    setTimeout(nextQ, 2200);
  }
}

function showFeedback(ok) {
  const fb = document.getElementById('feedback-banner');
  fb.className = 'feedback-banner show ' + (ok ? 'correct' : 'wrong');
  fb.textContent = ok
    ? '🎉 정답이에요! 맛있게 나눠 줬어요!'
    : '🤔 친구 수만큼 똑같이 나눠 볼까요?';
}

function animateDistribute(total, divisor) {
  const plates = new Array(divisor).fill(0);
  let step = 0;
  const delay = total <= 12 ? 280 : total <= 24 ? 190 : 140;

  function tick() {
    if (step >= total) { setTimeout(nextQ, 900); return; }
    const fi = step % divisor;
    plates[fi]++;
    document.getElementById('pizza-svg-wrap').innerHTML = pizzaSVG(total, step + 1);
    const el = document.getElementById(`plate-slice-${fi}`);
    if (el) {
      el.textContent = sliceText(plates[fi]);
      el.classList.add('visible');
      el.style.animation = 'none';
      el.offsetHeight;
      el.style.animation = 'correctPop 0.3s ease';
    }
    step++;
    setTimeout(tick, delay);
  }
  tick();
}

function nextQ() {
  currentQ++;
  renderProgress();
  if (currentQ >= 10) showResult();
  else renderQuestion();
}

function showResult() {
  document.getElementById('game-container').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'flex';
  document.getElementById('result-score').textContent = `10문제 중 ${score}개 정답! 🍕`;
  const emoji = document.getElementById('result-emoji');
  const msg   = document.getElementById('result-msg');
  if (score === 10)      { emoji.textContent = '🏆'; msg.textContent = '완벽해요! 나눗셈 천재네요! 어떤 문제도 척척 풀 수 있어요! 💪'; }
  else if (score >= 8)   { emoji.textContent = '🌟'; msg.textContent = '정말 잘했어요! 조금만 더 연습하면 만점이에요! 🍕'; }
  else if (score >= 6)   { emoji.textContent = '😊'; msg.textContent = '절반 넘게 맞혔어요! 피자 나눗셈 점점 잘하고 있어요!'; }
  else if (score >= 4)   { emoji.textContent = '😄'; msg.textContent = '잘 도전했어요! 다시 해보면 훨씬 더 잘할 수 있어요!'; }
  else                   { emoji.textContent = '🍕'; msg.textContent = '괜찮아요! 다시 도전해봐요. 응원해요! 파이팅! 🎉'; }
}

function startGame() {
  generateProblems();
  currentQ = 0; score = 0; answered = false; results = [];
  document.getElementById('game-container').style.display = 'flex';
  document.getElementById('result-screen').style.display = 'none';
  renderProgress();
  renderQuestion();
}

startGame();
</script>
</body>
</html>
