<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>풍선 덧셈 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#aee4ff;
    --sky-bot:#e9f9ff;
    --ink:#3a4a63;
    --sun:#ffd34d;
    --btn:#ff7aa8;
    --btn-press:#f0608f;
    --ok:#36c98d;
    --no:#ff8a5c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; width:100%;
    overflow:hidden; overscroll-behavior:none;
    font-family:'Jua','Gaegu',system-ui,sans-serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }
  body{
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 100%);
    position:fixed; inset:0;
  }

  /* 떠다니는 구름 (배경 장식) */
  .cloud{ position:absolute; background:#fff; border-radius:50%;
    box-shadow:40px 8px 0 -4px #fff, 80px 0 0 -6px #fff, -38px 10px 0 -6px #fff;
    opacity:.85; pointer-events:none; }

  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .hidden{ display:none !important; }

  /* ---------- 시작 화면 ---------- */
  #startScreen{ align-items:center; justify-content:center; text-align:center; gap:18px; }
  .sun{
    width:120px; height:120px; border-radius:50%;
    background:radial-gradient(circle at 38% 36%,#fff3b0,var(--sun));
    box-shadow:0 0 0 14px rgba(255,211,77,.28), 0 0 40px rgba(255,211,77,.5);
    margin-bottom:6px; animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .title{ font-size:clamp(38px,12vw,58px); line-height:1.05; margin:0; color:#ff6f9d;
    text-shadow:3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,.06); }
  .subtitle{ font-size:clamp(17px,5vw,22px); margin:0 24px; color:#5b6b86; line-height:1.5; }

  .bigbtn{
    border:none; cursor:pointer; color:#fff;
    font-family:inherit; font-size:clamp(24px,7vw,30px);
    padding:18px 46px; border-radius:999px;
    background:linear-gradient(180deg,#ff97b8,var(--btn));
    box-shadow:0 8px 0 var(--btn-press), 0 14px 22px rgba(240,96,143,.4);
    transition:transform .08s, box-shadow .08s;
  }
  .bigbtn:active{ transform:translateY(6px); box-shadow:0 2px 0 var(--btn-press),0 6px 12px rgba(240,96,143,.4); }

  /* ---------- 게임 화면 ---------- */
  #gameScreen{ display:none; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px 4px; gap:10px; z-index:5;
  }
  .pill{
    background:rgba(255,255,255,.8); border-radius:999px;
    padding:8px 16px; font-size:18px; color:#4a5b78;
    box-shadow:0 3px 8px rgba(70,100,140,.18);
  }
  .pill b{ color:#ff6f9d; }
  .icon-btn{
    width:46px; height:46px; border:none; border-radius:50%;
    background:rgba(255,255,255,.8); font-size:22px; cursor:pointer;
    box-shadow:0 3px 8px rgba(70,100,140,.18);
  }
  .quiz{
    margin:6px 16px 2px; text-align:center;
    background:#fff; border-radius:26px; padding:14px 10px;
    box-shadow:0 8px 0 rgba(160,200,230,.45);
    z-index:5;
  }
  .quiz .label{ font-size:16px; color:#8a9bb5; margin-bottom:2px; }
  .quiz .eq{ font-size:clamp(40px,13vw,60px); color:#3a4a63; letter-spacing:2px; }
  .quiz .eq .op{ color:#ff8a5c; }
  .quiz .eq .q{ color:#ff6f9d; }

  .playarea{ position:relative; flex:1; overflow:hidden; }

  /* 풍선 */
  .balloon{
    position:absolute; top:0; left:0;
    width:82px; height:98px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; will-change:transform; touch-action:manipulation;
  }
  .balloon .body{
    position:relative; width:82px; height:98px; border-radius:50% 50% 48% 48%;
    display:flex; align-items:center; justify-content:center;
    font-size:38px; color:#fff; text-shadow:0 2px 3px rgba(0,0,0,.25);
    box-shadow:inset -10px -12px 18px rgba(0,0,0,.16), inset 10px 10px 14px rgba(255,255,255,.45);
  }
  .balloon .body::before{ /* 반짝이는 하이라이트 */
    content:""; position:absolute; top:14px; left:16px;
    width:22px; height:30px; border-radius:50%;
    background:rgba(255,255,255,.6); filter:blur(1px); transform:rotate(-18deg);
  }
  .balloon .body::after{ /* 풍선 매듭 */
    content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    border-left:7px solid transparent; border-right:7px solid transparent;
    border-top:9px solid currentColor; opacity:.85;
  }
  .balloon .str{ position:absolute; bottom:-34px; left:50%; width:2px; height:30px;
    transform:translateX(-50%); background:rgba(255,255,255,.7); border-radius:2px; }

  .balloon.pop{ animation:pop .32s ease-out forwards; }
  @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(0); opacity:0} }

  /* 콩알 터짐 효과 */
  .spark{ position:absolute; width:10px; height:10px; border-radius:50%; pointer-events:none; }

  /* 응원 메시지 */
  .toast{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) scale(.6);
    background:#fff; padding:18px 30px; border-radius:26px; text-align:center;
    font-size:clamp(26px,8vw,38px); opacity:0; pointer-events:none; z-index:8;
    box-shadow:0 10px 30px rgba(60,90,130,.3); max-width:86vw;
  }
  .toast.ok{ color:var(--ok); }
  .toast.no{ color:var(--no); font-size:clamp(22px,6.5vw,30px); }
  .toast.show{ animation:toast 1.1s ease forwards; }
  @keyframes toast{
    0%{opacity:0; transform:translate(-50%,-50%) scale(.6)}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}
    30%{transform:translate(-50%,-50%) scale(1)}
    80%{opacity:1}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1)}
  }

  /* ---------- 결과 화면 ---------- */
  #endScreen{ align-items:center; justify-content:center; text-align:center; gap:14px; }
  .trophy{ font-size:96px; animation:bob 2.4s ease-in-out infinite; }
  .result-msg{ font-size:clamp(30px,9vw,44px); color:#ff6f9d; margin:0;
    text-shadow:2px 2px 0 #fff; }
  .result-sub{ font-size:clamp(18px,5.5vw,24px); color:#5b6b86; margin:2px 0; }
  .stars{ font-size:clamp(26px,8vw,38px); letter-spacing:4px; line-height:1.3; max-width:90vw; }
  .star-on{ color:#ffc83d; } .star-off{ color:#d7e3ee; }
</style>
</head>
<body>

  <!-- 배경 구름 -->
  <div class="cloud" style="top:12%; left:8%; width:54px; height:54px;"></div>
  <div class="cloud" style="top:26%; right:6%; width:42px; height:42px;"></div>
  <div class="cloud" style="bottom:16%; left:14%; width:48px; height:48px; opacity:.6;"></div>

  <!-- 시작 화면 -->
  <section id="startScreen" class="screen">
    <div class="sun"></div>
    <h1 class="title">풍선 덧셈 놀이</h1>
    <p class="subtitle">위에 나온 덧셈의 정답을<br>맞는 풍선을 콕! 터뜨려요 🎈<br>모두 10문제예요!</p>
    <button class="bigbtn" id="startBtn">시작하기</button>
  </section>

  <!-- 게임 화면 -->
  <section id="gameScreen" class="screen">
    <div class="topbar">
      <div class="pill">문제 <b><span id="qNum">1</span></b> / 10</div>
      <div class="pill">점수 <b><span id="score">0</span></b></div>
      <button class="icon-btn" id="muteBtn" title="소리 켜기/끄기">🔊</button>
    </div>
    <div class="quiz">
      <div class="label">정답 풍선을 터뜨려요!</div>
      <div class="eq" id="equation"></div>
    </div>
    <div class="playarea" id="playarea">
      <div class="toast" id="toast"></div>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="endScreen" class="screen hidden">
    <div class="trophy" id="trophy">🏆</div>
    <h2 class="result-msg" id="resultMsg"></h2>
    <p class="result-sub" id="resultScore"></p>
    <div class="stars" id="starsRow"></div>
    <p class="result-sub" id="resultStars"></p>
    <button class="bigbtn" id="againBtn">다시 하기</button>
  </section>

<script>
(function(){
  "use strict";

  // ---------- 화면 요소 ----------
  const startScreen = document.getElementById('startScreen');
  const gameScreen  = document.getElementById('gameScreen');
  const endScreen   = document.getElementById('endScreen');
  const playarea    = document.getElementById('playarea');
  const eqEl        = document.getElementById('equation');
  const qNumEl      = document.getElementById('qNum');
  const scoreEl     = document.getElementById('score');
  const toastEl     = document.getElementById('toast');
  const muteBtn     = document.getElementById('muteBtn');

  const PALETTE = ['#ff6b8a','#4cb8ff','#ffb13d','#56d98a','#b07bff','#ff9e4d','#21c7c7'];

  const TOTAL = 10;
  const BALLOON_W = 82, BALLOON_H = 98, WRAP_PAD = 60;

  let problems = [];
  let current = 0;
  let score = 0;
  let firstTryCorrect = 0;
  let mistakeThisQ = false;
  let balloons = [];
  let areaW = 0, areaH = 0;
  let rafId = null, lastT = 0, paused = true, running = false;

  // ---------- 소리 (Web Audio) ----------
  let audioCtx = null, muted = false;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
    }
    if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  }
  function tone(freq, start, dur, type, vol){
    if(!audioCtx || muted) return;
    const t0 = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type||'sine'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol||0.18, t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function soundCorrect(){ // 밝은 도-미-솔-도
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f, i*0.1, 0.25,'triangle',0.2));
  }
  function soundWrong(){ // 부드러운 낮은 두 음
    tone(392, 0, 0.18,'sine',0.16); tone(311.13, 0.14, 0.22,'sine',0.16);
  }
  function soundPop(){ tone(880, 0, 0.08,'triangle',0.14); }

  // ---------- 문제 만들기 ----------
  function makeProblems(){
    const list = [];
    for(let i=0;i<TOTAL;i++){
      let a,b;
      do{ a=1+Math.floor(Math.random()*9); b=1+Math.floor(Math.random()*9); }
      while(a+b>10);            // 손가락으로 세기 좋게 합은 10 이하
      const ans = a+b;
      // 정답 주변 숫자로 보기 4개 만들기
      const pool = [ans-2,ans-1,ans+1,ans+2,ans+3,ans-3]
        .filter(n=>n>=0 && n!==ans);
      const opts = [ans];
      while(opts.length<4 && pool.length){
        const k = Math.floor(Math.random()*pool.length);
        opts.push(pool.splice(k,1)[0]);
      }
      while(opts.length<4){ opts.push(ans+opts.length); } // 안전장치
      shuffle(opts);
      list.push({a,b,ans,opts});
    }
    return list;
  }
  function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

  // ---------- 풍선 만들기 ----------
  function measure(){ areaW = playarea.clientWidth; areaH = playarea.clientHeight; }

  function spawnBalloons(p){
    // 기존 풍선 제거
    balloons.forEach(b=> b.el.remove());
    balloons = [];
    measure();
    const colW = areaW/4;
    const cols = shuffle([0,1,2,3]);
    const palette = shuffle(PALETTE.slice());

    p.opts.forEach((val,i)=>{
      const el = document.createElement('div');
      el.className = 'balloon';
      const color = palette[i % palette.length];
      el.innerHTML =
        '<div class="body" style="background:radial-gradient(circle at 38% 30%, '
        + lighten(color) + ', ' + color + '); color:' + color + ';">'
        + '<span style="color:#fff">' + val + '</span></div>'
        + '<div class="str"></div>';

      const col = cols[i];
      const baseX = col*colW + (colW - BALLOON_W)/2;
      const b = {
        el, val, correct: val===p.ans,
        baseX: clamp(baseX, 4, Math.max(4, areaW-BALLOON_W-4)),
        x: 0,
        y: -(BALLOON_H + Math.random()*areaH*0.9 + i*70), // 위에서 시간차로 등장
        speed: 65 + Math.random()*30,                     // 적당한 속도
        amp: 8 + Math.random()*12,
        phase: Math.random()*Math.PI*2,
        sway: 0.6 + Math.random()*0.5,
        popped:false
      };
      el.addEventListener('pointerdown', (e)=>{ e.preventDefault(); onTap(b); }, {passive:false});
      playarea.appendChild(el);
      balloons.push(b);
    });
  }

  function lighten(hex){
    const c = hex.replace('#',''); const r=parseInt(c.substr(0,2),16),
      g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
    const m = v=>Math.round(v+(255-v)*0.45);
    return 'rgb('+m(r)+','+m(g)+','+m(b)+')';
  }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // ---------- 애니메이션 루프 ----------
  function loop(t){
    if(!running){ return; }
    if(!lastT) lastT = t;
    let dt = (t-lastT)/1000; lastT = t;
    if(dt>0.05) dt=0.05; // 탭 전환 등으로 튀는 것 방지

    if(!paused){
      for(const b of balloons){
        if(b.popped) continue;
        b.y += b.speed*dt;
        if(b.y > areaH + WRAP_PAD){           // 바닥을 지나면 다시 위에서 등장
          b.y = -BALLOON_H - Math.random()*120;
          b.baseX = clamp(Math.random()*(areaW-BALLOON_W), 4, Math.max(4,areaW-BALLOON_W-4));
        }
        const sx = Math.sin(t/1000*b.sway + b.phase)*b.amp;
        b.el.style.transform = 'translate('+(b.baseX+sx)+'px,'+b.y+'px)';
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  // ---------- 탭 처리 ----------
  function onTap(b){
    if(paused || b.popped) return;
    ensureAudio();
    if(b.correct){
      b.popped = true;
      b.el.classList.add('pop');
      burst(b);
      soundPop(); soundCorrect();
      paused = true;
      score++; scoreEl.textContent = score;
      if(!mistakeThisQ) firstTryCorrect++;
      showToast('정답이에요! 🎉', 'ok');
      setTimeout(nextQuestion, 1150);
    } else {
      mistakeThisQ = true;
      soundWrong();
      // 살짝 흔들고 위에서 다시 등장
      b.el.classList.add('pop');
      burst(b, true);
      const oldVal = b.val;
      setTimeout(()=>{
        b.el.classList.remove('pop');
        b.popped = false;
        b.y = -BALLOON_H - Math.random()*120;
        b.baseX = clamp(Math.random()*(areaW-BALLOON_W),4,Math.max(4,areaW-BALLOON_W-4));
      }, 330);
      b.popped = true;
      showToast('다시 한 번 계산해 볼까요?', 'no');
    }
  }

  function burst(b, soft){
    const rect = b.el.getBoundingClientRect();
    const pr = playarea.getBoundingClientRect();
    const cx = rect.left - pr.left + BALLOON_W/2;
    const cy = rect.top - pr.top + BALLOON_H/2;
    const n = soft?5:9;
    for(let i=0;i<n;i++){
      const s = document.createElement('div');
      s.className='spark';
      s.style.background = PALETTE[Math.floor(Math.random()*PALETTE.length)];
      s.style.left = cx+'px'; s.style.top = cy+'px';
      playarea.appendChild(s);
      const ang = Math.random()*Math.PI*2, dist = 30+Math.random()*50;
      const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
      s.animate([
        {transform:'translate(0,0) scale(1)', opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) scale(0)', opacity:0}
      ], {duration:500, easing:'ease-out'});
      setTimeout(()=>s.remove(), 520);
    }
  }

  function showToast(text, kind){
    toastEl.textContent = text;
    toastEl.className = 'toast ' + kind;
    // 재시작을 위해 리플로우
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
  }

  // ---------- 문제 진행 ----------
  function renderEquation(p){
    eqEl.innerHTML = p.a + ' <span class="op">+</span> ' + p.b
      + ' <span class="op">=</span> <span class="q">?</span>';
  }

  function nextQuestion(){
    current++;
    if(current >= TOTAL){ finish(); return; }
    mistakeThisQ = false;
    qNumEl.textContent = current+1;
    renderEquation(problems[current]);
    spawnBalloons(problems[current]);
    paused = false;
  }

  function startGame(){
    problems = makeProblems();
    current = 0; score = 0; firstTryCorrect = 0; mistakeThisQ = false;
    scoreEl.textContent = '0'; qNumEl.textContent = '1';
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    gameScreen.style.display = 'flex';
    renderEquation(problems[0]);
    spawnBalloons(problems[0]);
    paused = false; running = true; lastT = 0;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function finish(){
    running = false; paused = true;
    cancelAnimationFrame(rafId);
    balloons.forEach(b=> b.el.remove()); balloons=[];
    gameScreen.style.display = 'none';
    endScreen.classList.remove('hidden');

    const f = firstTryCorrect;
    let msg, trophy;
    if(f>=9){ msg='우와! 덧셈 박사님! 🏆'; trophy='🏆'; }
    else if(f>=6){ msg='정말 잘했어요! 👏'; trophy='🌟'; }
    else { msg='끝까지 다 풀었어요! 최고! 🎉'; trophy='🎈'; }

    document.getElementById('trophy').textContent = trophy;
    document.getElementById('resultMsg').textContent = msg;
    document.getElementById('resultScore').textContent = '맞힌 개수: ' + score + ' / 10';
    // 한 번에 맞힌 문제 = 별
    let stars='';
    for(let i=0;i<10;i++){ stars += '<span class="'+(i<f?'star-on':'star-off')+'">★</span>'; }
    document.getElementById('starsRow').innerHTML = stars;
    document.getElementById('resultStars').textContent = '한 번에 맞힌 문제: ' + f + '개';
  }

  // ---------- 이벤트 연결 ----------
  document.getElementById('startBtn').addEventListener('click', ()=>{ ensureAudio(); startGame(); });
  document.getElementById('againBtn').addEventListener('click', ()=>{ ensureAudio(); startGame(); });
  muteBtn.addEventListener('click', ()=>{
    muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊';
    if(!muted) ensureAudio();
  });

  window.addEventListener('resize', ()=>{ if(running) measure(); });
})();
</script>
</body>
</html>
