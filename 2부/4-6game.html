<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>풍선 터뜨리기 - 덧셈 뺄셈 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #a8e6ff;
    --sky-bottom: #d4f5e9;
    --plus: #ff7b54;
    --minus: #4d96ff;
    --ink: #4a4a6a;
    --panel: #fffdf7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Jua', sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 100%);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 떠다니는 구름 장식 */
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.7);
    border-radius: 50px;
    pointer-events: none;
    z-index: 0;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
  }
  .cloud1 { width: 90px; height: 28px; top: 14%; left: -100px; animation: drift 38s linear infinite; }
  .cloud1::before { width: 42px; height: 42px; top: -18px; left: 14px; }
  .cloud1::after { width: 30px; height: 30px; top: -12px; left: 48px; }
  .cloud2 { width: 70px; height: 22px; top: 30%; left: -120px; animation: drift 52s linear infinite; animation-delay: -20s; }
  .cloud2::before { width: 34px; height: 34px; top: -14px; left: 10px; }
  .cloud2::after { width: 24px; height: 24px; top: -8px; left: 38px; }
  @keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(calc(100vw + 160px)); }
  }

  /* 상단 문제 영역 */
  .topbar {
    position: relative;
    z-index: 5;
    padding: 14px 16px 10px;
    text-align: center;
    flex-shrink: 0;
  }
  .scoreline {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .score-pill, .progress-pill {
    background: var(--panel);
    border-radius: 30px;
    padding: 6px 16px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
  }
  .question-card {
    background: var(--panel);
    border-radius: 28px;
    padding: 18px 10px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 58px;
    line-height: 1;
    color: var(--ink);
  }
  .question-card .sign {
    font-size: 70px;
    font-weight: bold;
  }
  .sign.plus { color: var(--plus); }
  .sign.minus { color: var(--minus); }
  .question-card .qmark {
    color: #c8b6e2;
  }
  @keyframes pop-in {
    0% { transform: scale(0.6); opacity: 0; }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
  .question-card.show { animation: pop-in 0.4s ease; }

  /* 풍선 놀이터 */
  .playground {
    position: relative;
    flex: 1;
    overflow: hidden;
    z-index: 2;
  }
  .balloon {
    position: absolute;
    width: 110px;
    height: 132px;
    cursor: pointer;
    z-index: 3;
  }
  .balloon-body {
    width: 110px;
    height: 128px;
    border-radius: 50% 50% 48% 48%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    color: #fff;
    text-shadow: 0 2px 3px rgba(0,0,0,0.25);
    position: relative;
    box-shadow: inset -10px -12px 22px rgba(0,0,0,0.18), inset 12px 12px 20px rgba(255,255,255,0.4);
  }
  /* 풍선 반짝임 */
  .balloon-body::after {
    content: '';
    position: absolute;
    top: 20px;
    left: 24px;
    width: 26px;
    height: 36px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    transform: rotate(-20deg);
  }
  /* 풍선 매듭 */
  .balloon-body::before {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 12px solid currentColor;
  }
  /* 풍선 줄 */
  .balloon-string {
    position: absolute;
    bottom: -36px;
    left: 50%;
    width: 2px;
    height: 36px;
    background: rgba(120,120,120,0.5);
    transform-origin: top;
    animation: sway 3s ease-in-out infinite;
  }
  @keyframes sway {
    0%,100% { transform: translateX(-50%) rotate(4deg); }
    50% { transform: translateX(-50%) rotate(-4deg); }
  }

  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  /* 풍선 터지는 효과 */
  @keyframes burst {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.35); opacity: 1; }
    100% { transform: scale(0.1); opacity: 0; }
  }
  .balloon.bursting .balloon-body { animation: burst 0.32s ease forwards; }
  .balloon.bursting .balloon-string { opacity: 0; }

  .confetti {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 6;
  }

  /* 안내 토스트 */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(40px);
    background: var(--ink);
    color: #fff;
    padding: 14px 26px;
    border-radius: 40px;
    font-size: 24px;
    z-index: 20;
    opacity: 0;
    transition: all 0.3s ease;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.correct { background: #2ecc71; }
  .toast.wrong { background: #ff9f43; }

  /* 결과 화면 */
  .result {
    position: fixed;
    inset: 0;
    background: rgba(168,230,255,0.96);
    z-index: 30;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
  }
  .result.show { display: flex; animation: pop-in 0.5s ease; }
  .result .trophy { font-size: 100px; margin-bottom: 10px; animation: bob 2s ease-in-out infinite; }
  .result h1 { font-size: 44px; color: var(--ink); margin-bottom: 6px; }
  .result .score-big {
    font-size: 30px;
    color: var(--plus);
    background: var(--panel);
    padding: 14px 34px;
    border-radius: 30px;
    margin: 16px 0 26px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.08);
  }
  .result .stars { font-size: 40px; margin-bottom: 8px; letter-spacing: 4px; }
  .btn-again {
    font-family: 'Jua', sans-serif;
    font-size: 32px;
    color: #fff;
    background: var(--plus);
    border: none;
    border-radius: 40px;
    padding: 18px 50px;
    cursor: pointer;
    box-shadow: 0 7px 0 #d85f3c;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-again:active { transform: translateY(5px); box-shadow: 0 2px 0 #d85f3c; }

  .result .msg { font-size: 24px; color: var(--ink); margin-top: 6px; }
</style>
</head>
<body>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="topbar">
    <div class="scoreline">
      <div class="progress-pill" id="progress">1 / 10</div>
      <div class="score-pill">⭐ <span id="score">0</span>점</div>
    </div>
    <div class="question-card show" id="card">
      <span id="num1">5</span>
      <span class="sign minus" id="sign">−</span>
      <span id="num2">2</span>
      <span>=</span>
      <span class="qmark">?</span>
    </div>
  </div>

  <div class="playground" id="playground"></div>

  <div class="toast" id="toast"></div>

  <div class="result" id="result">
    <div class="trophy">🏆</div>
    <h1>참 잘했어요!</h1>
    <div class="stars" id="stars"></div>
    <div class="score-big">10문제 중 <span id="finalScore">0</span>개 정답!</div>
    <div class="msg" id="resultMsg"></div>
    <button class="btn-again" onclick="startGame()">다시 하기 🎈</button>
  </div>

<script>
  const TOTAL = 10;
  const balloonColors = ['#ff6b6b','#ffa94d','#ffd43b','#51cf66','#22b8cf','#5c7cfa','#cc5de8','#f783ac'];

  let questions = [];
  let current = 0;
  let score = 0;
  let answering = false;

  const playground = document.getElementById('playground');
  const toastEl = document.getElementById('toast');

  // ---- 사운드 (간단한 효과음) ----
  let audioCtx = null;
  function beep(freq, dur, type='sine', vol=0.2) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  function popSound() { beep(880, 0.12, 'triangle', 0.25); setTimeout(()=>beep(1320,0.12,'triangle',0.2),60); }
  function wrongSound() { beep(220, 0.25, 'sine', 0.2); }

  // ---- 문제 만들기: 덧셈/뺄셈 번갈아 ----
  function buildQuestions() {
    const list = [];
    for (let i = 0; i < TOTAL; i++) {
      const isAdd = i % 2 === 0; // 짝수=덧셈, 홀수=뺄셈으로 번갈아
      let a, b, answer;
      if (isAdd) {
        // 한 자리 + 한 자리, 답은 한 자리 또는 그 이상도 허용하되 자연스럽게
        a = rand(1, 8);
        b = rand(1, 9 - a > 0 ? 9 - a : 1);
        if (a + b > 9) b = 9 - a;
        if (b < 1) b = 1;
        answer = a + b;
      } else {
        // 한 자리 - 한 자리, 답은 0 이상
        a = rand(2, 9);
        b = rand(1, a);
        answer = a - b;
      }
      list.push({ a, b, op: isAdd ? '+' : '-', answer });
    }
    return list;
  }
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  // ---- 보기(오답) 만들기 ----
  function makeChoices(answer) {
    const choices = new Set([answer]);
    while (choices.size < 4) {
      let delta = rand(-3, 3);
      let val = answer + delta;
      if (val >= 0 && val <= 18) choices.add(val);
    }
    return shuffle([...choices]);
  }
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---- 문제 화면 표시 ----
  function showQuestion() {
    answering = false;
    const q = questions[current];
    document.getElementById('num1').textContent = q.a;
    document.getElementById('num2').textContent = q.b;
    document.getElementById('progress').textContent = (current + 1) + ' / ' + TOTAL;

    const signEl = document.getElementById('sign');
    if (q.op === '+') {
      signEl.textContent = '+';
      signEl.className = 'sign plus';
    } else {
      signEl.textContent = '−';
      signEl.className = 'sign minus';
    }

    const card = document.getElementById('card');
    card.classList.remove('show');
    void card.offsetWidth;
    card.classList.add('show');

    spawnBalloons(q.answer);
  }

  // ---- 풍선 띄우기 ----
  function spawnBalloons(answer) {
    playground.innerHTML = '';
    const choices = makeChoices(answer);
    const pw = playground.clientWidth;
    const ph = playground.clientHeight;
    const balloonW = 110;
    const slots = choices.length;
    const gap = (pw - balloonW * slots) / (slots + 1);

    choices.forEach((val, idx) => {
      const b = document.createElement('div');
      b.className = 'balloon';
      const color = balloonColors[idx % balloonColors.length];
      const left = gap + idx * (balloonW + gap);
      const startTop = ph - 150 + rand(0, 40);
      b.style.left = left + 'px';
      b.style.top = startTop + 'px';
      b.style.color = color;

      b.innerHTML =
        '<div class="balloon-body" style="background:' + color + ';color:' + color + '">' +
          '<span style="color:#fff">' + val + '</span>' +
        '</div>' +
        '<div class="balloon-string"></div>';

      // 천천히 위아래로 떠다니기 (각자 다른 속도/높이)
      const dur = (4 + Math.random() * 3).toFixed(2);
      const delay = (Math.random() * 2).toFixed(2);
      b.querySelector('.balloon-body').style.animation =
        'bob ' + dur + 's ease-in-out ' + delay + 's infinite';

      // 천천히 위로 떠오르기
      const floatDur = (12 + Math.random() * 6);
      const targetTop = 20 + rand(0, 50);
      b.animate(
        [{ top: startTop + 'px' }, { top: targetTop + 'px' }],
        { duration: floatDur * 1000, fill: 'forwards', easing: 'linear' }
      );

      b.addEventListener('click', () => handlePop(b, val, answer, color));
      b.addEventListener('touchstart', (e) => { e.preventDefault(); handlePop(b, val, answer, color); }, { passive: false });

      playground.appendChild(b);
    });
  }

  // ---- 풍선 터뜨리기 처리 ----
  function handlePop(balloon, val, answer, color) {
    if (answering || balloon.classList.contains('bursting')) return;

    if (val === answer) {
      answering = true;
      popSound();
      const rect = balloon.getBoundingClientRect();
      balloon.classList.add('bursting');
      makeConfetti(rect.left + rect.width/2, rect.top + rect.height/2);
      score++;
      document.getElementById('score').textContent = score;
      showToast('팡! 정답이에요! 🎉', 'correct');

      // 나머지 풍선 사라지기
      setTimeout(() => {
        document.querySelectorAll('.balloon').forEach(b => {
          if (b !== balloon) b.style.transition = 'opacity 0.3s';
          if (b !== balloon) b.style.opacity = '0';
        });
      }, 100);

      setTimeout(() => {
        current++;
        if (current >= TOTAL) showResult();
        else showQuestion();
      }, 1100);
    } else {
      wrongSound();
      // 살짝 흔들기
      balloon.animate(
        [{ transform: 'translateX(0)' },{ transform: 'translateX(-8px)' },
         { transform: 'translateX(8px)' },{ transform: 'translateX(0)' }],
        { duration: 300 }
      );
      showToast('부호를 다시 한 번 볼까? 🤔', 'wrong');
    }
  }

  // ---- 색종이 효과 ----
  function makeConfetti(x, y) {
    for (let i = 0; i < 18; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = balloonColors[rand(0, balloonColors.length-1)];
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      document.body.appendChild(c);
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 120;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 40;
      c.animate(
        [{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
         { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + rand(180,540) + 'deg)', opacity: 0 }],
        { duration: 800 + Math.random()*400, easing: 'cubic-bezier(.2,.6,.4,1)' }
      );
      setTimeout(() => c.remove(), 1300);
    }
  }

  // ---- 안내 메시지 ----
  let toastTimer = null;
  function showToast(text, type) {
    toastEl.textContent = text;
    toastEl.className = 'toast show ' + type;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.className = 'toast ' + type; }, 1500);
  }

  // ---- 결과 화면 ----
  function showResult() {
    const res = document.getElementById('result');
    document.getElementById('finalScore').textContent = score;
    let starCount = score >= 9 ? 3 : score >= 6 ? 2 : 1;
    document.getElementById('stars').textContent = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);
    let msg = score >= 9 ? '최고예요! 정말 똑똑하구나!' :
              score >= 6 ? '잘했어요! 조금만 더 연습해요!' :
                           '괜찮아요! 다시 도전해 볼까요?';
    document.getElementById('resultMsg').textContent = msg;
    res.classList.add('show');
    beep(660, 0.15, 'triangle', 0.2);
    setTimeout(()=>beep(880,0.15,'triangle',0.2),150);
    setTimeout(()=>beep(1100,0.2,'triangle',0.2),300);
  }

  // ---- 게임 시작 ----
  function startGame() {
    document.getElementById('result').classList.remove('show');
    questions = buildQuestions();
    current = 0;
    score = 0;
    document.getElementById('score').textContent = '0';
    showQuestion();
  }

  startGame();
</script>
</body>
</html>
