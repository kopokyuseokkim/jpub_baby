<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>자유 도화지 🎨</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #eef6ff;
    font-family: 'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }

  #app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; overflow: hidden;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ── 시작 화면 ── */
  #cv-start {
    flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(10px,2.3vh,28px); padding: clamp(14px,3vh,40px); background: #eef6ff;
  }
  #cv-deco { display: flex; gap: clamp(8px,2.5vw,26px); }
  #cv-deco div { width: clamp(36px,7vh,80px); height: clamp(36px,7vh,80px); }
  .start-title { font-size: clamp(22px,min(4.6vh,7.4vw),58px); font-weight: 700; color: #0c447c; }
  .start-desc  { font-size: clamp(12px,min(2.3vh,3.8vw),25px); color: #185fa5; text-align: center; line-height: 1.7; }
  #cv-go {
    margin-top: 6px; background: #5b9cff; color: #042c53;
    border: none; border-radius: clamp(14px,2.6vh,28px);
    font-size: clamp(16px,min(2.9vh,4.8vw),34px); font-weight: 600;
    padding: clamp(11px,2vh,24px) clamp(30px,7vw,72px); cursor: pointer; font-family: inherit;
  }
  #cv-go:active { transform: scale(.96); }

  /* ── 그리기 화면 ── */
  #cv-play {
    flex: 1 1 auto; display: none; flex-direction: column;
    min-height: 0; background: #f4f8ff;
  }

  /* 도화지 — 남은 공간 모두 차지 */
  #cv-stage {
    flex: 1 1 auto; min-height: 0; position: relative;
    background: #fff; margin: clamp(6px,1.2vh,16px) clamp(6px,1.8vw,26px) 0;
    border-radius: clamp(12px,2.4vh,24px); border: 3px solid #d9e3ef;
    box-shadow: 0 4px 0 #c5d4e8; overflow: hidden;
  }
  #cv-paper {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%;
    display: block; touch-action: none;
  }
  #cv-layer {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
  }

  /* ── 아래쪽 도구 ── */
  #cv-controls {
    flex-shrink: 0; display: flex; flex-direction: column;
    gap: clamp(4px,1vh,12px);
    padding: clamp(6px,1.2vh,16px) clamp(6px,1.8vw,26px) clamp(8px,1.6vh,20px);
    background: #f4f8ff;
  }

  #cv-colors { display: grid; grid-template-columns: repeat(8, 1fr); gap: clamp(4px,1vw,12px); }
  .cv-sw {
    aspect-ratio: 1/1; max-height: clamp(28px,5.6vh,66px); width: 100%; justify-self: center;
    border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.12); cursor: pointer;
  }
  .cv-sw.on { box-shadow: 0 0 0 3px #ffcf3f; }

  .ctrl-row { display: flex; gap: clamp(5px,1.5vw,14px); align-items: stretch; }
  #cv-sizes {
    display: flex; gap: clamp(3px,1vw,10px); background: #e6f1fb;
    border-radius: clamp(10px,2vh,18px); padding: clamp(4px,0.8vh,10px); flex-shrink: 0;
  }
  .cv-size {
    width: clamp(34px,6.6vw,80px); display: flex; align-items: center; justify-content: center;
    border-radius: clamp(7px,1.4vh,12px); background: #fff; cursor: pointer;
  }
  .cv-size.on { background: #ffe6a3; }
  .cv-size .d { background: #5f5e5a; border-radius: 50%; }
  #cv-erase {
    flex: 1; background: #e6f1fb; color: #0c447c;
    border: none; border-radius: clamp(10px,2vh,18px);
    font-size: clamp(12px,min(2.2vh,3.6vw),24px);
    font-weight: 600; cursor: pointer; padding: clamp(7px,1.4vh,16px) 0; font-family: inherit;
  }
  #cv-erase.on { background: #ff8fcf; color: #4b1528; }
  #cv-erase:active { transform: scale(.96); }

  .stk-row { display: flex; align-items: center; gap: clamp(4px,1.4vw,14px); }
  .stk-label { font-size: clamp(11px,min(1.9vh,3vw),21px); color: #4a7ab5; flex-shrink: 0; font-weight: 600; }
  #cv-stickers { display: flex; flex-wrap: wrap; gap: clamp(3px,1vw,10px); flex: 1; }
  .cv-stk {
    width: clamp(34px,6.6vh,76px); height: clamp(34px,6.6vh,76px); border-radius: clamp(8px,1.6vh,14px);
    background: #ddeeff; border: 2px solid transparent;
    cursor: pointer; padding: 4px;
  }
  .cv-stk.on { border-color: #ffcf3f; background: #fff7df; }
  .cv-stk svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .cv-stk:active { transform: scale(.94); }

  .action-row { display: flex; gap: clamp(5px,1.5vw,14px); }
  #cv-undo {
    flex: 0 0 auto; padding-left: clamp(14px,4vw,40px); padding-right: clamp(14px,4vw,40px);
    background: #e6f1fb; color: #0c447c;
    border: none; border-radius: clamp(10px,2vh,18px);
    font-size: clamp(12px,min(2.2vh,3.6vw),24px);
    font-weight: 600; cursor: pointer; padding-top: clamp(10px,2vh,22px); padding-bottom: clamp(10px,2vh,22px);
    font-family: inherit; white-space: nowrap;
  }
  #cv-undo:active { transform: scale(.96); }
  #cv-done {
    flex: 1; background: #6fd36f; color: #173404;
    border: none; border-radius: clamp(10px,2vh,18px);
    font-size: clamp(15px,min(2.7vh,4.4vw),32px);
    font-weight: 600; padding: clamp(10px,2vh,22px) 0; cursor: pointer; font-family: inherit;
  }
  #cv-done:active { transform: scale(.96); }

  /* ── 결과 화면 ── */
  #cv-result {
    flex: 1 1 auto; min-height: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(10px,2.2vh,26px); padding: clamp(12px,2.6vh,34px); background: #fff8e8;
  }
  .result-title {
    font-size: clamp(19px,min(3.8vh,6.2vw),48px); font-weight: 700; color: #854f0b;
    display: flex; align-items: center; gap: 8px;
  }
  #cv-out {
    width: 100%; flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #cv-out canvas { max-width: 100%; max-height: 100%; border-radius: 12px; border: 3px solid #fff; box-shadow: 0 4px 0 #eadcae; }
  #cv-again {
    background: #ffd23f; color: #633806;
    border: none; border-radius: clamp(11px,2.2vh,22px);
    font-size: clamp(14px,min(2.6vh,4.2vw),30px);
    font-weight: 600; padding: clamp(10px,2vh,22px) clamp(26px,6vw,60px); cursor: pointer; font-family: inherit;
  }
  #cv-again:active { transform: scale(.96); }
</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <div id="cv-start">
    <div id="cv-deco"></div>
    <div class="start-title">자유 도화지</div>
    <div class="start-desc">색연필로 그림을 그리고 스티커도 붙여서<br>나만의 멋진 작품을 만들어 보아요</div>
    <button id="cv-go">시작하기</button>
  </div>

  <!-- PLAY -->
  <div id="cv-play">
    <!-- 도화지 (가운데, 늘어남) -->
    <div id="cv-stage">
      <canvas id="cv-paper"></canvas>
      <div id="cv-layer"></div>
    </div>

    <!-- 하단 컨트롤 (고정) -->
    <div id="cv-controls">
      <!-- 색상 -->
      <div id="cv-colors"></div>
      <!-- 굵기 + 지우개 -->
      <div class="ctrl-row">
        <div id="cv-sizes"></div>
        <button id="cv-erase">지우개</button>
      </div>
      <!-- 스티커 -->
      <div class="stk-row">
        <span class="stk-label">스티커</span>
        <div id="cv-stickers"></div>
      </div>
      <!-- 스티커 빼기 + 완성 -->
      <div class="action-row">
        <button id="cv-undo">스티커 빼기</button>
        <button id="cv-done">완성!</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="cv-result">
    <div class="result-title">⭐ 나의 멋진 작품!</div>
    <div id="cv-out"></div>
    <button id="cv-again">다시 그리기</button>
  </div>

</div>
<script>
(function(){
  var S={
    star:'<path d="M32 5 L39 24 L59 24 L43 36 L49 57 L32 44 L15 57 L21 36 L5 24 L25 24 Z" fill="#ffd23f" stroke="#e0a800" stroke-width="2" stroke-linejoin="round"/>',
    heart:'<path d="M32 55 C5 36 11 13 28 20 C30 21 32 24 32 24 C32 24 34 21 36 20 C53 13 59 36 32 55 Z" fill="#ff6b8a"/>',
    flower:'<g><circle cx="32" cy="15" r="10" fill="#ff8fcf"/><circle cx="49" cy="27" r="10" fill="#ff8fcf"/><circle cx="43" cy="47" r="10" fill="#ff8fcf"/><circle cx="21" cy="47" r="10" fill="#ff8fcf"/><circle cx="15" cy="27" r="10" fill="#ff8fcf"/><circle cx="32" cy="32" r="10" fill="#ffd23f"/></g>',
    sun:'<g stroke="#ffce3a" stroke-width="5" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="14"/><line x1="32" y1="50" x2="32" y2="60"/><line x1="4" y1="32" x2="14" y2="32"/><line x1="50" y1="32" x2="60" y2="32"/><line x1="12" y1="12" x2="19" y2="19"/><line x1="45" y1="45" x2="52" y2="52"/><line x1="52" y1="12" x2="45" y2="19"/><line x1="19" y1="45" x2="12" y2="52"/></g><circle cx="32" cy="32" r="14" fill="#ffce3a"/>',
    butterfly:'<g><ellipse cx="20" cy="24" rx="12" ry="14" fill="#b18bff"/><ellipse cx="44" cy="24" rx="12" ry="14" fill="#b18bff"/><ellipse cx="22" cy="44" rx="10" ry="11" fill="#ff8fcf"/><ellipse cx="42" cy="44" rx="10" ry="11" fill="#ff8fcf"/><rect x="30" y="16" width="4" height="36" rx="2" fill="#5b4636"/></g>',
    cat:'<g><polygon points="16,12 25,30 7,30" fill="#f0a868"/><polygon points="48,12 57,30 39,30" fill="#f0a868"/><circle cx="32" cy="37" r="20" fill="#f7be86"/><circle cx="25" cy="35" r="3" fill="#3a2a1e"/><circle cx="39" cy="35" r="3" fill="#3a2a1e"/><polygon points="29,41 35,41 32,45" fill="#ff8a9a"/><path d="M22 42 H12 M22 46 H13" stroke="#3a2a1e" stroke-width="1.5"/><path d="M42 42 H52 M42 46 H51" stroke="#3a2a1e" stroke-width="1.5"/></g>',
    dog:'<g><ellipse cx="15" cy="28" rx="9" ry="16" fill="#9c6b3f"/><ellipse cx="49" cy="28" rx="9" ry="16" fill="#9c6b3f"/><circle cx="32" cy="37" r="20" fill="#c89b6b"/><circle cx="25" cy="35" r="3" fill="#3a2a1e"/><circle cx="39" cy="35" r="3" fill="#3a2a1e"/><circle cx="32" cy="43" r="4" fill="#3a2a1e"/></g>',
    car:'<g><rect x="7" y="34" width="50" height="16" rx="5" fill="#ff6b6b"/><path d="M16 34 L24 22 L42 22 L50 34 Z" fill="#ff5252"/><rect x="27" y="24" width="13" height="9" rx="2" fill="#cdeafe"/><circle cx="20" cy="50" r="6" fill="#3a2a1e"/><circle cx="44" cy="50" r="6" fill="#3a2a1e"/></g>'
  };
  var STK=[['star','별'],['heart','하트'],['flower','꽃'],['sun','해'],['butterfly','나비'],['cat','고양이'],['dog','강아지'],['car','자동차']];
  var COLORS=['#ff8fcf','#ff5252','#ff9f3a','#ffd23f','#5fd35f','#7ec8ff','#5b9cff','#b18bff'];

  function wrap(k){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">'+S[k]+'</svg>';}
  function wrapPx(k,px){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="'+px+'" height="'+px+'">'+S[k]+'</svg>';}

  var paper=document.getElementById('cv-paper');
  var layer=document.getElementById('cv-layer');
  var stage=document.getElementById('cv-stage');
  var pctx=paper.getContext('2d');
  var dpr=Math.max(1,window.devicePixelRatio||1);
  var mode='draw',current='#5b9cff',size=14,drawing=false,last=null,selStk=null,stickers=[];
  var STK_BASE=54, STK_SIZE=54;
  var uiScale=1;                       // 도화지가 클수록 붓과 스티커도 커진다
  function bw(){ return size*uiScale; }

  function resize(){
    var r=stage.getBoundingClientRect();
    var save=document.createElement('canvas');
    save.width=paper.width;save.height=paper.height;
    if(paper.width)save.getContext('2d').drawImage(paper,0,0);
    paper.width=Math.round(r.width*dpr);
    paper.height=Math.round(r.height*dpr);
    pctx.setTransform(dpr,0,0,dpr,0,0);
    pctx.lineCap='round';pctx.lineJoin='round';
    // 기준 도화지(짧은 변 360px) 대비 배율
    uiScale=Math.max(1,Math.min(2.4,Math.min(r.width,r.height)/360));
    STK_SIZE=Math.round(STK_BASE*uiScale);
    pctx.save();pctx.setTransform(1,0,0,1,0,0);
    pctx.fillStyle='#ffffff';pctx.fillRect(0,0,paper.width,paper.height);
    if(save.width)pctx.drawImage(save,0,0,paper.width,paper.height);
    pctx.restore();
  }

  /* 시작 화면 데코 */
  var deco=document.getElementById('cv-deco');
  ['star','heart','flower','butterfly'].forEach(function(k){
    var d=document.createElement('div');
    d.innerHTML=wrap(k);deco.appendChild(d);
  });

  /* 색상 */
  var colorsEl=document.getElementById('cv-colors');
  COLORS.forEach(function(c){
    var s=document.createElement('div');
    s.className='cv-sw'+(c===current?' on':'');
    s.style.background=c;
    s.addEventListener('pointerdown',function(){
      current=c;setMode('draw');
      document.querySelectorAll('.cv-sw').forEach(function(x){x.classList.remove('on');});
      s.classList.add('on');
    });
    colorsEl.appendChild(s);
  });

  /* 굵기 */
  var sizesEl=document.getElementById('cv-sizes');
  [[6,9],[14,15],[26,23]].forEach(function(p,i){
    var b=document.createElement('div');
    b.className='cv-size'+(i===1?' on':'');b.dataset.size=p[0];
    var d=document.createElement('div');d.className='d';
    d.style.width='clamp('+Math.round(p[1]*0.66)+'px,'+(p[1]/5.2).toFixed(2)+'vh,'+Math.round(p[1]*2.1)+'px)';
    d.style.height=d.style.width;b.appendChild(d);
    b.addEventListener('pointerdown',function(){
      size=+b.dataset.size;
      document.querySelectorAll('.cv-size').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
    });
    sizesEl.appendChild(b);
  });

  /* 스티커 */
  var stkEl=document.getElementById('cv-stickers');
  STK.forEach(function(p){
    var b=document.createElement('div');b.className='cv-stk';b.title=p[1];b.innerHTML=wrap(p[0]);
    b.addEventListener('pointerdown',function(){
      selStk=p[0];setMode('sticker');
      document.querySelectorAll('.cv-stk').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
    });
    stkEl.appendChild(b);
  });

  function setMode(m){
    mode=m;
    document.getElementById('cv-erase').classList.toggle('on',m==='erase');
    if(m!=='sticker'){
      selStk=null;
      document.querySelectorAll('.cv-stk').forEach(function(x){x.classList.remove('on');});
    }
  }
  document.getElementById('cv-erase').addEventListener('pointerdown',function(){
    setMode(mode==='erase'?'draw':'erase');
  });

  function pos(e){var r=paper.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

  function addSticker(x,y,key){
    var st={x:x,y:y,key:key,size:STK_SIZE};stickers.push(st);
    var d=document.createElement('div');st.el=d;
    d.style.cssText='position:absolute;width:'+st.size+'px;height:'+st.size+'px;pointer-events:auto;touch-action:none;cursor:grab;left:'+(x-st.size/2)+'px;top:'+(y-st.size/2)+'px';
    d.innerHTML=wrap(key);
    var dragging=false,ox=0,oy=0;
    d.addEventListener('pointerdown',function(e){
      e.stopPropagation();dragging=true;
      var r=stage.getBoundingClientRect();
      ox=e.clientX-(r.left+st.x);oy=e.clientY-(r.top+st.y);
      d.setPointerCapture(e.pointerId);
    });
    d.addEventListener('pointermove',function(e){
      if(!dragging)return;e.stopPropagation();
      var r=stage.getBoundingClientRect();
      st.x=e.clientX-r.left-ox;st.y=e.clientY-r.top-oy;
      d.style.left=(st.x-st.size/2)+'px';d.style.top=(st.y-st.size/2)+'px';
    });
    d.addEventListener('pointerup',function(){dragging=false;});
    layer.appendChild(d);
  }

  document.getElementById('cv-undo').addEventListener('pointerdown',function(){
    var st=stickers.pop();if(st&&st.el)st.el.remove();
  });

  function drawSeg(a,b){
    pctx.globalCompositeOperation=(mode==='erase')?'destination-out':'source-over';
    pctx.strokeStyle=(mode==='erase')?'#000':current;
    pctx.lineWidth=(mode==='erase')?bw()*1.6:bw();
    pctx.beginPath();pctx.moveTo(a.x,a.y);pctx.lineTo(b.x,b.y);pctx.stroke();
  }
  function drawDot(p){
    pctx.globalCompositeOperation=(mode==='erase')?'destination-out':'source-over';
    pctx.fillStyle=(mode==='erase')?'#000':current;
    pctx.beginPath();pctx.arc(p.x,p.y,((mode==='erase')?bw()*1.6:bw())/2,0,Math.PI*2);pctx.fill();
  }

  paper.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(mode==='sticker'&&selStk){var p=pos(e);addSticker(p.x,p.y,selStk);return;}
    drawing=true;last=pos(e);drawDot(last);
    if(paper.setPointerCapture)paper.setPointerCapture(e.pointerId);
  });
  paper.addEventListener('pointermove',function(e){
    if(!drawing)return;e.preventDefault();
    var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(var i=0;i<evs.length;i++){var p=pos(evs[i]);drawSeg(last,p);last=p;}
  });
  paper.addEventListener('pointerup',function(){drawing=false;last=null;});
  paper.addEventListener('pointercancel',function(){drawing=false;last=null;});

  function show(id){
    ['cv-start','cv-play','cv-result'].forEach(function(s){
      var e=document.getElementById(s);
      e.style.display=(s===id)?'flex':'none';
    });
  }

  document.getElementById('cv-go').addEventListener('pointerdown',function(){
    show('cv-play');setTimeout(resize,30);
  });

  document.getElementById('cv-done').addEventListener('pointerdown',function(){
    var out=document.createElement('canvas');
    out.width=paper.width;out.height=paper.height;
    var octx=out.getContext('2d');octx.drawImage(paper,0,0);
    var jobs=stickers.map(function(st){
      return new Promise(function(res){
        var img=new Image();
        img.onload=function(){
          var sp=(st.size||STK_SIZE)*dpr;
          octx.drawImage(img,(st.x*dpr)-sp/2,(st.y*dpr)-sp/2,sp,sp);res();
        };
        img.onerror=function(){res();};
        img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(wrapPx(st.key,Math.round((st.size||STK_SIZE)*dpr)));
      });
    });
    Promise.all(jobs).then(function(){
      var box=document.getElementById('cv-out');
      box.innerHTML='';box.appendChild(out);
      show('cv-result');
    });
  });

  document.getElementById('cv-again').addEventListener('pointerdown',function(){
    stickers=[];layer.innerHTML='';
    show('cv-play');setTimeout(resize,30);
  });

  window.addEventListener('resize',resize);
  window.addEventListener('orientationchange',function(){setTimeout(resize,250);});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
  show('cv-start');
})();
</script>
</body>
</html>
