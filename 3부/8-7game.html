<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>가위바위보 대결 ✊</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{
  width:100%;height:100%;overflow:hidden;background:#FFF5F5;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
body{position:fixed;top:0;left:0;right:0;bottom:0;}
@supports (height:100dvh){ html,body{height:100dvh;} }

#app{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ── 시작 화면 ── */
#ss{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.3vh,28px);padding:clamp(10px,2vh,26px);}
.sttl{font-size:clamp(24px,min(5vh,8vw),64px);font-weight:900;color:#1a1a1a;text-align:center;line-height:1.35;}
.ssub{font-size:clamp(12px,min(2.2vh,3.7vw),24px);color:#666;text-align:center;line-height:1.7;}
.sbtn{background:#FF6B6B;color:#fff;border:none;border-radius:clamp(16px,2.8vh,30px);padding:clamp(12px,2.2vh,24px) clamp(36px,8vw,84px);font-size:clamp(18px,min(3.2vh,5.4vw),38px);font-weight:900;cursor:pointer;box-shadow:0 5px 0 #C93A3A;font-family:inherit;}
.sbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #C93A3A;}
.prev-rps{display:flex;gap:clamp(8px,2.5vw,26px);font-size:clamp(34px,min(7vh,11vw),96px);}
.prev-rps span{animation:pBounce ease-in-out infinite;line-height:1;}
@keyframes pBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.info-box{font-size:clamp(12px,min(2.1vh,3.5vw),23px);text-align:center;background:#fff0f0;border-radius:12px;padding:clamp(6px,1.2vh,14px) clamp(14px,3vw,30px);color:#666;line-height:1.6;}

/* ── 게임 화면 ── */
#gs{display:none;flex:1 1 auto;flex-direction:column;gap:clamp(5px,1.1vh,14px);padding:clamp(6px,1.2vh,16px) clamp(8px,2vw,28px) clamp(8px,1.4vh,18px);min-height:0;}

#score-row{display:flex;align-items:center;background:#f9f9f9;border-radius:clamp(11px,2.2vh,20px);padding:clamp(6px,1.3vh,16px) clamp(10px,2.5vw,24px);flex-shrink:0;}
.sc-side{flex:1;min-width:0;}
.sc-lbl{font-size:clamp(10px,min(1.7vh,2.7vw),19px);font-weight:700;color:#999;margin-bottom:4px;}
#psc{text-align:left;}#csc{text-align:right;}
.stars{display:flex;gap:3px;min-height:clamp(22px,3.4vh,42px);align-items:center;flex-wrap:wrap;}
#psc .stars{justify-content:flex-start;}#csc .stars{justify-content:flex-end;}
.si{font-size:clamp(16px,min(2.9vh,4.6vw),36px);animation:sPop .35s ease;}
@keyframes sPop{0%{transform:scale(0) rotate(-20deg);}65%{transform:scale(1.3);}100%{transform:scale(1);}}
.sc-vs{font-size:clamp(11px,min(2vh,3.2vw),22px);font-weight:900;color:#ccc;padding:0 clamp(6px,2vw,20px);flex-shrink:0;}

/* 대결 창 — 남은 공간 차지 */
#battle{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:space-between;background:#f9f9f9;border-radius:clamp(12px,2.4vh,24px);padding:clamp(10px,2vh,26px) clamp(6px,1.6vw,20px);}
.b-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.2vh,14px);}
.b-lbl{font-size:clamp(11px,min(1.9vh,3vw),21px);font-weight:700;color:#999;}
.b-ch{font-size:clamp(42px,min(11vh,17vw),150px);line-height:1;}
.b-ch.pop{animation:chPop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes chPop{0%{transform:scale(0) rotate(-12deg);}100%{transform:scale(1);}}
.b-vs{font-size:clamp(15px,min(2.8vh,4.4vw),34px);font-weight:900;color:#ccc;flex-shrink:0;padding:0 2px;}

#rmsg{text-align:center;font-size:clamp(15px,min(2.9vh,4.7vw),34px);font-weight:900;min-height:clamp(40px,6.4vh,78px);display:flex;align-items:center;justify-content:center;border-radius:clamp(10px,2vh,18px);color:#999;flex-shrink:0;padding:0 clamp(6px,1.5vw,16px);}
#rmsg.ok{color:#1E8C3A;background:#EAFAF1;border:2px solid #52C97A;animation:rPop .35s ease;}
#rmsg.ng{color:#C62828;background:#FFEBEE;border:2px solid #EF9A9A;animation:rShake .4s ease;}
#rmsg.dw{color:#5E35B1;background:#EDE7FF;border:2px solid #B39DDB;animation:rPulse .38s ease;}
#rmsg.ht{color:#999;}
@keyframes rPop{0%{transform:scale(.85);}55%{transform:scale(1.08);}100%{transform:scale(1);}}
@keyframes rShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
@keyframes rPulse{0%{transform:scale(1);}50%{transform:scale(1.06);}100%{transform:scale(1);}}

#cbrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.8vw,18px);flex-shrink:0;}
.cb{border:none;border-radius:clamp(12px,2.4vh,24px);cursor:pointer;padding:clamp(9px,1.7vh,20px) 4px clamp(8px,1.4vh,17px);display:flex;flex-direction:column;align-items:center;gap:clamp(3px,0.8vh,10px);border-bottom:clamp(4px,0.9vh,9px) solid rgba(0,0,0,.2);font-family:inherit;}
.cb:active{transform:scale(.88);filter:brightness(.83);border-bottom-width:2px;}
.cb.dis{opacity:.45;pointer-events:none;}
.ce{font-size:clamp(28px,min(5.4vh,8.6vw),72px);line-height:1;}
.cn{font-size:clamp(14px,min(2.7vh,4.4vw),34px);font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);}

/* ── 결과 화면 ── */
#ws{display:none;flex:1 1 auto;min-height:0;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.3vh,28px);padding:clamp(10px,2vh,26px);}
.we{font-size:clamp(52px,min(9.6vh,15.5vw),140px);animation:ejb .7s ease infinite alternate;line-height:1;}
@keyframes ejb{from{transform:scale(1);}to{transform:scale(1.12);}}
.wt{font-size:clamp(24px,min(5vh,8vw),64px);font-weight:900;text-align:center;color:#1a1a1a;}
.wsc{font-size:clamp(14px,min(2.5vh,4vw),28px);font-weight:700;color:#666;}
.wsb{font-size:clamp(12px,min(2.1vh,3.5vw),23px);text-align:center;color:#666;background:#f9f9f9;border-radius:12px;padding:clamp(8px,1.5vh,18px) clamp(14px,3vw,32px);max-width:min(90%,520px);line-height:1.6;}
.cf{position:fixed;pointer-events:none;z-index:9999;animation:cff linear forwards;}
@keyframes cff{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(700deg);opacity:0;}}
</style>
</head>
<body>
<div id="app">
  <div id="ss">
    <div class="prev-rps">
      <span style="animation-duration:1.8s;animation-delay:0s">✂️</span>
      <span style="animation-duration:2s;animation-delay:.3s">✊</span>
      <span style="animation-duration:1.9s;animation-delay:.6s">🖐️</span>
    </div>
    <div class="sttl">가위바위보 대결!</div>
    <div class="ssub">🤖 컴퓨터와 대결해봐요!<br>5판 먼저 이기면 이기는 거예요! 🏆</div>
    <div class="info-box">가위는 보를 이기고 ✂️🖐️<br>바위는 가위를 이기고 ✊✂️<br>보는 바위를 이겨요 🖐️✊</div>
    <button class="sbtn" onclick="startGame()">▶ 시작!</button>
  </div>
  <div id="gs">
    <div id="score-row">
      <div class="sc-side" id="psc"><div class="sc-lbl">👤 나</div><div class="stars" id="pstars"></div></div>
      <div class="sc-vs">VS</div>
      <div class="sc-side" id="csc"><div class="sc-lbl">🤖 컴퓨터</div><div class="stars" id="cstars"></div></div>
    </div>
    <div id="battle">
      <div class="b-side"><div class="b-lbl">👤 나</div><div class="b-ch" id="pch">🤜</div></div>
      <div class="b-vs">VS</div>
      <div class="b-side"><div class="b-lbl">🤖 컴퓨터</div><div class="b-ch" id="cch">🤖</div></div>
    </div>
    <div id="rmsg" class="ht">가위, 바위, 보 중에 골라봐요!</div>
    <div id="cbrow">
      <button class="cb" id="cb0" onclick="pick(0)" style="background:#FF6B6B;border-color:#C93A3A;"><span class="ce">✂️</span><span class="cn">가위</span></button>
      <button class="cb" id="cb1" onclick="pick(1)" style="background:#7C6BFF;border-color:#3C2BC9;"><span class="ce">✊</span><span class="cn">바위</span></button>
      <button class="cb" id="cb2" onclick="pick(2)" style="background:#55E87B;border-color:#1DA04A;"><span class="ce">🖐️</span><span class="cn">보</span></button>
    </div>
  </div>
  <div id="ws">
    <div class="we" id="we">🏆</div>
    <div class="wt" id="wt">이겼어요!</div>
    <div class="wsc" id="wsc">나 5 : 컴퓨터 2</div>
    <div class="wsb" id="wsb">와! 5판을 먼저 이겼어요!</div>
    <button class="sbtn" onclick="startGame()">🔄 다시 하기!</button>
  </div>
</div>
<script>
var AC=null,ps=0,cs=0,TARGET=5,gst='waiting';
var CH=[{id:'scissors',e:'✂️',n:'가위'},{id:'rock',e:'✊',n:'바위'},{id:'paper',e:'🖐️',n:'보'}];
var BEATS={scissors:'paper',rock:'scissors',paper:'rock'};
var WPRAISE=['와! 5판을 먼저 이겼어요! 정말 대단해요! 🌟','컴퓨터를 이겼어요! 최고예요! 🧠','가위바위보 챔피언이에요! 🏆'];
var LPRAISE=['이번엔 컴퓨터가 이겼어요! 다시 도전! 💪','아쉽지만 괜찮아요! 한 판 더 해봐요! 🔥','연습하면 꼭 이길 수 있어요! 힘내요! 💪'];
function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function beep(type){
  try{var t=AC.currentTime;
    if(type==='w'){[523,659,784].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.2,t+i*.12);g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.32);o.connect(g);g.connect(AC.destination);o.start(t+i*.12);o.stop(t+i*.12+.35);});}
    else if(type==='l'){[360,280].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.13,t+i*.15);g.gain.exponentialRampToValueAtTime(.001,t+i*.15+.22);o.connect(g);g.connect(AC.destination);o.start(t+i*.15);o.stop(t+i*.15+.25);});}
    else if(type==='d'){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=440;g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3);}
    else if(type==='bw'){[523,659,784,1047,1319].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.2,t+i*.1);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.38);o.connect(g);g.connect(AC.destination);o.start(t+i*.1);o.stop(t+i*.1+.42);});}
  }catch(e){}
}
function getRes(pi,ci){var p=CH[pi].id,c=CH[ci].id;if(p===c)return 'd';if(BEATS[p]===c)return 'w';return 'l';}
function pick(pi){
  if(gst!=='waiting')return;initAC();gst='anim';lockBtns(true);
  var ci=Math.floor(Math.random()*3),res=getRes(pi,ci);
  setMsg('🪨 가위... 바위... 보!','ht');setEm('p','❓');setEm('c','❓');
  setTimeout(function(){
    setEm('p',CH[pi].e);setEm('c',CH[ci].e);
    var txt,cls;
    if(res==='w'){txt='🎉 이겼어요! +⭐';cls='ok';ps++;addStar('p');}
    else if(res==='l'){txt='😅 졌어요!';cls='ng';cs++;addStar('c');}
    else{txt='🤝 비겼어요!';cls='dw';}
    setMsg(txt,cls);beep(res);
    if(ps>=TARGET||cs>=TARGET){setTimeout(showEnd,1600);}
    else{setTimeout(function(){gst='waiting';lockBtns(false);setMsg('가위, 바위, 보 중에 골라봐요!','ht');setEm('p','🤜');setEm('c','🤖');},1500);}
  },560);
}
function setEm(who,em){var el=document.getElementById(who==='p'?'pch':'cch');if(!el)return;el.textContent=em;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function setMsg(t,c){var m=document.getElementById('rmsg');m.textContent=t;m.className=c||'';}
function lockBtns(on){[0,1,2].forEach(function(i){var b=document.getElementById('cb'+i);if(b){if(on)b.classList.add('dis');else b.classList.remove('dis');}});}
function addStar(who){var row=document.getElementById(who==='p'?'pstars':'cstars');var s=document.createElement('span');s.className='si';s.textContent=who==='p'?'⭐':'🤖';row.appendChild(s);}
function showEnd(){
  gst='gameover';document.getElementById('gs').style.display='none';document.getElementById('ws').style.display='flex';
  var pw=ps>=TARGET;
  document.getElementById('we').textContent=pw?'🏆':'😅';document.getElementById('wt').textContent=pw?'이겼어요! 🎉':'졌어요! 💪';
  document.getElementById('wsc').textContent='나 '+ps+' : '+cs+' 컴퓨터';
  var arr=pw?WPRAISE:LPRAISE;document.getElementById('wsb').textContent=arr[Math.floor(Math.random()*arr.length)];
  if(pw){beep('bw');confetti();}else beep('l');
}
function confetti(){var cols=['#FF6B6B','#FFD54F','#55E87B','#43B8FF','#7C6BFF','#FFB3E6','#fff'];for(var i=0;i<55;i++){(function(){var c=document.createElement('div');c.className='cf';var sz=5+Math.random()*9,dur=1.1+Math.random()*1.5;c.style.cssText='left:'+(Math.random()*100)+'vw;top:-12px;width:'+sz+'px;height:'+sz+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+dur+'s;animation-delay:'+(Math.random()*.4)+'s;';document.body.appendChild(c);c.addEventListener('animationend',function(){c.remove();});})();}}
function startGame(){initAC();ps=0;cs=0;gst='waiting';['ss','ws'].forEach(function(id){document.getElementById(id).style.display='none';});document.getElementById('gs').style.display='flex';document.getElementById('pstars').innerHTML='';document.getElementById('cstars').innerHTML='';setMsg('가위, 바위, 보 중에 골라봐요!','ht');setEm('p','🤜');setEm('c','🤖');lockBtns(false);}
</script>
</body>
</html>
