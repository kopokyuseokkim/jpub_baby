<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>두둥탁! 리듬 드럼 🥁</title>
</head>
<body>
<style>
  /* ===== 반응형 전체화면 베이스 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #FFFBF7;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }

  #app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; overflow: hidden;
    padding:
      calc(env(safe-area-inset-top) + clamp(6px,1.3vh,18px))
      calc(env(safe-area-inset-right) + clamp(8px,2vw,28px))
      calc(env(safe-area-inset-bottom) + clamp(8px,1.5vh,20px))
      calc(env(safe-area-inset-left) + clamp(8px,2vw,28px));
  }

  /* ── 시작 화면 ── */
  #scr-start { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px,2.2vh,26px); }
  .big-title { font-size: clamp(22px,min(4.6vh,7.5vw),56px); font-weight: 900; text-align: center; color: #222; line-height: 1.4; }
  .sub-txt { font-size: clamp(12px,min(2.1vh,3.6vw),22px); color: #888; text-align: center; }
  .preview-drums { display: flex; gap: clamp(8px,2.5vw,26px); align-items: flex-end; }
  .pd { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: clamp(20px,min(4vh,6vw),46px); border: 5px solid rgba(0,0,0,0.15); animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
  #btn-start { background: #E53935; color: #fff; border: none; border-radius: clamp(14px,2.4vh,26px); padding: clamp(12px,2.2vh,24px) clamp(30px,7vw,70px); font-size: clamp(17px,min(3vh,5vw),32px); font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 #8B0000; font-family: inherit; }
  #btn-start:active { transform: translateY(4px); box-shadow: 0 1px 0 #8B0000; }

  /* ── 게임 화면 ── */
  #scr-game { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; gap: clamp(4px,0.9vh,12px); }

  /* 탭 */
  .tabs { flex: 0 0 auto; display: flex; gap: 5px; background: #f0f0f0; border-radius: clamp(10px,1.8vh,16px); padding: 4px; }
  .tab-btn { flex: 1; padding: clamp(7px,1.2vh,15px) 0; border: none; border-radius: clamp(7px,1.4vh,12px); font-size: clamp(12px,min(1.9vh,3.2vw),21px); font-weight: 700; cursor: pointer; background: transparent; color: #888; font-family: inherit; }
  .tab-btn.on { background: #fff; color: #222; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }

  /* 정보 행 */
  .info-row { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .badge { font-size: clamp(11px,min(1.7vh,2.9vw),19px); font-weight: 700; border-radius: 8px; padding: clamp(3px,0.6vh,8px) clamp(8px,2vw,16px); white-space: nowrap; }
  .badge-lv { background: #EDE7FF; color: #5E35B1; }
  .badge-sc { background: #FFEBEE; color: #C62828; }

  /* 자유모드 메시지 */
  #free-msg { flex: 0 0 auto; text-align: center; font-size: clamp(19px,min(4.6vh,7vw),58px); font-weight: 900; height: clamp(44px,8.5vh,110px); display: flex; align-items: center; justify-content: center; border-radius: clamp(12px,2vh,20px); background: #f5f5f5; border: 2px solid #ddd; color: #333; transition: background .15s, color .15s; white-space: nowrap; overflow: hidden; padding: 0 clamp(8px,2vw,20px); }

  /* 리듬 표시줄 */
  #rhythm-box { flex: 0 0 auto; background: #f5f5f5; border-radius: clamp(12px,2vh,20px); padding: clamp(7px,1.2vh,15px) clamp(9px,2vw,18px); }
  #rhythm-title { font-size: clamp(10px,min(1.6vh,2.7vw),18px); font-weight: 700; color: #888; margin-bottom: 5px; }
  #beat-row { display: flex; gap: clamp(4px,1vw,10px); flex-wrap: wrap; }
  .beat-cell { width: clamp(28px,5vh,56px); height: clamp(28px,5vh,56px); border-radius: clamp(8px,1.5vh,14px); display: flex; align-items: center; justify-content: center; font-size: clamp(11px,2vh,22px); font-weight: 900; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.3); border: 2px solid rgba(0,0,0,0.12); opacity: 0.35; transition: transform 0.15s; flex: 0 0 auto; }
  .beat-cell.cur { opacity: 1; transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 5px #888; animation: blink .6s ease-in-out infinite alternate; }
  .beat-cell.ok { opacity: 0.6; transform: scale(0.9); }
  @keyframes blink { from { box-shadow: 0 0 0 3px #fff, 0 0 0 5px rgba(0,0,0,0.4); } to { box-shadow: 0 0 0 3px #fff, 0 0 0 7px rgba(0,0,0,0.8); } }

  /* 피드백 */
  #feedback { flex: 0 0 auto; text-align: center; font-size: clamp(15px,min(3vh,4.8vw),36px); font-weight: 900; height: clamp(38px,6.5vh,84px); display: flex; align-items: center; justify-content: center; border-radius: clamp(10px,1.8vh,18px); background: #f5f5f5; color: #333; transition: background .2s, color .2s; white-space: nowrap; overflow: hidden; padding: 0 clamp(6px,1.5vw,16px); }
  #feedback.win { background: #E8F5E9; color: #2E7D32; border: 2px solid #81C784; animation: pop .4s ease; }
  #feedback.err { background: #FFEBEE; color: #C62828; border: 2px solid #EF9A9A; animation: pop .3s ease; }
  @keyframes pop { 0%{ transform: scale(.85); } 60%{ transform: scale(1.06); } 100%{ transform: scale(1); } }

  /* 별 */
  .star-row { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; min-height: clamp(22px,3.4vh,44px); overflow: hidden; }
  .star-lbl { font-size: clamp(11px,min(1.7vh,2.9vw),19px); color: #888; font-weight: 600; flex: 0 0 auto; }
  .star-wrap { display: flex; gap: 2px; overflow: hidden; flex: 1 1 auto; }
  #star-cnt { font-size: clamp(11px,min(1.7vh,2.9vw),19px); font-weight: 700; color: #888; flex: 0 0 auto; }
  .star-icon { font-size: clamp(15px,2.7vh,32px); animation: sp .4s ease; }
  @keyframes sp { 0%{ transform: scale(0) rotate(-30deg); } 70%{ transform: scale(1.3); } 100%{ transform: scale(1); } }

  /* ── 드럼: 남은 공간 중앙에서 최대 크기로 ── */
  #drum-row {
    flex: 1 1 auto; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    gap: clamp(8px,2.5vw,32px);
    padding-top: clamp(2px,0.6vh,8px);
  }
  .drum-col { display: flex; flex-direction: column; align-items: center; gap: clamp(3px,0.7vh,9px); }
  .drum-btn {
    /* 가로·세로 중 작은 쪽에 맞춰 항상 정원(正圓) 유지 */
    width: min(27vw, 30vh); height: min(27vw, 30vh);
    border-radius: 50%; border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(1px,0.5vh,6px);
    cursor: pointer; position: relative; overflow: hidden;
    border-bottom: clamp(5px,1.1vh,12px) solid rgba(0,0,0,0.22);
    font-family: inherit;
  }
  .drum-btn::before { content:''; position:absolute; inset:12%; border-radius:50%; border:3px solid rgba(255,255,255,0.25); pointer-events:none; }
  .drum-btn::after  { content:''; position:absolute; inset:27%; border-radius:50%; border:2px solid rgba(255,255,255,0.15); pointer-events:none; }
  .drum-btn .de { font-size: clamp(20px,min(7vw,7.6vh),64px); pointer-events: none; line-height: 1; }
  .drum-btn .dn { font-size: clamp(16px,min(5.6vw,6vh),52px); font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.35); pointer-events: none; line-height: 1; }
  .drum-btn:active { transform: scale(0.88); filter: brightness(0.82); }
  .drum-btn.hit { animation: dhit .28s ease; }
  @keyframes dhit { 0%{transform:scale(1);} 25%{transform:scale(.82);} 65%{transform:scale(1.1);} 100%{transform:scale(1);} }
  .drum-sub { font-size: clamp(11px,min(1.8vh,3vw),20px); font-weight: 700; color: #888; }

  /* 꽃가루 */
  .cf { position:fixed; pointer-events:none; z-index:9999; animation:fall linear forwards; }
  @keyframes fall { 0%{transform:translateY(-10px) rotate(0); opacity:1;} 100%{transform:translateY(110vh) rotate(700deg); opacity:0;} }
</style>

<div id="app">

  <!-- 시작 화면 -->
  <div id="scr-start">
    <div class="preview-drums">
      <div class="pd" style="width:min(19vw,14vh);height:min(19vw,14vh);background:#E53935;animation-delay:0s">🥁</div>
      <div class="pd" style="width:min(15.7vw,11.6vh);height:min(15.7vw,11.6vh);background:#F9A825;animation-delay:.35s">👏</div>
      <div class="pd" style="width:min(17.4vw,12.8vh);height:min(17.4vw,12.8vh);background:#1E88E5;animation-delay:.7s">🪘</div>
    </div>
    <div class="big-title">🥁 신나는<br>드럼 놀이터!</div>
    <div class="sub-txt">두드리면 소리가 나요!</div>
    <button id="btn-start" onclick="startGame()">▶ 시작하기</button>
  </div>

  <!-- 게임 화면 -->
  <div id="scr-game">

    <div class="tabs">
      <button class="tab-btn on" id="t-free"   onclick="goFree()">🎵 자유 연주</button>
      <button class="tab-btn"   id="t-mission" onclick="goMission()">🎯 리듬 따라치기</button>
    </div>

    <div class="info-row">
      <span class="badge badge-lv" id="lv-badge">레벨 1 · 3박자</span>
      <span class="badge badge-sc" id="sc-badge">⭐ 0점</span>
    </div>

    <!-- 자유모드 표시 -->
    <div id="free-msg">🥁 두드려 보세요!</div>

    <!-- 미션모드 리듬 -->
    <div id="rhythm-box" style="display:none">
      <div id="rhythm-title">🎯 이 순서대로 두드려 보세요!</div>
      <div id="beat-row"></div>
    </div>

    <div id="feedback">🥁 두드려 보세요!</div>

    <div class="star-row">
      <span class="star-lbl">🏆 점수</span>
      <div class="star-wrap" id="star-wrap"></div>
      <span id="star-cnt"></span>
    </div>

    <!-- 드럼 3개 -->
    <div id="drum-row">
      <div class="drum-col">
        <button class="drum-btn" id="d0" style="background:#E53935;border-bottom-color:#8B0000" onclick="hitDrum(0)">
          <span class="de">🥁</span><span class="dn">쿵</span>
        </button>
        <div class="drum-sub">큰북</div>
      </div>
      <div class="drum-col">
        <button class="drum-btn" id="d1" style="background:#F9A825;border-bottom-color:#E65100" onclick="hitDrum(1)">
          <span class="de">👏</span><span class="dn">짝</span>
        </button>
        <div class="drum-sub">손뼉</div>
      </div>
      <div class="drum-col">
        <button class="drum-btn" id="d2" style="background:#1E88E5;border-bottom-color:#0D47A1" onclick="hitDrum(2)">
          <span class="de">🪘</span><span class="dn">탁</span>
        </button>
        <div class="drum-sub">작은북</div>
      </div>
    </div>

  </div>
</div>

<script>
var AC = null;
var mode = 'free';
var score = 0;
var stars = 0;
var seqLen = 3;
var level = 1;
var seq = [];
var step = 0;
var missionActive = false;
var nextTimer = null;

var COLORS = ['#E53935', '#F9A825', '#1E88E5'];
var NAMES  = ['쿵', '짝', '탁'];

/* ── 오디오 ── */
function noise(dur) {
  var n = Math.floor(AC.sampleRate * dur);
  var b = AC.createBuffer(1, n, AC.sampleRate);
  var d = b.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  var s = AC.createBufferSource(); s.buffer = b; return s;
}

function playKung() {
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(90, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(38, AC.currentTime + 0.35);
  g.gain.setValueAtTime(1.3, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.55);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.55);
  var c = AC.createOscillator(), cg = AC.createGain();
  c.frequency.value = 200; cg.gain.setValueAtTime(0.5, AC.currentTime);
  cg.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.04);
  c.connect(cg); cg.connect(AC.destination); c.start(); c.stop(AC.currentTime + 0.04);
}

function playJjak() {
  var ns = noise(0.18);
  var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 0.6;
  var g = AC.createGain(); g.gain.setValueAtTime(0.9, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.18);
  ns.connect(bp); bp.connect(g); g.connect(AC.destination); ns.start(); ns.stop(AC.currentTime + 0.18);
  var o = AC.createOscillator(), og = AC.createGain();
  o.type = 'triangle'; o.frequency.value = 200;
  og.gain.setValueAtTime(0.3, AC.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.1);
  o.connect(og); og.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.1);
}

function playTak() {
  var ns = noise(0.09);
  var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
  var g = AC.createGain(); g.gain.setValueAtTime(0.65, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.09);
  ns.connect(hp); hp.connect(g); g.connect(AC.destination); ns.start(); ns.stop(AC.currentTime + 0.09);
  var o = AC.createOscillator(), og = AC.createGain();
  o.type = 'square'; o.frequency.value = 560;
  og.gain.setValueAtTime(0.18, AC.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.04);
  o.connect(og); og.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.04);
}

var SND = [playKung, playJjak, playTak];

/* ── 시작 ── */
function startGame() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  document.getElementById('scr-start').style.display = 'none';
  document.getElementById('scr-game').style.display = 'flex';
}

/* ── 모드 ── */
function goFree() {
  mode = 'free'; missionActive = false;
  document.getElementById('t-free').classList.add('on');
  document.getElementById('t-mission').classList.remove('on');
  document.getElementById('free-msg').style.display = 'block';
  document.getElementById('rhythm-box').style.display = 'none';
  setFb('🥁 두드려 보세요!', '');
}

function goMission() {
  mode = 'mission';
  document.getElementById('t-mission').classList.add('on');
  document.getElementById('t-free').classList.remove('on');
  document.getElementById('free-msg').style.display = 'none';
  document.getElementById('rhythm-box').style.display = 'block';
  newSeq();
}

/* ── 리듬 ── */
function newSeq() {
  seq = [];
  for (var i = 0; i < seqLen; i++) seq.push(Math.floor(Math.random() * 3));
  step = 0; missionActive = true;
  renderBeats();
  setFb('👀 따라 쳐보세요!', '');
}

function renderBeats() {
  var row = document.getElementById('beat-row');
  row.innerHTML = '';
  for (var i = 0; i < seq.length; i++) {
    var id = seq[i];
    var cell = document.createElement('div');
    cell.className = 'beat-cell' + (i === 0 ? ' cur' : '');
    cell.id = 'bc' + i;
    cell.style.background = COLORS[id];
    cell.textContent = NAMES[id];
    row.appendChild(cell);
  }
}

/* ── 드럼 누르기 ── */
function hitDrum(id) {
  if (!AC) return;
  SND[id]();
  animDrum(id);

  if (mode === 'free') {
    var fm = document.getElementById('free-msg');
    var cols = ['#E53935', '#F9A825', '#1E88E5'];
    var emojis = ['🥁', '👏', '🪘'];
    fm.textContent = emojis[id] + ' ' + NAMES[id] + '!';
    fm.style.background = cols[id] + '33';
    fm.style.color = cols[id];
    fm.style.borderColor = cols[id];
    clearTimeout(fm._t);
    fm._t = setTimeout(function() {
      fm.textContent = '🥁 두드려 보세요!';
      fm.style.background = '';
      fm.style.color = '';
      fm.style.borderColor = '';
    }, 900);
    return;
  }

  if (!missionActive) return;

  if (id === seq[step]) {
    var cell = document.getElementById('bc' + step);
    if (cell) { cell.classList.remove('cur'); cell.classList.add('ok'); }
    step++;
    if (step >= seq.length) {
      onSuccess();
    } else {
      var nc = document.getElementById('bc' + step);
      if (nc) nc.classList.add('cur');
    }
  } else {
    onWrong();
  }
}

function animDrum(id) {
  var btn = document.getElementById('d' + id);
  if (!btn) return;
  btn.classList.remove('hit');
  void btn.offsetWidth;
  btn.classList.add('hit');
  btn.addEventListener('animationend', function() { btn.classList.remove('hit'); }, { once: true });
}

/* ── 성공 / 실패 ── */
var PRAISE = ['리듬 천재! 🎉', '완벽해요! 🌟', '대단해요! 🔥', '최고예요! 👑', '신기하다! ✨'];

function onSuccess() {
  missionActive = false;
  var pts = seqLen * 10;
  score += pts;
  addStar();
  setFb(PRAISE[Math.floor(Math.random() * PRAISE.length)], 'win');
  confetti();
  document.getElementById('sc-badge').textContent = '⭐ ' + score + '점';
  seqLen = Math.min(seqLen + 1, 8);
  level++;
  document.getElementById('lv-badge').textContent = '레벨 ' + level + ' · ' + seqLen + '박자';
  clearTimeout(nextTimer);
  nextTimer = setTimeout(function() { newSeq(); }, 1800);
}

function onWrong() {
  missionActive = false;
  setFb('다시 해봐요! 💪', 'err');
  clearTimeout(nextTimer);
  nextTimer = setTimeout(function() {
    step = 0; missionActive = true;
    renderBeats();
    setFb('👀 처음부터 다시!', '');
  }, 1000);
}

function setFb(txt, cls) {
  var f = document.getElementById('feedback');
  f.textContent = txt;
  f.className = cls || '';
}

function addStar() {
  stars++;
  var s = document.createElement('span');
  s.className = 'star-icon'; s.textContent = '⭐';
  var sw = document.getElementById('star-wrap');
  sw.appendChild(s);
  var maxVisible = Math.max(3, Math.floor(sw.clientWidth / 26));
  while (sw.children.length > maxVisible) sw.removeChild(sw.firstChild);
  document.getElementById('star-cnt').textContent = stars + '개';
}

function confetti() {
  var cols = ['#E53935','#F9A825','#1E88E5','#43A047','#AB47BC','#fff'];
  for (var i = 0; i < 55; i++) {
    (function() {
      var c = document.createElement('div');
      c.className = 'cf';
      var sz = 5 + Math.random() * 9;
      var dur = 1.1 + Math.random() * 1.6;
      var delay = Math.random() * 0.45;
      var col = cols[Math.floor(Math.random() * cols.length)];
      var isCircle = Math.random() > 0.5;
      c.style.cssText = 'left:' + (Math.random()*100) + 'vw;top:-12px;width:' + sz + 'px;height:' + sz + 'px;background:' + col + ';border-radius:' + (isCircle ? '50%' : '2px') + ';animation-duration:' + dur + 's;animation-delay:' + delay + 's;';
      document.body.appendChild(c);
      c.addEventListener('animationend', function() { c.remove(); });
    })();
  }
}
</script>
</body>
</html>
