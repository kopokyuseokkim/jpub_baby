<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>내 손안의 도레미 피아노 🎹</title>
</head>
<body>
<style>
  /* ===== 반응형 전체화면 베이스 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #F6F4FF;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  /* dvh 지원 브라우저에서는 주소창 변화까지 반영 */
  @supports (height: 100dvh) { html, body { height: 100dvh; } }

  #app {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    gap: clamp(5px, 1.1vh, 14px);
    overflow: hidden;
    padding:
      calc(env(safe-area-inset-top) + clamp(6px, 1.4vh, 18px))
      calc(env(safe-area-inset-right) + clamp(8px, 2vw, 28px))
      calc(env(safe-area-inset-bottom) + clamp(8px, 1.6vh, 20px))
      calc(env(safe-area-inset-left) + clamp(8px, 2vw, 28px));
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ===== 음 이름 표시 ===== */
  #note-display {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    height: clamp(52px, 13vh, 150px);
    /* 세로(vh)뿐 아니라 가로(vw)도 함께 고려해야 긴 문구가 잘리지 않음 */
    font-size: clamp(24px, min(8vh, 11vw), 90px);
    font-weight: 700; letter-spacing: 1px;
    white-space: nowrap; overflow: hidden;
    padding: 0 clamp(8px, 2vw, 20px);
    border-radius: clamp(14px, 2.5vh, 26px);
    background: #FFFFFF;
    border: 2px solid #E3DEF7;
    color: #4A3F8F;
    transition: transform 0.2s, background 0.2s, border-color 0.2s, color 0.2s;
  }
  #note-display.flash { transform: scale(1.08); }
  /* '눌러보세요!' 같은 긴 안내 문구용 크기 (음 이름은 짧아 크게 표시) */
  #note-display.hint { font-size: clamp(16px, min(4.4vh, 6.4vw), 46px); letter-spacing: 0; }

  /* ===== 미션 박스 ===== */
  #mission-box {
    flex: 0 0 auto;
    background: #FFF9E6;
    border: 2.5px solid #F9C440;
    border-radius: clamp(12px, 2vh, 22px);
    padding: clamp(7px, 1.2vh, 16px) clamp(10px, 2vw, 22px);
  }
  #mission-label { font-size: clamp(10px, min(1.5vh, 2.6vw), 17px); font-weight: 600; color: #C47F00; margin-bottom: 3px; letter-spacing: 0.5px; }
  #mission-text  { font-size: clamp(14px, min(2.6vh, 4.3vw), 30px); font-weight: 700; color: #7A5000; line-height: 1.35; }
  #mission-progress { font-size: clamp(11px, 1.7vh, 19px); color: #A07020; margin-top: 3px; }

  /* ===== 별 스티커 ===== */
  #stars-row {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    min-height: clamp(26px, 4vh, 48px);
    overflow: hidden;
  }
  #stars-label { font-size: clamp(11px, 1.7vh, 19px); color: #6B6480; font-weight: 500; flex: 0 0 auto; }
  #stars-container { display: flex; gap: 4px; overflow: hidden; flex: 1 1 auto; }
  #star-count { font-size: clamp(11px, 1.7vh, 19px); color: #6B6480; font-weight: 600; flex: 0 0 auto; }
  .star { font-size: clamp(18px, 3vh, 34px); animation: popIn 0.4s ease; }
  @keyframes popIn { 0%{transform:scale(0) rotate(-20deg);} 70%{transform:scale(1.3) rotate(5deg);} 100%{transform:scale(1) rotate(0);} }

  /* ===== 성공 배너 ===== */
  #success-banner {
    display: none; flex: 0 0 auto; text-align: center;
    font-size: clamp(16px, min(3vh, 5vw), 36px); font-weight: 700; color: #1E8C3A;
    background: #EAFAF1; border: 2px solid #52C97A;
    border-radius: clamp(12px, 2vh, 20px);
    padding: clamp(7px, 1.2vh, 16px);
    animation: bounceIn 0.5s ease;
  }
  @keyframes bounceIn { 0%{transform:scale(0.7);opacity:0;} 70%{transform:scale(1.1);} 100%{transform:scale(1);opacity:1;} }
  #success-banner.show { display: block; }

  /* ===== 건반: 남은 공간을 모두 차지 ===== */
  #piano-wrap {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: clamp(4px, 0.8vw, 12px);
  }
  .key {
    flex: 1 1 0; min-width: 0; height: 100%;
    border-radius: clamp(10px, 2vh, 22px);
    border: none;
    border-bottom: clamp(4px, 0.8vh, 9px) solid rgba(0,0,0,0.2);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: clamp(8px, 1.6vh, 22px);
    gap: clamp(2px, 0.6vh, 8px);
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    transition: transform 0.1s, filter 0.1s;
    touch-action: manipulation;
  }
  .key:active, .key.pressed { transform: scale(0.92); filter: brightness(0.88); border-bottom-width: 2px; }

  .key-do   { background: #FF6B6B; }
  .key-re   { background: #FF9F43; }
  .key-mi   { background: #FFC048; }
  .key-fa   { background: #55E87B; }
  .key-sol  { background: #43B8FF; }
  .key-la   { background: #7C6BFF; }
  .key-si   { background: #EE6BDF; }
  .key-do2  { background: #FF6B6B; box-shadow: inset 0 0 0 3px #fff; }

  .key .key-emoji { font-size: clamp(18px, 4vh, 52px); line-height: 1; }
  .key .key-name  { font-size: clamp(15px, 3vh, 40px); line-height: 1; font-weight: 800; }

  /* ===== 새 미션 버튼 ===== */
  #new-mission-btn {
    flex: 0 0 auto;
    width: 100%;
    padding: clamp(10px, 1.8vh, 24px);
    background: #7C6BFF; color: white;
    border: none; border-radius: clamp(12px, 2vh, 22px);
    font-size: clamp(15px, min(2.6vh, 4.5vw), 30px); font-weight: 700;
    cursor: pointer; transition: transform 0.1s, background 0.1s;
    letter-spacing: 0.5px;
    font-family: inherit;
  }
  #new-mission-btn:active { transform: scale(0.97); background: #5C4BDF; }

  /* 가로가 아주 넓은 화면(데스크톱/태블릿 가로): 좌우 여백만 조금 */
  @media (min-aspect-ratio: 5/4) {
    #note-display { height: clamp(46px, 15vh, 120px); font-size: clamp(28px, 10vh, 72px); }
    .key .key-emoji { font-size: clamp(18px, 6vh, 56px); }
    .key .key-name  { font-size: clamp(15px, 4.5vh, 44px); }
  }
</style>

<div id="app">
  <h2 class="sr-only">어린이 피아노 게임 — 건반을 눌러 소리를 들어보세요!</h2>

  <div id="note-display" class="hint">🎵 눌러보세요!</div>

  <div id="success-banner">🎉 참 잘했어요! 🌟</div>

  <div id="mission-box">
    <div id="mission-label">🎯 오늘의 미션</div>
    <div id="mission-text">아무 건반이나 눌러보세요!</div>
    <div id="mission-progress"></div>
  </div>

  <div id="stars-row">
    <span id="stars-label">⭐ 모은 별:</span>
    <div id="stars-container"></div>
    <span id="star-count"></span>
  </div>

  <div id="piano-wrap">
    <button class="key key-do"  data-note="도" aria-label="도"><span class="key-emoji">🍎</span><span class="key-name">도</span></button>
    <button class="key key-re"  data-note="레" aria-label="레"><span class="key-emoji">🍊</span><span class="key-name">레</span></button>
    <button class="key key-mi"  data-note="미" aria-label="미"><span class="key-emoji">🌟</span><span class="key-name">미</span></button>
    <button class="key key-fa"  data-note="파" aria-label="파"><span class="key-emoji">🍀</span><span class="key-name">파</span></button>
    <button class="key key-sol" data-note="솔" aria-label="솔"><span class="key-emoji">🐬</span><span class="key-name">솔</span></button>
    <button class="key key-la"  data-note="라" aria-label="라"><span class="key-emoji">🍇</span><span class="key-name">라</span></button>
    <button class="key key-si"  data-note="시" aria-label="시"><span class="key-emoji">🌸</span><span class="key-name">시</span></button>
    <button class="key key-do2" data-note="도(높은)" data-mission-note="도2" aria-label="높은 도"><span class="key-emoji">🎀</span><span class="key-name">도</span></button>
  </div>

  <button id="new-mission-btn">🎲 새 미션 받기</button>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx;
function getCtx() { if (!ctx) ctx = new AudioCtx(); return ctx; }

const freqs = { '도': 261.63, '레': 293.66, '미': 329.63, '파': 349.23, '솔': 392.00, '라': 440.00, '시': 493.88, '도2': 523.25 };
const noteColors = { '도': '#FF6B6B', '레': '#FF9F43', '미': '#FFC048', '파': '#55E87B', '솔': '#43B8FF', '라': '#7C6BFF', '시': '#EE6BDF', '도2': '#FF6B6B', '도(높은)': '#FF6B6B' };

function playNote(noteKey) {
  const ac = getCtx();
  const freq = freqs[noteKey] || freqs['도'];
  const osc = ac.createOscillator();
  const gainNode = ac.createGain();
  const osc2 = ac.createOscillator();
  const gain2 = ac.createGain();

  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, ac.currentTime);
  gainNode.gain.setValueAtTime(0.45, ac.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.4);
  osc.connect(gainNode);
  gainNode.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime + 1.4);

  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, ac.currentTime);
  gain2.gain.setValueAtTime(0.15, ac.currentTime);
  gain2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.8);
  osc2.connect(gain2);
  gain2.connect(ac.destination);
  osc2.start(); osc2.stop(ac.currentTime + 0.8);
}

const missions = [
  ['도','레','미'],
  ['미','파','솔'],
  ['솔','라','시'],
  ['도','미','솔'],
  ['레','미','파'],
  ['도','레','미','파','솔'],
  ['솔','미','도'],
  ['미','레','도'],
  ['도','도2'],
  ['라','솔','파','미'],
];

let stars = 0;
let currentMission = null;
let missionStep = 0;
let missionActive = false;
let successTimer = null;

function startMission() {
  const m = missions[Math.floor(Math.random() * missions.length)];
  currentMission = m;
  missionStep = 0;
  missionActive = true;
  document.getElementById('success-banner').classList.remove('show');
  updateMissionUI();
}

function updateMissionUI() {
  if (!currentMission) return;
  const label = currentMission.map((n, i) => {
    const display = n === 'do2' ? '도' : n;
    return i < missionStep
      ? `<span style="color:#1E8C3A;font-weight:900;">${display}✔</span>`
      : `<span>${display}</span>`;
  }).join(' → ');
  document.getElementById('mission-text').innerHTML = `🎹 ${label} 를 눌러보세요!`;
  document.getElementById('mission-progress').textContent = missionStep > 0 ? `(${missionStep} / ${currentMission.length} 완료)` : '';
}

function addStar() {
  stars++;
  const c = document.getElementById('stars-container');
  const s = document.createElement('span');
  s.className = 'star';
  s.textContent = '⭐';
  c.appendChild(s);
  // 화면 폭을 넘지 않도록 보이는 별 개수만 제한(모은 개수는 숫자로 계속 표시)
  const maxVisible = Math.max(3, Math.floor(c.clientWidth / 30));
  while (c.children.length > maxVisible) c.removeChild(c.firstChild);
  document.getElementById('star-count').textContent = `${stars}개`;
}

function showNoteDisplay(noteName, color) {
  const d = document.getElementById('note-display');
  d.textContent = noteName;
  d.classList.remove('hint');
  d.style.background = color + '22';
  d.style.borderColor = color;
  d.style.color = color;
  d.classList.add('flash');
  setTimeout(() => d.classList.remove('flash'), 200);
}

function handleNotePress(noteRaw) {
  const missionKey = noteRaw === '도(높은)' ? '도2' : noteRaw;
  const displayName = missionKey === '도2' ? '도 ↑' : missionKey;
  const color = noteColors[missionKey] || '#888';

  playNote(missionKey);
  showNoteDisplay(displayName, color);

  if (missionActive && currentMission) {
    const expected = currentMission[missionStep];
    if (missionKey === expected || (expected === '도2' && missionKey === '도2')) {
      missionStep++;
      updateMissionUI();
      if (missionStep >= currentMission.length) {
        missionActive = false;
        addStar();
        document.getElementById('success-banner').classList.add('show');
        document.getElementById('mission-text').innerHTML = '🎉 미션 성공! 새 미션을 받아보세요!';
        document.getElementById('mission-progress').textContent = '';
        if (successTimer) clearTimeout(successTimer);
        successTimer = setTimeout(() => {
          document.getElementById('success-banner').classList.remove('show');
        }, 3000);
      }
    } else if (missionStep > 0) {
      missionStep = 0;
      document.getElementById('mission-progress').textContent = '다시 처음부터 눌러보세요! 💪';
      setTimeout(updateMissionUI, 1000);
    }
  }
}

document.querySelectorAll('.key').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    btn.classList.add('pressed');
    handleNotePress(btn.dataset.note);
  });
  btn.addEventListener('pointerup', () => btn.classList.remove('pressed'));
  btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));
});

document.getElementById('new-mission-btn').addEventListener('click', startMission);

startMission();
</script>
</body>
</html>
