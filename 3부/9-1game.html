<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>반짝반짝 그림놀이</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-text-size-adjust: 100%;
    font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #fdf3e7;
  }
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }

  #app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: clamp(5px, 1vh, 13px);
    padding:
      calc(env(safe-area-inset-top) + clamp(6px, 1.1vh, 16px))
      calc(env(safe-area-inset-right) + clamp(6px, 1.6vw, 24px))
      calc(env(safe-area-inset-bottom) + clamp(6px, 1.2vh, 16px))
      calc(env(safe-area-inset-left) + clamp(6px, 1.6vw, 24px));
    background:
      radial-gradient(circle at 20% 10%, #ffe8f3 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #e4f3ff 0%, transparent 45%),
      #fdf3e7;
  }

  /* ===== 도화지 ===== */
  #canvasWrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    border-radius: clamp(16px, 3vh, 34px);
    background: #ffffff;
    transition: background .25s;
    box-shadow: 0 8px 0 #e7d3bd, 0 14px 24px rgba(180,140,90,.28);
    border: 5px solid #fff;
    overflow: hidden;
  }
  #paper, #fx {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  #fx { pointer-events: none; }

  /* ===== 색 고르기 ===== */
  #colors {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: clamp(4px, 1vw, 12px);
    flex: 0 0 auto;
  }
  .swatch {
    aspect-ratio: 1 / 1;
    max-height: clamp(28px, 6vh, 72px);
    border-radius: 50%;
    border: 3px solid #ffffff;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
    transition: transform .12s;
    cursor: pointer;
    justify-self: center;
    width: 100%;
  }
  .swatch.sel {
    transform: scale(1.18);
    border-color: #ffcf3f;
    box-shadow: 0 0 0 3px #ffcf3f, 0 3px 8px rgba(0,0,0,.2);
  }

  /* ===== 아래쪽 도구 ===== */
  #bottom {
    display: flex;
    gap: clamp(5px, 1.2vw, 14px);
    flex: 0 0 auto;
    align-items: stretch;
    height: clamp(56px, 10vh, 130px);
  }
  #sizes {
    display: flex;
    gap: clamp(4px, 1vw, 10px);
    background: #fff;
    border-radius: clamp(14px, 2.6vh, 26px);
    padding: clamp(4px, 0.8vh, 10px);
    box-shadow: 0 4px 0 #e7d3bd;
  }
  .size {
    width: clamp(36px, 7vw, 84px);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: clamp(10px, 2vh, 18px);
    background: #fbeedd;
    cursor: pointer;
    transition: transform .12s;
  }
  .size.sel { background: #ffe6a3; transform: scale(1.05); }
  .size .dot { background: #6b5848; border-radius: 50%; }
  /* 붓 굵기 미리보기 점 — 화면 크기에 맞춰 함께 커진다 */
  .size[data-size="8"]  .dot { width: clamp(8px,1.5vh,16px);  height: clamp(8px,1.5vh,16px); }
  .size[data-size="18"] .dot { width: clamp(14px,2.7vh,30px); height: clamp(14px,2.7vh,30px); }
  .size[data-size="34"] .dot { width: clamp(20px,4vh,46px);   height: clamp(20px,4vh,46px); }

  #actions { display: flex; gap: clamp(5px, 1.2vw, 14px); flex: 1 1 auto; }
  .btn {
    flex: 1 1 0;
    min-width: 0;
    border: none;
    border-radius: clamp(14px, 2.6vh, 26px);
    font-family: 'Jua', 'Apple SD Gothic Neo', sans-serif;
    font-size: clamp(18px, min(3.4vh, 5.4vw), 44px);
    color: #fff;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: clamp(4px, 0.8vh, 10px) 2px;
    line-height: 1;
    transition: transform .1s;
  }
  .btn span.t { font-size: clamp(10px, min(1.8vh, 2.9vw), 22px); }
  .btn:active { transform: scale(.93); }
  #erase  { background: linear-gradient(#ffd36b,#f7b733); box-shadow: 0 4px 0 #d99a1f; }
  #erase.on { background: linear-gradient(#ffb3c8,#ff7aa2); box-shadow: 0 4px 0 #e25a82; }
  #clear  { background: linear-gradient(#ff9aa8,#ff6f86); box-shadow: 0 4px 0 #e04f68; }
  #bg     { background: linear-gradient(#9be7c4,#4ecb8d); box-shadow: 0 4px 0 #34a870; }
</style>
</head>
<body>
<div id="app">
  <div id="canvasWrap">
    <canvas id="paper"></canvas>
    <canvas id="fx"></canvas>
  </div>

  <div id="colors"></div>

  <div id="bottom">
    <div id="sizes">
      <div class="size" data-size="8"><div class="dot"></div></div>
      <div class="size sel" data-size="18"><div class="dot"></div></div>
      <div class="size" data-size="34"><div class="dot"></div></div>
    </div>
    <div id="actions">
      <button class="btn" id="erase">🧽<span class="t">지우개</span></button>
      <button class="btn" id="clear">🗑️<span class="t">싹지우기</span></button>
      <button class="btn" id="bg">🎨<span class="t">배경색</span></button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#ff6fa5','#ff5252','#ff9f3a','#ffd23f','#5fd35f','#3ec1d3',
                '#4f7bff','#9b6bff','#ff8fcf','#8d5a2b','#2b2b2b','#ffffff'];

const paper = document.getElementById('paper');
const fx = document.getElementById('fx');
const pctx = paper.getContext('2d');
const fctx = fx.getContext('2d');
const wrap = document.getElementById('canvasWrap');

let dpr = Math.max(1, window.devicePixelRatio || 1);
let current = COLORS[0];
let size = 18;
let brushScale = 1;          // 도화지가 클수록 붓도 굵어진다
function bw() { return size * brushScale; }
let erasing = false;
let drawing = false;
let last = null;

/* ---- sizing ---- */
function resize() {
  const r = wrap.getBoundingClientRect();
  // preserve drawing
  const save = document.createElement('canvas');
  save.width = paper.width; save.height = paper.height;
  if (paper.width) save.getContext('2d').drawImage(paper, 0, 0);

  [paper, fx].forEach(c => {
    c.width = Math.round(r.width * dpr);
    c.height = Math.round(r.height * dpr);
  });
  pctx.setTransform(dpr,0,0,dpr,0,0);
  fctx.setTransform(dpr,0,0,dpr,0,0);
  pctx.lineCap = 'round';
  pctx.lineJoin = 'round';

  // 기준 도화지(짧은 변 380px)보다 크면 붓도 그만큼 굵게
  brushScale = Math.max(1, Math.min(2.4, Math.min(r.width, r.height) / 380));

  if (save.width) pctx.drawImage(save, 0, 0, r.width, r.height);
}

/* ---- palette build ---- */
const colorsEl = document.getElementById('colors');
COLORS.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' sel' : '');
  s.style.background = c;
  if (c === '#ffffff') s.style.borderColor = '#ddd';
  s.addEventListener('pointerdown', () => {
    current = c;
    erasing = false;
    document.getElementById('erase').classList.remove('on');
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
    s.classList.add('sel');
  });
  colorsEl.appendChild(s);
});

/* ---- sizes ---- */
document.querySelectorAll('.size').forEach(b => {
  b.addEventListener('pointerdown', () => {
    size = +b.dataset.size;
    document.querySelectorAll('.size').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
  });
});

/* ---- coords ---- */
function pos(e) {
  const r = paper.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/* ---- drawing ---- */
function start(e) {
  drawing = true;
  last = pos(e);
  drawDot(last);
  paper.setPointerCapture && paper.setPointerCapture(e.pointerId);
}
function move(e) {
  if (!drawing) return;
  // handle coalesced events for smoother lines
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs) {
    const p = pos(ev);
    drawSeg(last, p);
    if (!erasing) sparkle(p.x, p.y);
    last = p;
  }
}
function end(e) { drawing = false; last = null; }

function drawDot(p) {
  pctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  pctx.fillStyle = erasing ? '#000' : current;
  if (!erasing) { pctx.shadowColor = current; pctx.shadowBlur = current === '#ffffff' ? 0 : 8; }
  else pctx.shadowBlur = 0;
  pctx.beginPath();
  pctx.arc(p.x, p.y, (erasing ? bw()*1.6 : bw()) / 2, 0, Math.PI*2);
  pctx.fill();
  pctx.shadowBlur = 0;
  if (!erasing) sparkle(p.x, p.y);
}
function drawSeg(a, b) {
  pctx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  pctx.strokeStyle = erasing ? '#000' : current;
  pctx.lineWidth = erasing ? bw() * 1.6 : bw();
  if (!erasing && current !== '#ffffff') { pctx.shadowColor = current; pctx.shadowBlur = 8; }
  else pctx.shadowBlur = 0;
  pctx.beginPath();
  pctx.moveTo(a.x, a.y);
  pctx.lineTo(b.x, b.y);
  pctx.stroke();
  pctx.shadowBlur = 0;
}

paper.addEventListener('pointerdown', e => { e.preventDefault(); start(e); });
paper.addEventListener('pointermove', e => { e.preventDefault(); move(e); });
paper.addEventListener('pointerup',   e => { e.preventDefault(); end(e); });
paper.addEventListener('pointercancel', e => end(e));
paper.addEventListener('pointerleave', e => { if (drawing) move(e); });

/* ---- sparkles ---- */
const stars = [];
function sparkle(x, y) {
  const n = 2 + Math.floor(Math.random()*2);
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const sp = 0.4 + Math.random()*1.6;
    stars.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - 0.4,
      life: 1,
      r: (2 + Math.random()*3.5) * brushScale,
      color: current === '#ffffff' ? '#ffd23f' : current,
      rot: Math.random()*Math.PI
    });
  }
}
function drawStar(ctx, x, y, r, rot, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  for (let i=0;i<5;i++){
    ctx.lineTo(0, -r);
    ctx.rotate(Math.PI/5);
    ctx.lineTo(0, -r*0.45);
    ctx.rotate(Math.PI/5);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function loop() {
  const r = wrap.getBoundingClientRect();
  fctx.clearRect(0,0,r.width,r.height);
  for (let i=stars.length-1;i>=0;i--){
    const s = stars[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.05;
    s.life -= 0.035; s.rot += 0.12;
    if (s.life <= 0) { stars.splice(i,1); continue; }
    drawStar(fctx, s.x, s.y, s.r * s.life + 1, s.rot, s.color, s.life);
  }
  fctx.globalAlpha = 1; fctx.shadowBlur = 0;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---- buttons ---- */
document.getElementById('erase').addEventListener('pointerdown', function(){
  erasing = !erasing;
  this.classList.toggle('on', erasing);
});

const BGS = ['#ffffff','#fff3d6','#ffe0ec','#e2f7e6','#e0f0ff','#f3e6ff','#ffe9d6','#e9f9ff'];
let bgi = 0;
document.getElementById('bg').addEventListener('pointerdown', () => {
  bgi = (bgi + 1) % BGS.length;
  // 그림(캔버스)은 그대로 두고 도화지 배경색만 바꾼다
  wrap.style.background = BGS[bgi];
});

document.getElementById('clear').addEventListener('pointerdown', () => {
  const r = wrap.getBoundingClientRect();
  pctx.save();
  pctx.setTransform(1,0,0,1,0,0);
  pctx.clearRect(0,0,paper.width,paper.height);
  pctx.restore();
  // little celebration burst
  for(let i=0;i<26;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
    stars.push({x:r.width/2,y:r.height/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,r:(3+Math.random()*4)*brushScale,color:COLORS[Math.floor(Math.random()*8)],rot:Math.random()*6});
  }
});

/* ---- init ---- */
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
// 처음 배경색 지정 (캔버스는 투명하게 두고 도화지 틀에 색을 입힌다)
wrap.style.background = BGS[bgi];
</script>
</body>
</html>
