<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>풍선 팡팡 🎈</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;overflow:hidden;background:#87CEEB;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
body{position:fixed;top:0;left:0;right:0;bottom:0;}
@supports (height:100dvh){ html,body{height:100dvh;} }

#app{
  position:relative;width:100%;height:100%;
  background:linear-gradient(180deg,#87CEEB 0%,#C9E8FA 52%,#A8D5A2 78%,#7BC67E 100%);
  overflow:hidden;
  font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;
}

/* 구름 */
.cld{position:absolute;pointer-events:none;width:130px;height:62px;transform-origin:left center;}
.cld div{position:absolute;background:rgba(255,255,255,.9);border-radius:50%;}
@keyframes cldMove{from{left:-200px;}to{left:115%;}}
@media (min-width:700px){ .cld{transform:scale(1.6);} }
@media (min-width:1200px){ .cld{transform:scale(2.4);} }

/* 상단 점수판 */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:15;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + clamp(6px,1.2vh,16px)) calc(env(safe-area-inset-right) + clamp(12px,3vw,36px)) clamp(6px,1.2vh,16px) calc(env(safe-area-inset-left) + clamp(12px,3vw,36px));
  background:rgba(255,255,255,.9);border-radius:0 0 clamp(14px,2.5vh,26px) clamp(14px,2.5vh,26px);
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.hbox{display:flex;align-items:center;gap:5px;}
.hico{font-size:clamp(18px,min(3.2vh,5vw),40px);}
.hnum{font-size:clamp(22px,min(4vh,6.2vw),52px);font-weight:900;min-width:1.5em;}
.htit{font-size:clamp(11px,min(1.9vh,3vw),20px);font-weight:700;color:#aaa;}
#snum{color:#FF4B6E;}
#tnum{color:#7C6BFF;text-align:right;}
#tnum.urg{color:#FF2020;animation:turg .45s ease-in-out infinite alternate;}
@keyframes turg{from{transform:scale(1);}to{transform:scale(1.22);}}

/* 풍선 (크기는 JS가 화면에 맞춰 계산) */
.bln{position:absolute;cursor:pointer;touch-action:manipulation;z-index:8;will-change:transform;}
@keyframes floatUp{0%{transform:translateY(0);}100%{transform:translateY(-130vh);}}
.bbody{border-radius:50%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:inset -7px -9px 0 rgba(0,0,0,.1),0 4px 14px rgba(0,0,0,.18);animation:sway 2.2s ease-in-out infinite alternate;}
@keyframes sway{from{transform:rotate(-4deg);}to{transform:rotate(4deg);}}
.bshine{position:absolute;top:18%;left:22%;width:28%;height:22%;background:rgba(255,255,255,.55);border-radius:50%;transform:rotate(-35deg);}
.bstr{width:2px;background:rgba(80,40,0,.3);margin:0 auto;border-radius:1px;}
.bemj{font-size:clamp(16px,min(3.2vh,5vw),42px);line-height:1;position:relative;z-index:1;}

/* 터뜨릴 때 효과 */
.pring{position:absolute;border-radius:50%;pointer-events:none;z-index:20;animation:pringA .45s ease-out forwards;}
@keyframes pringA{0%{transform:translate(-50%,-50%) scale(.2);opacity:1;}100%{transform:translate(-50%,-50%) scale(3.2);opacity:0;}}
.ptxt{position:absolute;pointer-events:none;z-index:22;font-weight:900;white-space:nowrap;animation:ptxtA .9s ease-out forwards;}
@keyframes ptxtA{0%{transform:translate(-50%,-50%) scale(.7);opacity:1;}35%{transform:translate(-50%,-80%) scale(1.2);opacity:1;}100%{transform:translate(-50%,-170%) scale(1);opacity:0;}}
.psp{position:absolute;pointer-events:none;z-index:21;font-size:clamp(14px,2.6vh,30px);animation:pspA .7s ease-out forwards;}
@keyframes pspA{0%{transform:translate(var(--sx),var(--sy)) scale(.5);opacity:1;}100%{transform:translate(var(--ex),var(--ey)) scale(1.4);opacity:0;}}

/* 시작 화면 */
#startScr{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,28px);z-index:30;background:rgba(135,206,235,.88);padding:clamp(12px,3vh,40px);}
.sttl{font-size:clamp(26px,min(5.4vh,9vw),72px);font-weight:900;color:#FF4B6E;text-align:center;line-height:1.3;text-shadow:0 2px 6px rgba(0,0,0,.1);}
.ssub{font-size:clamp(13px,min(2.3vh,4vw),26px);color:#3A6836;font-weight:700;text-align:center;}
.sprev{display:flex;gap:clamp(6px,2vw,22px);align-items:flex-end;}
.spb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,min(2.8vh,4.4vw),36px);box-shadow:inset -5px -6px 0 rgba(0,0,0,.1);animation:spbounce ease-in-out infinite;}
@keyframes spbounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}
.sbtn{background:#FF4B6E;color:#fff;border:none;border-radius:clamp(20px,3.4vh,36px);padding:clamp(13px,2.4vh,26px) clamp(36px,9vw,86px);font-size:clamp(20px,min(3.6vh,6vw),42px);font-weight:900;cursor:pointer;box-shadow:0 5px 0 #C91E3A,0 8px 20px rgba(255,75,110,.35);touch-action:manipulation;font-family:inherit;}
.sbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #C91E3A;}

/* 종료 화면 */
#endScr{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,22px);z-index:30;background:rgba(168,213,162,.92);padding:clamp(12px,3vh,40px);}
.eemj{font-size:clamp(48px,min(9vh,15vw),130px);animation:ejmb .7s ease infinite alternate;line-height:1;}
@keyframes ejmb{from{transform:scale(1);}to{transform:scale(1.12);}}
.eslbl{font-size:clamp(12px,min(2.1vh,3.4vw),22px);font-weight:700;color:#666;}
.escore{font-size:clamp(46px,min(9vh,15vw),130px);font-weight:900;color:#FF4B6E;line-height:1;}
.epraise{font-size:clamp(17px,min(3.2vh,5.2vw),40px);font-weight:900;color:#333;text-align:center;}
.esub{font-size:clamp(12px,min(2.1vh,3.4vw),22px);color:#555;text-align:center;background:rgba(255,255,255,.72);border-radius:12px;padding:clamp(6px,1.2vh,14px) clamp(14px,3vw,30px);max-width:min(90%,520px);}
.abtn{background:#7C6BFF;color:#fff;border:none;border-radius:clamp(16px,2.8vh,30px);padding:clamp(11px,2vh,22px) clamp(30px,7vw,70px);font-size:clamp(16px,min(2.9vh,4.8vw),34px);font-weight:800;cursor:pointer;box-shadow:0 4px 0 #3C2BC9;touch-action:manipulation;margin-top:4px;font-family:inherit;}
.abtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3C2BC9;}
</style>
</head>
<body>
<div id="app">
  <div class="cld" style="top:11vh;animation:cldMove 20s linear infinite;left:-200px;">
    <div style="width:65px;height:42px;top:10px;left:0;"></div>
    <div style="width:95px;height:55px;top:0;left:22px;"></div>
    <div style="width:60px;height:38px;top:14px;left:60px;"></div>
  </div>
  <div class="cld" style="top:22vh;animation:cldMove 28s linear infinite 10s;left:-200px;">
    <div style="width:50px;height:34px;top:8px;left:0;"></div>
    <div style="width:72px;height:46px;top:0;left:16px;"></div>
    <div style="width:48px;height:32px;top:10px;left:46px;"></div>
  </div>
  <div id="hud">
    <div class="hbox"><span class="hico">⭐</span><span class="hnum" id="snum">0</span></div>
    <span class="htit">풍선 팡팡!</span>
    <div class="hbox"><span class="hnum" id="tnum">30</span><span class="hico">⏰</span></div>
  </div>
  <div id="startScr">
    <div class="sprev">
      <div class="spb" style="width:min(13vw,9vh);height:min(13vw,9vh);background:#FF4B6E;animation-duration:2s;">🎈</div>
      <div class="spb" style="width:min(17vw,12vh);height:min(17vw,12vh);background:#FFD700;animation-duration:1.8s;animation-delay:.3s;">⭐</div>
      <div class="spb" style="width:min(14vw,9.7vh);height:min(14vw,9.7vh);background:#42A5F5;animation-duration:2.2s;animation-delay:.6s;">🎈</div>
      <div class="spb" style="width:min(12.5vw,8.6vh);height:min(12.5vw,8.6vh);background:#AB47BC;animation-duration:1.9s;animation-delay:.2s;">🎈</div>
    </div>
    <div class="sttl">🎈 풍선 팡팡!</div>
    <div class="ssub">올라오는 풍선을 터뜨려요!</div>
    <button class="sbtn" onclick="startGame()">▶ 시작!</button>
  </div>
  <div id="endScr">
    <div class="eemj" id="eemj">🎉</div>
    <div class="eslbl">오늘의 점수</div>
    <div class="escore" id="escore">0</div>
    <div class="epraise" id="epraise">잘 했어요! 👏</div>
    <div class="esub" id="esub">다음엔 더 많이 터뜨려봐요!</div>
    <button class="abtn" onclick="startGame()">🎈 다시 하기!</button>
  </div>
</div>
<script>
var AC=null,score=0,tLeft=30,active=false,sInt=null,cInt=null;
var COLS=['#FF4B6E','#FF9F43','#FFD54F','#66BB6A','#42A5F5','#AB47BC','#EC407A','#26C6DA'];
function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function playPop(star){
  if(!AC)return;
  var t=AC.currentTime,bsz=Math.floor(AC.sampleRate*.055);
  var buf=AC.createBuffer(1,bsz,AC.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<bsz;i++)d[i]=(Math.random()*2-1)*(1-i/bsz);
  var ns=AC.createBufferSource();ns.buffer=buf;
  var hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=star?180:420;
  var g=AC.createGain();g.gain.setValueAtTime(star?.44:.32,t);g.gain.exponentialRampToValueAtTime(.001,t+.055);
  ns.connect(hp);hp.connect(g);g.connect(AC.destination);ns.start(t);ns.stop(t+.055);
  if(star){
    var o=AC.createOscillator(),og=AC.createGain();
    o.frequency.value=880;og.gain.setValueAtTime(.2,t);og.gain.exponentialRampToValueAtTime(.001,t+.32);
    o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+.32);
  }
}
function spawnBalloon(){
  if(!active)return;
  var app=document.getElementById('app');
  var aw=app.clientWidth,ah=app.clientHeight;
  // 화면의 짧은 쪽을 기준으로 삼아, 폰·태블릿·PC 어디서든 비슷한 비율로 보이게 한다
  var unit=Math.min(aw,ah);
  var star=Math.random()<.2;
  var sz=Math.round(unit*(star?0.145:(0.12+Math.random()*0.045)));
  sz=Math.max(44,Math.min(sz,Math.round(aw*0.42)));
  // 풍선이 화면 밖으로 걸치지 않도록 가로 위치를 풍선 크기만큼 여유 두고 정한다
  var wPct=sz/aw*100, xl=3+Math.random()*Math.max(4,(94-wPct));
  var dur=7+Math.random()*3;
  var col=star?'#FFD700':COLS[Math.floor(Math.random()*COLS.length)];
  var el=document.createElement('div');el.className='bln';
  el.style.cssText='left:'+xl+'%;bottom:-'+(sz+30)+'px;animation:floatUp '+dur+'s linear forwards;';
  var body=document.createElement('div');body.className='bbody';
  body.style.cssText='width:'+sz+'px;height:'+sz+'px;background:'+col+';';
  if(star){var em=document.createElement('span');em.className='bemj';em.textContent='⭐';body.appendChild(em);}
  var shine=document.createElement('div');shine.className='bshine';body.appendChild(shine);
  var str=document.createElement('div');str.className='bstr';str.style.height=Math.round(sz*.38)+'px';
  el.appendChild(body);el.appendChild(str);
  function pop(cx,cy){
    if(!el.parentNode||!active)return;
    var pts=star?3:1;score+=pts;
    document.getElementById('snum').textContent=score;
    playPop(star);
    var ar=app.getBoundingClientRect();
    showFX(cx-ar.left,cy-ar.top,col,star,app);el.remove();
  }
  el.addEventListener('click',function(e){pop(e.clientX,e.clientY);});
  el.addEventListener('touchstart',function(e){e.preventDefault();if(e.touches[0])pop(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  app.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.remove();},(dur+.5)*1000);
}
function showFX(x,y,col,star,parent){
  var u=Math.min(parent.clientWidth,parent.clientHeight);
  var rs=Math.max(50,Math.round(u*0.13));
  var ring=document.createElement('div');ring.className='pring';
  ring.style.cssText='left:'+x+'px;top:'+y+'px;width:'+rs+'px;height:'+rs+'px;border:4px solid '+col+';margin-left:'+(-rs/2)+'px;margin-top:'+(-rs/2)+'px;';
  parent.appendChild(ring);setTimeout(function(){ring.remove();},500);
  var txt=document.createElement('div');txt.className='ptxt';
  var fs=Math.max(15,Math.round(u*(star?0.042:0.037)));
  txt.style.cssText='left:'+x+'px;top:'+y+'px;font-size:'+fs+'px;color:'+(star?'#E07000':'#FF4B6E')+';text-shadow:0 1px 4px rgba(0,0,0,.2);';
  txt.textContent=star?'⭐+3 대박 풍선!':'+1';
  parent.appendChild(txt);setTimeout(function(){txt.remove();},1000);
  if(star){
    var sp1=Math.max(40,Math.round(u*0.1)),sp2=Math.max(36,Math.round(u*0.09));
    var dirs=[[-sp1,-sp2],[sp1,-sp2],[-sp1,sp2],[sp1,sp2]],ems=['✨','🌟','💫','⭐'];
    for(var i=0;i<4;i++){(function(dx,dy,em){
      var sp=document.createElement('div');sp.className='psp';
      sp.style.cssText='left:'+x+'px;top:'+y+'px;--sx:0px;--sy:0px;--ex:'+dx+'px;--ey:'+dy+'px;';
      sp.textContent=em;parent.appendChild(sp);setTimeout(function(){sp.remove();},800);
    })(dirs[i][0],dirs[i][1],ems[i]);}
  }
}
function endGame(){
  active=false;clearInterval(sInt);clearInterval(cInt);
  document.querySelectorAll('.bln').forEach(function(b){b.remove();});
  document.getElementById('endScr').style.display='flex';
  document.getElementById('escore').textContent=score;
  var p;
  if(score<=4)p={e:'😊',t:'잘 했어요! 👏',s:'다음엔 더 많이 터뜨려봐요!'};
  else if(score<=9)p={e:'🌟',t:'멋져요! 🌟',s:'풍선을 정말 잘 터뜨렸어요!'};
  else if(score<=14)p={e:'🎉',t:'대단해요! 🎉',s:'엄청난 풍선 실력이에요!'};
  else p={e:'🏆',t:'최고예요! 🏆',s:'진짜 풍선 천재예요!'};
  document.getElementById('eemj').textContent=p.e;document.getElementById('epraise').textContent=p.t;document.getElementById('esub').textContent=p.s;
}
function startGame(){
  initAC();score=0;tLeft=30;active=true;
  document.getElementById('startScr').style.display='none';document.getElementById('endScr').style.display='none';
  document.getElementById('snum').textContent='0';document.getElementById('tnum').textContent='30';
  document.getElementById('tnum').classList.remove('urg');
  document.querySelectorAll('.bln,.pring,.ptxt,.psp').forEach(function(e){e.remove();});
  clearInterval(sInt);clearInterval(cInt);
  spawnBalloon();sInt=setInterval(spawnBalloon,1350);
  cInt=setInterval(function(){
    tLeft--;document.getElementById('tnum').textContent=tLeft;
    if(tLeft<=10)document.getElementById('tnum').classList.add('urg');
    if(tLeft<=0)endGame();
  },1000);
}
</script>
</body>
</html>
