<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>나만의 작곡가 🎵</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{
  width:100%;height:100%;overflow:hidden;background:#F5F3FF;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
body{position:fixed;top:0;left:0;right:0;bottom:0;}
@supports (height:100dvh){ html,body{height:100dvh;} }

#app{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ── 시작 화면 ── */
#ss{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(9px,2.2vh,26px);padding:clamp(10px,2vh,26px);}
.stit{font-size:clamp(20px,min(4.2vh,7vw),52px);font-weight:900;color:#1a1a1a;text-align:center;line-height:1.35;}
.ssub{font-size:clamp(12px,min(2.1vh,3.6vw),22px);color:#666;text-align:center;padding:0 8px;}
#sbtn{background:#7C6BFF;color:#fff;border:none;border-radius:clamp(13px,2.2vh,24px);padding:clamp(11px,2vh,22px) clamp(28px,7vw,66px);font-size:clamp(16px,min(2.9vh,4.8vw),30px);font-weight:800;cursor:pointer;box-shadow:0 4px 0 #3C2BC9;font-family:inherit;}
#sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3C2BC9;}
.pnrow{display:flex;gap:clamp(3px,1vw,10px);justify-content:center;flex-wrap:wrap;}
.pn{width:clamp(30px,7.5vw,70px);height:clamp(38px,9vw,86px);border-radius:clamp(8px,1.6vh,14px);display:flex;align-items:center;justify-content:center;font-size:clamp(12px,min(2.2vh,3.4vw),26px);font-weight:900;color:#fff;border-bottom:4px solid rgba(0,0,0,.2);animation:pbounce 2s ease-in-out infinite;}
@keyframes pbounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* ── 게임 화면 ── */
#gs{display:none;flex:1 1 auto;flex-direction:column;gap:clamp(5px,1vh,13px);padding:clamp(6px,1.2vh,16px) clamp(8px,2vw,28px) clamp(8px,1.4vh,18px);min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.ghdr{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:6px;}
.gtit{font-size:clamp(11px,min(1.9vh,3.1vw),21px);font-weight:700;color:#666;}
#ncnt{font-size:clamp(11px,min(1.9vh,3.1vw),21px);font-weight:700;color:#7C6BFF;background:#F0EEFF;border-radius:8px;padding:2px clamp(6px,1.6vw,14px);white-space:nowrap;}

/* 음표 블록: 남은 세로 공간을 채운다 */
#ngrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(4px,1.2vw,12px);flex:1 1 auto;min-height:clamp(110px,20vh,320px);}
.nb{border:none;border-radius:clamp(10px,1.9vh,18px);padding:clamp(6px,1.2vh,16px) 4px;cursor:pointer;border-bottom:clamp(3px,0.7vh,7px) solid rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(2px,0.6vh,8px);min-height:0;font-family:inherit;}
.nb:active{transform:scale(0.88);filter:brightness(.85);border-bottom-width:2px;}
.nb .ne{font-size:clamp(16px,min(3.4vh,5.5vw),44px);line-height:1;}
.nb .nn{font-size:clamp(13px,min(2.6vh,4.4vw),34px);font-weight:900;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);line-height:1;}

/* 내가 만든 멜로디 */
#mwrap{background:#f0eeff;border-radius:clamp(10px,1.9vh,18px);padding:clamp(7px,1.3vh,16px) clamp(9px,2vw,18px);border:2px solid #d0c8ff;flex-shrink:0;}
.mlbl{font-size:clamp(10px,min(1.6vh,2.7vw),18px);font-weight:700;color:#666;margin-bottom:5px;}
#mrow{display:flex;gap:clamp(3px,0.9vw,9px);flex-wrap:wrap;min-height:clamp(38px,6.5vh,76px);align-items:center;}
.mn{width:clamp(28px,6.5vw,60px);height:clamp(36px,6.5vh,76px);border-radius:clamp(8px,1.6vh,14px);display:flex;align-items:center;justify-content:center;font-size:clamp(11px,min(2.1vh,3.2vw),24px);font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);border-bottom:3px solid rgba(0,0,0,.2);animation:nadd .22s ease;flex-shrink:0;}
@keyframes nadd{0%{transform:scale(0) rotate(-15deg);}65%{transform:scale(1.15);}100%{transform:scale(1);}}
.mn.playing{animation:nplay .3s ease !important;}
@keyframes nplay{0%,100%{transform:scale(1);}50%{transform:scale(1.28);filter:brightness(1.45);}}
.ehint{font-size:clamp(11px,min(1.9vh,3.1vw),20px);color:#aaa;width:100%;text-align:center;}

/* 조작 버튼 */
#ctrls{display:flex;gap:clamp(4px,1.2vw,12px);flex-shrink:0;}
.cb{flex:1;min-width:0;padding:clamp(8px,1.5vh,18px) 3px;border:none;border-radius:clamp(9px,1.8vh,16px);font-size:clamp(11px,min(2vh,3.2vw),22px);font-weight:700;cursor:pointer;border-bottom:3px solid rgba(0,0,0,.2);font-family:inherit;}
.cb:active{transform:translateY(2px);border-bottom-width:1px;}

/* 제목 저장 */
#ta{background:#f0eeff;border-radius:clamp(10px,1.9vh,18px);padding:clamp(7px,1.3vh,16px) clamp(9px,2vw,18px);border:2px solid #d0c8ff;flex-shrink:0;}
.tlbl{font-size:clamp(10px,min(1.6vh,2.7vw),18px);font-weight:700;color:#666;margin-bottom:5px;}
.trow{display:flex;gap:clamp(5px,1.4vw,12px);}
/* 입력 글씨는 16px 미만이면 iOS가 자동 확대되므로 16px 이상 유지 */
#tinput{flex:1;min-width:0;border:1.5px solid #c0b8ff;border-radius:clamp(7px,1.4vh,12px);padding:clamp(7px,1.3vh,15px) clamp(9px,2vw,16px);font-size:max(16px,clamp(16px,1.9vh,21px));font-weight:600;background:#fff;color:#1a1a1a;outline:none;touch-action:auto;font-family:inherit;-webkit-user-select:text;user-select:text;}
#tinput:focus{border-color:#7C6BFF;}
#svbtn{background:#7C6BFF;color:#fff;border:none;border-radius:clamp(7px,1.4vh,12px);padding:clamp(7px,1.3vh,15px) clamp(10px,2.5vw,22px);font-size:clamp(11px,min(1.9vh,3.1vw),21px);font-weight:700;cursor:pointer;flex-shrink:0;font-family:inherit;}
#svbtn:active{filter:brightness(.9);}

#fb{text-align:center;font-size:clamp(12px,min(2.2vh,3.6vw),24px);font-weight:700;min-height:clamp(30px,5vh,58px);display:flex;align-items:center;justify-content:center;border-radius:clamp(9px,1.7vh,15px);color:#666;flex-shrink:0;padding:0 clamp(6px,1.5vw,16px);}
#fb.ok{color:#1E8C3A;background:#EAFAF1;border:2px solid #52C97A;animation:fpop .3s ease;}
#fb.sv{color:#7C6BFF;background:#F0EEFF;border:2px solid #AA99FF;animation:fpop .3s ease;}
@keyframes fpop{0%{transform:scale(.9);}60%{transform:scale(1.05);}100%{transform:scale(1);}}
.cf{position:fixed;pointer-events:none;z-index:9999;animation:cfall linear forwards;}
@keyframes cfall{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(700deg);opacity:0;}}
</style>
</head>
<body>
<div id="app">
  <div id="ss">
    <div class="pnrow">
      <div class="pn" style="background:#FF6B6B;animation-delay:0s">도</div>
      <div class="pn" style="background:#FF9F43;animation-delay:.15s">레</div>
      <div class="pn" style="background:#FFC048;animation-delay:.3s">미</div>
      <div class="pn" style="background:#55E87B;animation-delay:.45s">파</div>
      <div class="pn" style="background:#43B8FF;animation-delay:.6s">솔</div>
      <div class="pn" style="background:#7C6BFF;animation-delay:.75s">라</div>
      <div class="pn" style="background:#EE6BDF;animation-delay:.9s">시</div>
      <div class="pn" style="background:#FF8FAF;animation-delay:1.05s">도↑</div>
    </div>
    <div class="stit">🎵 나만의 멜로디<br>작곡 놀이터!</div>
    <div class="ssub">음표를 골라 나만의 노래를 만들어봐요!</div>
    <button id="sbtn" onclick="startGame()">▶ 시작하기</button>
  </div>

  <div id="gs">
    <div class="ghdr">
      <span class="gtit">🎵 음표 블록을 눌러보세요!</span>
      <span id="ncnt">0 / 8</span>
    </div>
    <div id="ngrid">
      <button class="nb" style="background:#FF6B6B;border-color:#C93A3A" onclick="addNote(0)"><span class="ne">🍎</span><span class="nn">도</span></button>
      <button class="nb" style="background:#FF9F43;border-color:#C96F00" onclick="addNote(1)"><span class="ne">🍊</span><span class="nn">레</span></button>
      <button class="nb" style="background:#FFC048;border-color:#C48A00" onclick="addNote(2)"><span class="ne">🌟</span><span class="nn">미</span></button>
      <button class="nb" style="background:#55E87B;border-color:#1DA04A" onclick="addNote(3)"><span class="ne">🍀</span><span class="nn">파</span></button>
      <button class="nb" style="background:#43B8FF;border-color:#0079C9" onclick="addNote(4)"><span class="ne">🐬</span><span class="nn">솔</span></button>
      <button class="nb" style="background:#7C6BFF;border-color:#3C2BC9" onclick="addNote(5)"><span class="ne">🍇</span><span class="nn">라</span></button>
      <button class="nb" style="background:#EE6BDF;border-color:#A82BA0" onclick="addNote(6)"><span class="ne">🌸</span><span class="nn">시</span></button>
      <button class="nb" style="background:#FF8FAF;border-color:#C93A6A" onclick="addNote(7)"><span class="ne">🎀</span><span class="nn">도↑</span></button>
    </div>
    <div id="mwrap">
      <div class="mlbl">🎶 내가 만든 멜로디</div>
      <div id="mrow"><span class="ehint">음표를 눌러 멜로디를 채워보세요!</span></div>
    </div>
    <div id="ctrls">
      <button class="cb" style="background:#4CAF50;color:#fff;border-color:#2E7D32" onclick="playMelody()">▶ 재생</button>
      <button class="cb" style="background:#7C6BFF;color:#fff;border-color:#3C2BC9" onclick="randomMelody()">🎲 랜덤</button>
      <button class="cb" style="background:#FF6B6B;color:#fff;border-color:#C93A3A" onclick="clearMelody()">🗑 지우기</button>
    </div>
    <div id="ta">
      <div class="tlbl">🎀 내 노래 제목 정하기</div>
      <div class="trow">
        <input id="tinput" type="text" inputmode="text" placeholder="예: 봄날의 노래, 내 첫 멜로디..."/>
        <button id="svbtn" onclick="saveTitle()">💾 저장</button>
      </div>
    </div>
    <div id="fb">♪ 음표를 눌러 멜로디를 만들어보세요!</div>
  </div>
</div>
<script>
var AC=null,melody=[],MAX=8,playing=false;
var NOTES=[
  {name:'도',freq:261.63,color:'#FF6B6B'},{name:'레',freq:293.66,color:'#FF9F43'},
  {name:'미',freq:329.63,color:'#FFC048'},{name:'파',freq:349.23,color:'#55E87B'},
  {name:'솔',freq:392.00,color:'#43B8FF'},{name:'라',freq:440.00,color:'#7C6BFF'},
  {name:'시',freq:493.88,color:'#EE6BDF'},{name:'도↑',freq:523.25,color:'#FF8FAF'}
];
function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(freq,start,dur){
  var o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,start);g.gain.linearRampToValueAtTime(0.44,start+0.005);
  g.gain.exponentialRampToValueAtTime(0.1,start+dur*0.55);g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  o.connect(g);g.connect(AC.destination);o.start(start);o.stop(start+dur);
  var o2=AC.createOscillator(),g2=AC.createGain();
  o2.type='sine';o2.frequency.value=freq*2;
  g2.gain.setValueAtTime(0.14,start);g2.gain.exponentialRampToValueAtTime(0.001,start+dur*0.4);
  o2.connect(g2);g2.connect(AC.destination);o2.start(start);o2.stop(start+dur*0.4);
}
function addNote(idx){
  if(melody.length>=MAX||playing)return;
  melody.push(idx);renderMelody();updateCount();
  playTone(NOTES[idx].freq,AC.currentTime,0.42);
}
function renderMelody(){
  var r=document.getElementById('mrow');r.innerHTML='';
  if(melody.length===0){r.innerHTML='<span class="ehint">음표를 눌러 멜로디를 채워보세요!</span>';return;}
  for(var i=0;i<melody.length;i++){
    var n=NOTES[melody[i]],el=document.createElement('div');
    el.className='mn';el.id='mn'+i;el.style.background=n.color;el.textContent=n.name;
    r.appendChild(el);
  }
}
function updateCount(){document.getElementById('ncnt').textContent=melody.length+' / '+MAX;}
function playMelody(){
  if(melody.length===0||playing)return;playing=true;
  var gap=0.55,now=AC.currentTime;
  for(var i=0;i<melody.length;i++){
    (function(ni,si){
      playTone(NOTES[ni].freq,now+si*gap,0.44);
      setTimeout(function(){
        document.querySelectorAll('.mn.playing').forEach(function(e){e.classList.remove('playing');});
        var el=document.getElementById('mn'+si);if(el)el.classList.add('playing');
      },si*gap*1000);
    })(melody[i],i);
  }
  setTimeout(function(){
    playing=false;
    document.querySelectorAll('.mn.playing').forEach(function(e){e.classList.remove('playing');});
    setFb('🎉 연주 완료! 정말 멋진 멜로디예요!','ok');confetti();
  },melody.length*gap*1000+250);
}
function clearMelody(){if(playing)return;melody=[];renderMelody();updateCount();setFb('♪ 음표를 눌러 새 멜로디를 만들어보세요!','');}
function randomMelody(){
  if(playing)return;melody=[];
  var cnt=4+Math.floor(Math.random()*5);
  for(var i=0;i<cnt;i++)melody.push(Math.floor(Math.random()*8));
  renderMelody();updateCount();setFb('🎲 랜덤 멜로디가 만들어졌습니다! 재생해보세요!','ok');
}
function saveTitle(){
  var t=document.getElementById('tinput').value.trim();
  if(!t){setFb('✏️ 제목을 먼저 입력해주세요!','');return;}
  setFb('🎀 "'+t+'" 저장 완료! 훌륭한 작품이에요!','sv');
}
function setFb(txt,cls){var fb=document.getElementById('fb');fb.textContent=txt;fb.className=cls||'';}
function confetti(){
  var cols=['#FF6B6B','#FF9F43','#FFC048','#55E87B','#43B8FF','#7C6BFF','#EE6BDF','#fff'];
  for(var i=0;i<50;i++){(function(){
    var c=document.createElement('div');c.className='cf';
    var sz=5+Math.random()*9,dur=1.1+Math.random()*1.5,dl=Math.random()*.4;
    c.style.cssText='left:'+(Math.random()*100)+'vw;top:-12px;width:'+sz+'px;height:'+sz+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+dur+'s;animation-delay:'+dl+'s;';
    document.body.appendChild(c);c.addEventListener('animationend',function(){c.remove();});
  })();}
}
function startGame(){initAC();document.getElementById('ss').style.display='none';document.getElementById('gs').style.display='flex';}
</script>
</body>
</html>
