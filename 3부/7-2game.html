<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>터치 실로폰 🎶</title>
</head>
<body>
<style>
  /* ===== 반응형 전체화면 베이스 ===== */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{
    width:100%;height:100%;overflow:hidden;
    overscroll-behavior:none;-webkit-text-size-adjust:100%;
  }
  body{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:#FFFDF7;
    font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    user-select:none;-webkit-user-select:none;
  }
  @supports (height:100dvh){ html,body{height:100dvh;} }

  #app{
    width:100%;height:100%;
    display:flex;flex-direction:column;overflow:hidden;
    padding:
      calc(env(safe-area-inset-top) + clamp(6px,1.3vh,18px))
      calc(env(safe-area-inset-right) + clamp(8px,2vw,28px))
      calc(env(safe-area-inset-bottom) + clamp(8px,1.5vh,20px))
      calc(env(safe-area-inset-left) + clamp(8px,2vw,28px));
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* ===== 시작 화면 ===== */
  #start-screen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.2vh,26px);}
  #start-title{font-size:clamp(22px,min(4.6vh,7.5vw),56px);font-weight:800;color:#4A3F55;text-align:center;line-height:1.3;}
  #start-sub{font-size:clamp(13px,min(2.2vh,3.8vw),24px);color:#7A7286;text-align:center;padding:0 8px;}
  #start-btn{background:linear-gradient(135deg,#FF6B6B,#FF9F43);color:#fff;border:none;border-radius:clamp(14px,2.4vh,26px);padding:clamp(12px,2.2vh,24px) clamp(30px,7vw,70px);font-size:clamp(17px,min(3vh,5vw),32px);font-weight:800;cursor:pointer;box-shadow:0 4px 16px #FF9F4344;transition:transform .1s;font-family:inherit;}
  #start-btn:active{transform:scale(0.95);}
  .start-bars{display:flex;gap:clamp(4px,1vw,12px);align-items:flex-end;height:clamp(80px,22vh,220px);}
  .sb{width:clamp(16px,4vw,44px);border-radius:8px 8px 12px 12px;animation:idleFloat 2s ease-in-out infinite;}
  @keyframes idleFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}

  /* ===== 게임 화면 ===== */
  #game-screen{flex:1 1 auto;min-height:0;flex-direction:column;gap:clamp(5px,1vh,14px);}

  /* 모드 탭 */
  #mode-tabs{flex:0 0 auto;display:flex;gap:6px;background:#F1EDF7;border-radius:clamp(11px,2vh,18px);padding:4px;}
  .tab{flex:1;padding:clamp(7px,1.3vh,16px) 0;border:none;border-radius:clamp(8px,1.5vh,14px);font-size:clamp(12px,min(2vh,3.4vw),22px);font-weight:700;cursor:pointer;background:transparent;color:#7A7286;transition:all .15s;font-family:inherit;}
  .tab.active{background:#fff;color:#3D3548;box-shadow:0 1px 6px rgba(0,0,0,.08);}

  /* 누른 음 표시 */
  #note-flash{
    flex:0 0 auto;
    height:clamp(46px,9vh,120px);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(24px,min(6vh,9vw),76px);font-weight:900;
    border-radius:clamp(13px,2.2vh,22px);
    border:2.5px solid #E3DEF7;background:#fff;color:#4A3F8F;
    transition:background .15s,border-color .15s,color .15s;
    white-space:nowrap;overflow:hidden;padding:0 clamp(8px,2vw,20px);
  }
  #note-flash.hint{font-size:clamp(15px,min(3.4vh,5.6vw),40px);}

  /* 상태 / 미션 박스 */
  #status-box{flex:0 0 auto;border-radius:clamp(12px,2vh,20px);padding:clamp(8px,1.3vh,16px) clamp(11px,2.2vw,22px);border:2.5px solid #F9C440;background:#FFF9E6;}
  #status-label{font-size:clamp(10px,min(1.5vh,2.6vw),17px);font-weight:700;color:#C47F00;margin-bottom:3px;letter-spacing:.5px;}
  #status-text{font-size:clamp(14px,min(2.4vh,4.1vw),28px);font-weight:800;color:#7A5000;line-height:1.35;}
  #seq-display{display:flex;gap:clamp(4px,1vw,10px);flex-wrap:wrap;margin-top:5px;align-items:center;}
  .seq-dot{
    width:clamp(24px,4.2vh,46px);height:clamp(24px,4.2vh,46px);
    border-radius:50%;border:3px solid rgba(0,0,0,.15);
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s,opacity .2s;opacity:.45;flex:0 0 auto;
  }
  .seq-lbl{font-size:clamp(9px,1.7vh,18px);font-weight:800;color:#fff;text-align:center;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.3);}
  .seq-dot.done{opacity:1;transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(0,0,0,.15);}
  .seq-dot.current{opacity:1;transform:scale(1.2);box-shadow:0 0 0 3px #fff,0 0 0 5px #F9C440;animation:pulse .7s infinite alternate;}
  @keyframes pulse{from{box-shadow:0 0 0 3px #fff,0 0 0 5px #F9C440;}to{box-shadow:0 0 0 3px #fff,0 0 0 8px #FF9F43;}}

  #new-mission-btn{flex:0 0 auto;display:none;width:100%;padding:clamp(9px,1.6vh,20px);background:#7C6BFF;color:#fff;border:none;border-radius:clamp(11px,2vh,20px);font-size:clamp(14px,min(2.4vh,4.2vw),28px);font-weight:700;cursor:pointer;transition:transform .1s,background .1s;font-family:inherit;}
  #new-mission-btn:active{transform:scale(0.97);background:#5C4BDF;}

  /* 성공 배너 */
  #success-banner{flex:0 0 auto;display:none;text-align:center;font-size:clamp(15px,min(2.7vh,4.4vw),32px);font-weight:800;color:#1E8C3A;background:#EAFAF1;border:2.5px solid #52C97A;border-radius:clamp(12px,2vh,20px);padding:clamp(8px,1.3vh,16px);animation:bounceIn .5s ease;}
  #success-banner.show{display:block;}
  @keyframes bounceIn{0%{transform:scale(.7);opacity:0;}70%{transform:scale(1.08);}100%{transform:scale(1);opacity:1;}}

  /* 별 */
  #stars-row{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:clamp(24px,3.6vh,46px);overflow:hidden;}
  #stars-lbl{font-size:clamp(11px,min(1.8vh,3vw),20px);font-weight:600;color:#7A7286;flex:0 0 auto;}
  #stars-wrap{display:flex;gap:3px;overflow:hidden;flex:1 1 auto;}
  #star-cnt{font-size:clamp(11px,min(1.8vh,3vw),20px);font-weight:700;color:#7A7286;flex:0 0 auto;}
  .star-icon{font-size:clamp(17px,2.9vh,34px);animation:popStar .4s ease;}
  @keyframes popStar{0%{transform:scale(0) rotate(-20deg);}70%{transform:scale(1.3) rotate(5deg);}100%{transform:scale(1);}}

  /* ===== 실로폰: 남은 세로 공간을 모두 사용 ===== */
  #xylo-wrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:clamp(3px,0.7vh,10px);padding-top:clamp(3px,0.6vh,8px);}
  /* .bar-row 의 flex-grow 값은 JS가 원래 막대 비율(HEIGHTS)대로 넣어 준다 */
  .bar-row{display:flex;align-items:stretch;gap:clamp(5px,1.4vw,14px);width:100%;min-height:0;}
  .bar-label{font-size:clamp(11px,min(1.9vh,3vw),22px);font-weight:800;color:#7A7286;width:clamp(16px,4vw,34px);text-align:right;flex-shrink:0;align-self:center;}
  .bar{
    flex:1 1 auto;height:100%;min-height:0;
    border-radius:10px 10px 16px 16px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 clamp(10px,3vw,34px);
    color:rgba(255,255,255,.95);text-shadow:0 1px 4px rgba(0,0,0,.25);
    border:none;border-bottom:clamp(3px,0.7vh,8px) solid rgba(0,0,0,.18);
    transition:transform .08s,filter .08s;position:relative;overflow:hidden;
    font-family:inherit;
  }
  .bar:active,.bar.hit{transform:scaleY(.88) scaleX(1.02);filter:brightness(.82);border-bottom-width:2px;}
  .bar.bounce{animation:barBounce .35s ease;}
  @keyframes barBounce{0%{transform:scaleY(1);}20%{transform:scaleY(.82) scaleX(1.03);}50%{transform:scaleY(1.1) scaleX(.97);}75%{transform:scaleY(.96);}100%{transform:scaleY(1);}}
  .bar-name{font-size:clamp(13px,min(2.6vh,4.4vw),34px);font-weight:900;letter-spacing:1px;}
  .bar-emoji{font-size:clamp(15px,min(3vh,5vw),40px);}

  /* 색종이 */
  .confetti{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;animation:fall linear forwards;z-index:9999;}
  @keyframes fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(105vh) rotate(720deg);opacity:0;}}

  /* 가로가 넓은 화면: 막대가 지나치게 납작해지지 않도록 */
  @media (min-aspect-ratio: 5/4){
    #note-flash{height:clamp(42px,11vh,110px);}
    .bar-name{font-size:clamp(13px,min(3.4vh,3vw),34px);}
    .bar-emoji{font-size:clamp(15px,min(4vh,3.4vw),40px);}
  }
</style>

<div id="app">
  <h2 class="sr-only">어린이 실로폰 게임 — 막대를 눌러 소리를 내보세요!</h2>

  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="start-bars">
      <div class="sb" style="height:64%;background:#FF6B6B;animation-delay:0s;"></div>
      <div class="sb" style="height:73%;background:#FF9F43;animation-delay:.15s;"></div>
      <div class="sb" style="height:82%;background:#FFC048;animation-delay:.3s;"></div>
      <div class="sb" style="height:91%;background:#55E87B;animation-delay:.45s;"></div>
      <div class="sb" style="height:100%;background:#43B8FF;animation-delay:.6s;"></div>
      <div class="sb" style="height:86%;background:#7C6BFF;animation-delay:.75s;"></div>
      <div class="sb" style="height:75%;background:#EE6BDF;animation-delay:.9s;"></div>
      <div class="sb" style="height:62%;background:#FF6B6B;animation-delay:1.05s;"></div>
    </div>
    <div id="start-title">🎵 알록달록<br>실로폰 놀이터!</div>
    <div id="start-sub">막대를 두드려 신나는 음악을 만들어요!</div>
    <button id="start-btn">▶ 시작하기</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen">
    <div id="mode-tabs">
      <button class="tab active" id="tab-free">🎵 자유 연주</button>
      <button class="tab" id="tab-mission">🎯 미션 모드</button>
    </div>

    <div id="note-flash" class="hint">🎵 눌러보세요!</div>

    <div id="success-banner">🎉 참 잘했어요! 최고예요! 🌟</div>

    <div id="status-box">
      <div id="status-label">🎵 자유 연주 모드</div>
      <div id="status-text">마음껏 두드려 보세요!</div>
      <div id="seq-display"></div>
    </div>

    <button id="new-mission-btn">🎲 새 미션 받기</button>

    <div id="stars-row">
      <span id="stars-lbl">⭐ 모은 별:</span>
      <div id="stars-wrap"></div>
      <span id="star-cnt"></span>
    </div>

    <div id="xylo-wrap"></div>
  </div>
</div>

<script>
const BARS = [
  {name:'도', color:'#FF6B6B', shadow:'#C93A3A', emoji:'🍎', freq:261.63},
  {name:'레', color:'#FF9F43', shadow:'#C96F00', emoji:'🍊', freq:293.66},
  {name:'미', color:'#FFC048', shadow:'#C48A00', emoji:'🌟', freq:329.63},
  {name:'파', color:'#55E87B', shadow:'#1DA04A', emoji:'🍀', freq:349.23},
  {name:'솔', color:'#43B8FF', shadow:'#0079C9', emoji:'🐬', freq:392.00},
  {name:'라', color:'#7C6BFF', shadow:'#3C2BC9', emoji:'🍇', freq:440.00},
  {name:'시', color:'#EE6BDF', shadow:'#A82BA0', emoji:'🌸', freq:493.88},
  {name:'도↑', color:'#FF8FAF', shadow:'#C93A6A', emoji:'🎀', freq:523.25},
];
const HEIGHTS = [54,60,66,74,80,86,92,98];

let audioCtx = null;
let mode = 'free';
let stars = 0;
let mission = [];
let missionStep = 0;
let missionActive = false;
let successTimer = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTone(freq) {
  const ac = audioCtx;
  const osc = ac.createOscillator();
  const osc2 = ac.createOscillator();
  const gain = ac.createGain();
  const gain2 = ac.createGain();

  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, ac.currentTime);
  gain.gain.setValueAtTime(0.5, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.5);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime + 1.5);

  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(freq * 2, ac.currentTime);
  gain2.gain.setValueAtTime(0.18, ac.currentTime);
  gain2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.9);
  osc2.connect(gain2); gain2.connect(ac.destination);
  osc2.start(); osc2.stop(ac.currentTime + 0.9);
}

function buildXylo() {
  const wrap = document.getElementById('xylo-wrap');
  wrap.innerHTML = '';
  BARS.forEach((b, i) => {
    const row = document.createElement('div');
    row.className = 'bar-row';
    const lbl = document.createElement('div');
    lbl.className = 'bar-label';
    lbl.textContent = b.name === '도↑' ? '도' : b.name;

    const bar = document.createElement('button');
    bar.className = 'bar';
    bar.dataset.idx = i;
    // 화면 높이에 맞춰 늘어나되, 막대끼리의 굵기 비율(HEIGHTS)은 그대로 유지
    row.style.flex = HEIGHTS[i] + ' 1 0';
    bar.style.background = b.color;
    bar.style.borderBottomColor = b.shadow;
    bar.setAttribute('aria-label', b.name);
    bar.innerHTML = `<span class="bar-emoji">${b.emoji}</span><span class="bar-name">${b.name}</span>`;

    bar.addEventListener('pointerdown', (e) => { e.preventDefault(); onBarPress(i); });

    row.appendChild(lbl);
    row.appendChild(bar);
    wrap.appendChild(row);
  });
}

function onBarPress(idx) {
  const b = BARS[idx];
  playTone(b.freq);
  animateBar(idx);
  flashNote(b);

  if (mode === 'mission' && missionActive) {
    const expected = mission[missionStep];
    if (idx === expected) {
      missionStep++;
      updateMissionUI();
      if (missionStep >= mission.length) {
        missionActive = false;
        onMissionSuccess();
      }
    } else if (missionStep > 0) {
      missionStep = 0;
      document.getElementById('status-text').innerHTML = '❗ 처음부터 다시 눌러보세요! 💪';
      setTimeout(updateMissionUI, 900);
    }
  }
}

function animateBar(idx) {
  const bar = document.querySelector(`.bar[data-idx="${idx}"]`);
  if (!bar) return;
  bar.classList.remove('bounce');
  void bar.offsetWidth;
  bar.classList.add('bounce');
  bar.addEventListener('animationend', () => bar.classList.remove('bounce'), {once:true});
}

function flashNote(b) {
  const d = document.getElementById('note-flash');
  d.textContent = b.emoji + ' ' + b.name;
  d.classList.remove('hint');
  d.style.background = b.color + '22';
  d.style.borderColor = b.color;
  d.style.color = b.color;
  clearTimeout(d._t);
  d._t = setTimeout(() => {
    d.textContent = '🎵 눌러보세요!';
    d.classList.add('hint');
    d.style.background = '';
    d.style.borderColor = '';
    d.style.color = '';
  }, 1200);
}

const MISSIONS = [
  [0,1,2],[2,3,4],[4,5,6],[0,2,4],[1,3,5],
  [0,1,2,3],[3,4,5,6],[0,3,6],[2,4,2],[5,4,3,2],
  [0,2,4,6],[1,2,3,4,5],[6,5,4],[0,1,0,1],
];

function startMission() {
  const m = MISSIONS[Math.floor(Math.random() * MISSIONS.length)];
  mission = m;
  missionStep = 0;
  missionActive = true;
  document.getElementById('success-banner').classList.remove('show');
  document.getElementById('new-mission-btn').style.display = 'none';
  updateMissionUI();
}

function updateMissionUI() {
  const box = document.getElementById('status-box');
  document.getElementById('status-label').textContent = '🎯 미션 모드';

  const nameStr = mission.map(i => BARS[i].name).join(' → ');
  document.getElementById('status-text').textContent = `${nameStr} 순서대로 눌러보세요!`;

  const seq = document.getElementById('seq-display');
  seq.innerHTML = '';
  mission.forEach((barIdx, si) => {
    const dot = document.createElement('div');
    dot.className = 'seq-dot' + (si < missionStep ? ' done' : si === missionStep ? ' current' : '');
    dot.style.background = BARS[barIdx].color;
    const lbl = document.createElement('div');
    lbl.className = 'seq-lbl';
    lbl.textContent = BARS[barIdx].name;
    dot.appendChild(lbl);
    seq.appendChild(dot);
  });
}

function onMissionSuccess() {
  addStar();
  document.getElementById('success-banner').classList.add('show');
  launchConfetti();
  document.getElementById('new-mission-btn').style.display = 'block';
  document.getElementById('status-text').textContent = '🎉 성공! 새 미션을 받아보세요!';
  document.getElementById('seq-display').innerHTML = '';
  if (successTimer) clearTimeout(successTimer);
  successTimer = setTimeout(() => {
    document.getElementById('success-banner').classList.remove('show');
  }, 3500);
}

function addStar() {
  stars++;
  const wrap = document.getElementById('stars-wrap');
  const s = document.createElement('span');
  s.className = 'star-icon'; s.textContent = '⭐';
  wrap.appendChild(s);
  const maxVisible = Math.max(3, Math.floor(wrap.clientWidth / 30));
  while (wrap.children.length > maxVisible) wrap.removeChild(wrap.firstChild);
  document.getElementById('star-cnt').textContent = stars + '개';
}

function launchConfetti() {
  const colors = ['#FF6B6B','#FF9F43','#FFC048','#55E87B','#43B8FF','#7C6BFF','#EE6BDF','#fff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `
      left:${Math.random()*100}vw;
      top:-12px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${1.2+Math.random()*1.6}s;
      animation-delay:${Math.random()*.6}s;
    `;
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}

function setFreeMode() {
  mode = 'free';
  missionActive = false;
  document.getElementById('status-label').textContent = '🎵 자유 연주 모드';
  document.getElementById('status-text').textContent = '마음껏 두드려 보세요!';
  document.getElementById('seq-display').innerHTML = '';
  document.getElementById('new-mission-btn').style.display = 'none';
  document.getElementById('success-banner').classList.remove('show');
}

document.getElementById('start-btn').addEventListener('click', () => {
  initAudio();
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'flex';
  buildXylo();
});

document.getElementById('tab-free').addEventListener('click', () => {
  document.getElementById('tab-free').classList.add('active');
  document.getElementById('tab-mission').classList.remove('active');
  setFreeMode();
});

document.getElementById('tab-mission').addEventListener('click', () => {
  document.getElementById('tab-mission').classList.add('active');
  document.getElementById('tab-free').classList.remove('active');
  mode = 'mission';
  startMission();
});

document.getElementById('new-mission-btn').addEventListener('click', startMission);
</script>
</body>
</html>
