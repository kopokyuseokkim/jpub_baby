<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>짝 찾기 놀이 🎴</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{
  width:100%;height:100%;overflow:hidden;background:#F3F0FF;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
body{position:fixed;top:0;left:0;right:0;bottom:0;}
@supports (height:100dvh){ html,body{height:100dvh;} }

#app{
  width:100%;height:100%;
  display:flex;flex-direction:column;
  font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  user-select:none;-webkit-user-select:none;
  padding:
    calc(env(safe-area-inset-top) + clamp(6px,1.2vh,16px))
    calc(env(safe-area-inset-right) + clamp(8px,2vw,28px))
    calc(env(safe-area-inset-bottom) + clamp(8px,1.4vh,18px))
    calc(env(safe-area-inset-left) + clamp(8px,2vw,28px));
}

/* ── 시작 화면 ── */
#ss{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(9px,2.2vh,26px);}
.sttl{font-size:clamp(22px,min(4.6vh,7.6vw),60px);font-weight:900;color:#1a1a1a;text-align:center;line-height:1.35;}
.ssub{font-size:clamp(12px,min(2.2vh,3.7vw),24px);color:#666;text-align:center;padding:0 10px;}
.sbtn{background:#7C6BFF;color:#fff;border:none;border-radius:clamp(14px,2.5vh,28px);padding:clamp(11px,2vh,22px) clamp(30px,7vw,72px);font-size:clamp(16px,min(2.9vh,4.8vw),34px);font-weight:800;cursor:pointer;box-shadow:0 4px 0 #3C2BC9;font-family:inherit;}
.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #3C2BC9;}
.sbtn.gr{background:#4CAF50;box-shadow:0 4px 0 #2E7D32;}
.sbtn.gr:active{box-shadow:0 1px 0 #2E7D32;}
.lvbtns{display:flex;gap:clamp(6px,1.8vw,18px);flex-wrap:wrap;justify-content:center;}
.sbtn.lv{padding:clamp(10px,1.8vh,20px) clamp(18px,4.5vw,44px);font-size:clamp(13px,min(2.3vh,3.8vw),26px);}
.prev-row{display:flex;gap:clamp(5px,1.6vw,16px);justify-content:center;flex-wrap:wrap;}
.pcard{width:min(15vw,10vh);height:min(16vw,10.7vh);border-radius:clamp(9px,1.8vh,16px);background:#7C6BFF;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,min(4vh,6.4vw),52px);box-shadow:0 4px 0 #3C2BC9;animation:pcFl 2s ease-in-out infinite;}
@keyframes pcFl{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

/* ── 게임 화면 ── */
#gs{display:none;flex:1 1 auto;flex-direction:column;gap:clamp(5px,1.1vh,14px);min-height:0;}
#hud{display:flex;justify-content:space-between;align-items:center;padding:0 2px;flex-shrink:0;gap:6px;}
.hlvl{font-size:clamp(11px,min(1.9vh,3vw),21px);font-weight:700;background:#EDE7FF;color:#5E35B1;border-radius:8px;padding:clamp(2px,0.5vh,7px) clamp(7px,1.8vw,16px);white-space:nowrap;}
.hst{font-size:clamp(11px,min(1.9vh,3vw),21px);font-weight:700;color:#666;white-space:nowrap;}

/* 카드판: 카드 크기는 JS가 화면에 맞춰 계산해 넣는다 (--cw = 카드 한 장의 가로) */
#grid{display:grid;flex:1 1 auto;min-height:0;justify-content:center;align-content:center;}
.cw{cursor:pointer;-webkit-perspective:500px;perspective:500px;}
.ci{width:100%;height:100%;position:relative;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transition:transform .42s ease;-webkit-transition:-webkit-transform .42s ease;}
.ci.flipped,.ci.matched{-webkit-transform:rotateY(180deg);transform:rotateY(180deg);}
.cf{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:clamp(9px,calc(var(--cw,60px)*0.16),22px);-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cw,60px)*0.05);}
.cb{background:#7C6BFF;border-bottom:4px solid #3C2BC9;}
.cb-txt{font-size:calc(var(--cw,60px)*0.46);line-height:1;}
.cfr{-webkit-transform:rotateY(180deg);transform:rotateY(180deg);background:#FFF;border:2.5px solid #DDD;border-bottom:4px solid #BBB;}
.ci.matched .cfr{background:#EAFAF1;border-color:#52C97A;border-bottom-color:#2E7D32;}
.cemj{font-size:calc(var(--cw,60px)*0.37);line-height:1;}
.cname{font-size:calc(var(--cw,60px)*0.155);font-weight:700;color:#666;line-height:1.1;}
.ci.matched .cname{color:#1E8C3A;font-weight:900;}
@keyframes mPulse{0%,100%{-webkit-transform:rotateY(180deg) scale(1);transform:rotateY(180deg) scale(1);}45%{-webkit-transform:rotateY(180deg) scale(1.13);transform:rotateY(180deg) scale(1.13);}}
.ci.matched{animation:mPulse .38s ease;}

#msg{text-align:center;font-size:clamp(13px,min(2.3vh,3.8vw),26px);font-weight:700;min-height:clamp(32px,5.2vh,62px);display:flex;align-items:center;justify-content:center;border-radius:clamp(9px,1.8vh,16px);color:#666;flex-shrink:0;padding:0 clamp(6px,1.5vw,16px);}
#msg.ok{color:#1E8C3A;background:#EAFAF1;border:2px solid #52C97A;animation:mpop .3s ease;}
#msg.rt{color:#E65100;background:#FFF3E0;border:2px solid #FFB74D;animation:mpop .3s ease;}
@keyframes mpop{0%{transform:scale(.9);}60%{transform:scale(1.05);}100%{transform:scale(1);}}

/* ── 완료 화면 ── */
#ws{flex:1 1 auto;min-height:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:clamp(9px,2vh,24px);}
.wemj{font-size:clamp(46px,min(8.8vh,14.5vw),128px);animation:wej .7s ease infinite alternate;line-height:1;}
@keyframes wej{from{transform:scale(1);}to{transform:scale(1.1);}}
.wstars{font-size:clamp(30px,min(6vh,10vw),88px);letter-spacing:5px;}
.wstats{display:flex;gap:clamp(12px,4vw,44px);}
.wstat{text-align:center;}
.wsn{font-size:clamp(22px,min(4.2vh,6.8vw),56px);font-weight:900;color:#7C6BFF;line-height:1;}
.wsl{font-size:clamp(10px,min(1.7vh,2.8vw),19px);color:#666;font-weight:600;}
.wpraise{font-size:clamp(15px,min(2.9vh,4.8vw),36px);font-weight:900;color:#1a1a1a;text-align:center;}
.wbtns{display:flex;gap:clamp(7px,2vw,20px);flex-wrap:wrap;justify-content:center;}
.cf2{position:fixed;pointer-events:none;z-index:9999;animation:cfFl linear forwards;}
@keyframes cfFl{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(700deg);opacity:0;}}
</style>
</head>
<body>
<div id="app">
  <div id="ss">
    <div class="prev-row">
      <div class="pcard" style="animation-delay:0s">🐶</div>
      <div class="pcard" style="animation-delay:.25s">🍎</div>
      <div class="pcard" style="animation-delay:.5s">🚗</div>
      <div class="pcard" style="animation-delay:.75s">⭐</div>
    </div>
    <div class="sttl">🎴 짝 찾기 놀이!</div>
    <div class="ssub">같은 그림 카드를 찾아봐요!</div>
    <div class="lvbtns">
      <button class="sbtn lv" onclick="startGame(0)">레벨1 · 4쌍</button>
      <button class="sbtn lv" onclick="startGame(1)">레벨2 · 6쌍</button>
      <button class="sbtn lv" onclick="startGame(2)">레벨3 · 8쌍</button>
    </div>
  </div>
  <div id="gs">
    <div id="hud">
      <span class="hlvl" id="hlvl">레벨 1</span>
      <span class="hst" id="hmatch">🃏 0 / 4</span>
      <span class="hst" id="hmoves">시도: 0</span>
    </div>
    <div id="grid"></div>
    <div id="msg">카드를 두 장 골라봐요! 🔍</div>
  </div>
  <div id="ws">
    <div class="wemj" id="wemj">🎉</div>
    <div class="wstars" id="wstars">⭐⭐⭐</div>
    <div class="wpraise" id="wpraise">모두 찾았어요!</div>
    <div class="wstats">
      <div class="wstat"><div class="wsn" id="wp">4</div><div class="wsl">맞춘 쌍</div></div>
      <div class="wstat"><div class="wsn" id="wm">0</div><div class="wsl">시도 횟수</div></div>
      <div class="wstat"><div class="wsn" id="wt">0</div><div class="wsl">걸린 시간(초)</div></div>
    </div>
    <div class="wbtns">
      <button class="sbtn" onclick="startGame(curLv)">🔄 다시 하기</button>
      <button class="sbtn gr" id="nxtbtn" onclick="startGame(curLv+1)" style="display:none">▶ 다음 단계</button>
    </div>
  </div>
</div>
<script>
var ALL=[
  {id:'dog',e:'🐶',n:'강아지'},{id:'cat',e:'🐱',n:'고양이'},{id:'frog',e:'🐸',n:'개구리'},{id:'chick',e:'🐥',n:'병아리'},
  {id:'apple',e:'🍎',n:'사과'},{id:'banana',e:'🍌',n:'바나나'},{id:'grape',e:'🍇',n:'포도'},{id:'orange',e:'🍊',n:'오렌지'},
  {id:'car',e:'🚗',n:'자동차'},{id:'plane',e:'✈️',n:'비행기'},{id:'ship',e:'🚢',n:'배'},{id:'train',e:'🚂',n:'기차'}
];
var LEVELS=[{pairs:4,cols:4,rows:2,name:'레벨 1'},{pairs:6,cols:4,rows:3,name:'레벨 2'},{pairs:8,cols:4,rows:4,name:'레벨 3'}];
var curLv=0,cards=[],first=null,locked=false,matched=0,moves=0,t0=null,msgTmr=null;
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function startGame(lv){
  curLv=lv;var lvl=LEVELS[lv];
  ['ss','ws'].forEach(function(id){document.getElementById(id).style.display='none';});
  document.getElementById('gs').style.display='flex';
  var chosen=shuffle(ALL).slice(0,lvl.pairs),deck=shuffle(chosen.concat(chosen));
  cards=deck.map(function(c,i){return{id:c.id,e:c.e,n:c.n,idx:i,flipped:false,matched:false};});
  first=null;locked=false;matched=0;moves=0;t0=Date.now();
  document.getElementById('hlvl').textContent=lvl.name;
  document.getElementById('hmatch').textContent='🃏 0 / '+lvl.pairs;
  document.getElementById('hmoves').textContent='시도: 0';
  buildGrid(lvl);setMsg('카드를 두 장 골라봐요! 🔍','');
}
var CARD_RATIO=1.07; // 카드 세로 / 가로

function layoutGrid(){
  var g=document.getElementById('grid');
  if(!g)return;
  var lvl=LEVELS[curLv];
  var W=g.clientWidth,H=g.clientHeight;
  if(W<=0||H<=0)return;
  var gap=Math.max(5,Math.round(Math.min(W,H)*0.022));
  var availW=W-gap*(lvl.cols-1),availH=H-gap*(lvl.rows-1);
  var cw=Math.floor(Math.min(availW/lvl.cols,(availH/lvl.rows)/CARD_RATIO));
  if(cw<30)cw=30;
  var ch=Math.round(cw*CARD_RATIO);
  g.style.gap=gap+'px';
  g.style.gridTemplateColumns='repeat('+lvl.cols+','+cw+'px)';
  g.style.gridTemplateRows='repeat('+lvl.rows+','+ch+'px)';
  // 카드 안 글자 크기는 CSS가 이 값을 기준으로 계산한다
  g.style.setProperty('--cw',cw+'px');
}
window.addEventListener('resize',layoutGrid);
window.addEventListener('orientationchange',function(){setTimeout(layoutGrid,250);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',layoutGrid);

function buildGrid(lvl){
  var g=document.getElementById('grid');
  g.innerHTML='';
  cards.forEach(function(card){
    var wrap=document.createElement('div');wrap.className='cw';wrap.id='cw'+card.idx;
    var inner=document.createElement('div');inner.className='ci';inner.id='ci'+card.idx;
    var back=document.createElement('div');back.className='cf cb';var bt=document.createElement('div');bt.className='cb-txt';bt.textContent='🎴';back.appendChild(bt);
    var front=document.createElement('div');front.className='cf cfr';
    var emj=document.createElement('div');emj.className='cemj';emj.textContent=card.e;
    var nm=document.createElement('div');nm.className='cname';nm.textContent=card.n;
    front.appendChild(emj);front.appendChild(nm);
    inner.appendChild(back);inner.appendChild(front);wrap.appendChild(inner);
    (function(c){wrap.addEventListener('click',function(){onCard(c.idx);});wrap.addEventListener('touchstart',function(e){e.preventDefault();onCard(c.idx);},{passive:false});})(card);
    g.appendChild(wrap);
  });
  layoutGrid();
}
function onCard(idx){
  var c=cards[idx];if(locked||c.flipped||c.matched)return;
  c.flipped=true;flip(idx,true);
  if(!first){first=c;return;}
  var sec=c;moves++;document.getElementById('hmoves').textContent='시도: '+moves;locked=true;
  if(first.id===sec.id){
    first.matched=true;sec.matched=true;mark(first.idx);mark(sec.idx);matched++;
    document.getElementById('hmatch').textContent='🃏 '+matched+' / '+LEVELS[curLv].pairs;
    first=null;locked=false;setMsg('맞았어요! 🎉','ok');beep('match');
    clearTimeout(msgTmr);msgTmr=setTimeout(function(){setMsg('카드를 두 장 골라봐요! 🔍','');},1300);
    if(matched===LEVELS[curLv].pairs)setTimeout(showWin,700);
  }else{
    var f=first;first=null;setMsg('다시 찾아볼까요? 💪','rt');beep('miss');
    setTimeout(function(){f.flipped=false;sec.flipped=false;flip(f.idx,false);flip(sec.idx,false);locked=false;clearTimeout(msgTmr);setMsg('카드를 두 장 골라봐요! 🔍','');},1100);
  }
}
function flip(idx,on){var ci=document.getElementById('ci'+idx);if(!ci)return;if(on)ci.classList.add('flipped');else ci.classList.remove('flipped');}
function mark(idx){var ci=document.getElementById('ci'+idx);if(!ci)return;ci.classList.add('matched');}
function setMsg(t,cls){var m=document.getElementById('msg');m.textContent=t;m.className=cls||'';}
function beep(type){
  try{var AC=new(window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;
    if(type==='match'){[880,1100].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.16,t+i*.1);g.gain.exponentialRampToValueAtTime(0.001,t+i*.1+0.3);o.connect(g);g.connect(AC.destination);o.start(t+i*.1);o.stop(t+i*.1+0.35);});}
    else{var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=280;g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.2);}
  }catch(e){}
}
function showWin(){
  var el=Math.floor((Date.now()-t0)/1000),p=LEVELS[curLv].pairs;
  var stars=moves<=Math.ceil(p*1.4)?'⭐⭐⭐':moves<=p*2?'⭐⭐':'⭐';
  var pi=moves<=Math.ceil(p*1.4)?0:moves<=p*2?1:2;
  var emjs=['🏆','🎉','🌟'],praises=['짝 찾기 천재예요! 🏆','모두 찾았어요! 🎉','정말 잘 했어요! 🌟'];
  document.getElementById('gs').style.display='none';document.getElementById('ws').style.display='flex';
  document.getElementById('wemj').textContent=emjs[pi];document.getElementById('wstars').textContent=stars;document.getElementById('wpraise').textContent=praises[pi];
  document.getElementById('wp').textContent=p;document.getElementById('wm').textContent=moves;document.getElementById('wt').textContent=el;
  document.getElementById('nxtbtn').style.display=curLv<LEVELS.length-1?'block':'none';
  try{var AC=new(window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;[523,659,784,1047].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.16,t+i*.13);g.gain.exponentialRampToValueAtTime(0.001,t+i*.13+0.35);o.connect(g);g.connect(AC.destination);o.start(t+i*.13);o.stop(t+i*.13+0.4);});}catch(e){}
  var cols=['#7C6BFF','#FFD54F','#66BB6A','#42A5F5','#FF6B6B','#fff'];
  for(var i=0;i<55;i++){(function(){var c=document.createElement('div');c.className='cf2';var sz=5+Math.random()*9,dur=1.1+Math.random()*1.5;c.style.cssText='left:'+(Math.random()*100)+'vw;top:-10px;width:'+sz+'px;height:'+sz+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+dur+'s;animation-delay:'+(Math.random()*.4)+'s;';document.body.appendChild(c);c.addEventListener('animationend',function(){c.remove();});})();}
}
</script>
</body>
</html>
