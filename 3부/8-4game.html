<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>반짝반짝 메모리 길 ✨</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;overflow:hidden;background:#F3F0FF;}
body{display:flex;justify-content:center;}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif;user-select:none;}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes jig{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}

/* START */
#ss{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow-y:auto;animation:fadeUp .35s ease;}
.prev-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.pcard{width:58px;height:62px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.15);animation:float 2s ease-in-out infinite;}
.stit{font-size:25px;font-weight:900;color:#333;text-align:center;line-height:1.35;}
.ssub{font-size:13px;color:#888;text-align:center;line-height:1.7;}
.lvl-btns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:280px;}
.lvl-btn{border:none;border-radius:16px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;}
.lvl-btn:active{transform:translateY(3px);box-shadow:none!important;}
#lb0{background:linear-gradient(135deg,#66BB6A,#43A047);box-shadow:0 4px 0 #2E7D32;}
#lb1{background:linear-gradient(135deg,#42A5F5,#1E88E5);box-shadow:0 4px 0 #1565C0;}
#lb2{background:linear-gradient(135deg,#AB47BC,#8E24AA);box-shadow:0 4px 0 #6A1B9A;}
.lvl-sub{font-size:11px;font-weight:600;opacity:.85;}

/* GAME */
#gs{flex:1;display:none;flex-direction:column;min-height:0;animation:fadeUp .3s ease;}
.game-top{flex-shrink:0;padding:8px 8px 4px;display:flex;flex-direction:column;gap:6px;}
.hud{display:flex;align-items:center;gap:6px;}
.back-btn{background:#F0F0F0;border:none;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;color:#666;flex-shrink:0;}
.back-btn:active{transform:translateY(2px);}
.hlvl{font-size:13px;font-weight:900;color:#5E35B1;background:#EDE7FF;border-radius:9px;padding:5px 12px;}
.streak{margin-left:auto;display:flex;gap:3px;align-items:center;font-size:18px;}
.streak .st{opacity:.25;transition:opacity .2s,transform .2s;}
.streak .st.on{opacity:1;animation:pop .4s ease;}
/* 진행 점 */
.dots-wrap{background:#F9F9F9;border:1px solid #EEE;border-radius:12px;padding:7px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.dots-lbl{font-size:10px;font-weight:700;color:#AAA;}
.dots-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:20px;align-items:center;}
.mdot{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #DDD;}
.mdot.pd{background:#FFD54F;border-color:#FFA000;transform:scale(1.25);}
.mdot.ok{background:#66BB6A;border-color:#2E7D32;}
.mdot.ng{background:#FF6B6B;border-color:#C62828;}

/* 상태 메시지 */
.status{flex-shrink:0;margin:0 8px;text-align:center;font-size:17px;font-weight:900;min-height:46px;line-height:46px;border-radius:13px;color:#888;transition:all .2s;}
.status.show{color:#5E35B1;background:#EDE7FF;border:2px solid #B39DDB;}
.status.ok{color:#1E8C3A;background:#EAFAF1;border:2px solid #52C97A;animation:pop .35s ease;}
.status.ng{color:#C62828;background:#FFEBEE;border:2px solid #EF9A9A;animation:pop .3s ease;}

/* 그림 그리드 — 남은 공간 채움 */
.grid-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;}
#grid{width:100%;max-height:100%;display:grid;gap:10px;}
.tile{border:none;border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12),inset 0 0 0 3px rgba(0,0,0,.04);transition:transform .1s;overflow:hidden;}
.tile .emj{font-size:min(13vw,52px);line-height:1;transition:transform .15s;filter:grayscale(.15);}
.tile.lit{animation:tileLit .5s ease;}
.tile.lit .emj{transform:scale(1.25);filter:grayscale(0) drop-shadow(0 0 10px rgba(255,255,255,.9));}
@keyframes tileLit{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.12);}45%{box-shadow:0 0 0 4px #fff,0 0 24px 6px var(--glow),0 0 40px 12px var(--glow);background:var(--lit);}}
.tile.press{transform:scale(.92);}
.tile.correct{animation:tileOk .4s ease;}
@keyframes tileOk{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.12);}50%{box-shadow:0 0 0 4px #66BB6A,0 0 20px 4px rgba(102,187,106,.7);}}
.tile.disabled{pointer-events:none;}

/* WIN */
#ws{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow-y:auto;animation:fadeUp .4s ease;}
.win-emj{font-size:66px;animation:jig 1.2s ease-in-out infinite;}
.win-stars{font-size:44px;letter-spacing:6px;}
.win-stars span{display:inline-block;}
.win-stars span:nth-child(1){animation:jig 1.3s 0s ease-in-out infinite;}
.win-stars span:nth-child(2){animation:jig 1.3s .2s ease-in-out infinite;}
.win-stars span:nth-child(3){animation:jig 1.3s .4s ease-in-out infinite;}
.win-title{font-size:24px;font-weight:900;color:#333;text-align:center;}
.win-sub{font-size:14px;color:#888;text-align:center;background:#F5F5F5;border-radius:14px;padding:12px 20px;max-width:280px;}
.win-btns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:280px;}
.win-btn{border:none;border-radius:16px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;}
.win-btn:active{transform:translateY(3px);box-shadow:none!important;}
#again-btn{background:linear-gradient(135deg,#FFB74D,#FB8C00);box-shadow:0 4px 0 #E65100;}
#next-btn{background:linear-gradient(135deg,#66BB6A,#43A047);box-shadow:0 4px 0 #2E7D32;}
#home-btn{background:#EDE7FF;color:#5E35B1;box-shadow:0 4px 0 #B39DDB;}

.cf{position:fixed;pointer-events:none;z-index:9999;animation:cff linear forwards;}
@keyframes cff{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(700deg);opacity:0;}}
</style>
</head>
<body>
<div id="app">

  <!-- START -->
  <div id="ss">
    <div class="prev-row">
      <div class="pcard" style="background:#FFF3E0;animation-delay:0s">🐶</div>
      <div class="pcard" style="background:#FFEBEE;animation-delay:.2s">🍎</div>
      <div class="pcard" style="background:#E3F2FD;animation-delay:.4s">🚗</div>
      <div class="pcard" style="background:#F3E5F5;animation-delay:.6s">⭐</div>
    </div>
    <div class="stit">✨ 반짝반짝 메모리 길!</div>
    <div class="ssub">그림이 빛나는 순서를 잘 기억했다가<br>같은 순서로 눌러봐요! 🌟</div>
    <div class="lvl-btns">
      <button class="lvl-btn" id="lb0" onclick="startGame(0)">🌱 레벨 1 <span class="lvl-sub">(3~4개)</span></button>
      <button class="lvl-btn" id="lb1" onclick="startGame(1)">🌊 레벨 2 <span class="lvl-sub">(5~6개)</span></button>
      <button class="lvl-btn" id="lb2" onclick="startGame(2)">🌟 레벨 3 <span class="lvl-sub">(7~8개)</span></button>
    </div>
  </div>

  <!-- GAME -->
  <div id="gs">
    <div class="game-top">
      <div class="hud">
        <button class="back-btn" onclick="goHome()">← 뒤로</button>
        <span class="hlvl" id="hlvl">레벨 1</span>
        <div class="streak" id="streak">
          <span class="st">⭐</span><span class="st">⭐</span><span class="st">⭐</span>
        </div>
      </div>
      <div class="dots-wrap">
        <div class="dots-lbl">순서 따라가기</div>
        <div class="dots-row" id="dots"></div>
      </div>
    </div>
    <div class="status" id="status">잘 보세요! 👀</div>
    <div class="grid-wrap">
      <div id="grid"></div>
    </div>
  </div>

  <!-- WIN -->
  <div id="ws">
    <div class="win-emj" id="win-emj">🎉</div>
    <div class="win-stars" id="win-stars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="win-title" id="win-title">별 3개 완성!</div>
    <div class="win-sub" id="win-sub">기억력이 정말 대단해요!</div>
    <div class="win-btns">
      <button class="win-btn" id="again-btn" onclick="startGame(curLv)">🔄 다시 하기</button>
      <button class="win-btn" id="next-btn" onclick="startGame(curLv+1)" style="display:none">▶ 다음 레벨</button>
      <button class="win-btn" id="home-btn" onclick="goHome()">🏠 처음으로</button>
    </div>
  </div>

</div>
<script>
/* ── 그림 데이터 (동물·과일·탈것) ── */
var ITEMS=[
  {e:'🐶',n:'강아지',c:'#FFE0B2',g:'#FFB74D'},
  {e:'🐱',n:'고양이',c:'#FFCCBC',g:'#FF8A65'},
  {e:'🐰',n:'토끼',  c:'#F8BBD0',g:'#F06292'},
  {e:'🐸',n:'개구리',c:'#C8E6C9',g:'#66BB6A'},
  {e:'🍎',n:'사과',  c:'#FFCDD2',g:'#EF5350'},
  {e:'🍌',n:'바나나',c:'#FFF9C4',g:'#FDD835'},
  {e:'🍇',n:'포도',  c:'#E1BEE7',g:'#AB47BC'},
  {e:'🍓',n:'딸기',  c:'#F8BBD0',g:'#EC407A'},
  {e:'🚗',n:'자동차',c:'#BBDEFB',g:'#42A5F5'},
  {e:'🚌',n:'버스',  c:'#FFE082',g:'#FFB300'},
  {e:'🚂',n:'기차',  c:'#B2DFDB',g:'#26A69A'},
  {e:'✈️',n:'비행기',c:'#C5CAE9',g:'#5C6BC0'},
];

/* 레벨: 그리드 칸 수, 시작 길이, 최대 길이 */
var LEVELS=[
  {name:'레벨 1',tiles:6, cols:3, start:3, max:4},
  {name:'레벨 2',tiles:9, cols:3, start:5, max:6},
  {name:'레벨 3',tiles:9, cols:3, start:7, max:8},
];

var AC=null;
var curLv=0, tiles=[], seq=[], playerPos=0, seqLen=3;
var streak=0, state='idle', busy=false;

function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}

/* 그림이 빛날 때 나는 경쾌한 소리 (음정을 칸마다 다르게) */
function playTone(idx){
  if(!AC)return;
  var scale=[523.25,587.33,659.25,698.46,783.99,880.00,987.77,1046.50,1174.66];
  var freq=scale[idx%scale.length];
  var t=AC.currentTime;
  var o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(0.4,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.42);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.44);
  var o2=AC.createOscillator(),g2=AC.createGain();
  o2.type='sine';o2.frequency.value=freq*2;
  g2.gain.setValueAtTime(0.12,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o2.connect(g2);g2.connect(AC.destination);o2.start(t);o2.stop(t+0.22);
}
function playOk(){
  if(!AC)return;var t=AC.currentTime;
  [523,659,784,1047].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.16,t+i*.1);g.gain.exponentialRampToValueAtTime(0.001,t+i*.1+0.32);o.connect(g);g.connect(AC.destination);o.start(t+i*.1);o.stop(t+i*.1+0.35);});
}
function playNg(){
  if(!AC)return;var t=AC.currentTime;
  [330,247].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.14,t+i*.15);g.gain.exponentialRampToValueAtTime(0.001,t+i*.15+0.22);o.connect(g);g.connect(AC.destination);o.start(t+i*.15);o.stop(t+i*.15+0.25);});
}

function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function buildGrid(){
  var lvl=LEVELS[curLv];
  var grid=document.getElementById('grid');
  var rows=Math.ceil(lvl.tiles/lvl.cols);
  grid.style.gridTemplateColumns='repeat('+lvl.cols+',1fr)';
  grid.style.gridTemplateRows='repeat('+rows+',1fr)';
  // 타일이 정사각형에 가깝도록 그리드 비율을 열:행에 맞춤
  grid.style.aspectRatio=lvl.cols+' / '+rows;
  grid.innerHTML='';
  // 이 레벨에 쓸 그림 선택
  tiles=shuffle(ITEMS).slice(0,lvl.tiles);
  tiles.forEach(function(it,i){
    var btn=document.createElement('button');
    btn.className='tile';btn.id='tile-'+i;
    btn.style.setProperty('--glow',it.g);
    btn.style.setProperty('--lit',it.c);
    btn.innerHTML='<span class="emj">'+it.e+'</span>';
    btn.setAttribute('aria-label',it.n);
    (function(idx){
      btn.addEventListener('pointerdown',function(){onTilePress(idx);});
    })(i);
    grid.appendChild(btn);
  });
}

function litTile(i,cb){
  var t=document.getElementById('tile-'+i);
  if(!t){if(cb)cb();return;}
  t.classList.add('lit');playTone(i);
  setTimeout(function(){t.classList.remove('lit');if(cb)cb();},500);
}

function genSeq(){
  var lvl=LEVELS[curLv];
  seq=[];
  for(var i=0;i<seqLen;i++)seq.push(Math.floor(Math.random()*lvl.tiles));
  buildDots();
}

function buildDots(){
  var row=document.getElementById('dots');row.innerHTML='';
  for(var i=0;i<seq.length;i++){var d=document.createElement('div');d.className='mdot';d.id='dot-'+i;row.appendChild(d);}
}
function setDot(i,cls){var d=document.getElementById('dot-'+i);if(d)d.className='mdot'+(cls?' '+cls:'');}
function clearDots(){for(var i=0;i<seq.length;i++)setDot(i,'');}

function setStatus(txt,cls){var s=document.getElementById('status');s.textContent=txt;s.className='status'+(cls?' '+cls:'');}

function setTilesDisabled(on){
  document.querySelectorAll('.tile').forEach(function(t){t.classList.toggle('disabled',on);});
}

/* 순서 보여주기 */
function showSequence(){
  state='showing';busy=true;playerPos=0;clearDots();
  setStatus('잘 보세요! 👀','show');
  setTilesDisabled(true);
  var i=0;
  function step(){
    if(i>=seq.length){
      // 다 보여줌 → 입력 받기
      state='input';busy=false;setTilesDisabled(false);
      setStatus('이제 순서대로 눌러요! 👆','');
      return;
    }
    setDot(i,'pd');
    litTile(seq[i],function(){
      setDot(i,'');
      i++;
      setTimeout(step,180);
    });
  }
  setTimeout(step,600);
}

function onTilePress(idx){
  if(state!=='input'||busy)return;
  var t=document.getElementById('tile-'+idx);
  if(t){t.classList.add('press');setTimeout(function(){t.classList.remove('press');},150);}
  playTone(idx);
  var expected=seq[playerPos];
  if(idx===expected){
    setDot(playerPos,'ok');
    playerPos++;
    if(playerPos===seq.length){
      // 성공!
      busy=true;state='done';
      document.querySelectorAll('.tile').forEach(function(el){el.classList.add('correct');});
      setTimeout(function(){document.querySelectorAll('.tile').forEach(function(el){el.classList.remove('correct');});},450);
      setStatus('정확해요! 🎉','ok');playOk();
      streak++;updateStreak();
      var lvl=LEVELS[curLv];
      setTimeout(function(){
        if(streak>=3){ winLevel(); return; }
        // 다음 라운드 — 길이 한 단계 증가 (max 넘지 않게)
        if(seqLen<lvl.max)seqLen++;
        genSeq();showSequence();
      },1400);
    }
  }else{
    // 틀림
    busy=true;state='wrong';
    setDot(playerPos,'ng');
    setStatus('괜찮아, 다시 잘 보고 따라 해볼까? 💪','ng');playNg();
    streak=0;updateStreak();
    setTilesDisabled(true);
    setTimeout(function(){
      playerPos=0;
      showSequence(); // 정답 순서 다시 보여주고 재도전
    },1700);
  }
}

function updateStreak(){
  var sts=document.querySelectorAll('#streak .st');
  sts.forEach(function(s,i){s.classList.toggle('on',i<streak);});
}

function winLevel(){
  var lvl=LEVELS[curLv];
  document.getElementById('gs').style.display='none';
  document.getElementById('ws').style.display='flex';
  document.getElementById('win-emj').textContent='🏆';
  document.getElementById('win-title').textContent=lvl.name+' 별 3개 완성! ⭐⭐⭐';
  var subs=['기억력이 정말 대단해요! 🌟','순서를 완벽하게 기억했어요! 👏','메모리 천재예요! 최고! 🧠'];
  document.getElementById('win-sub').textContent=subs[Math.floor(Math.random()*subs.length)];
  document.getElementById('next-btn').style.display=(curLv<LEVELS.length-1)?'block':'none';
  launchConfetti();
}

function launchConfetti(){
  var cols=['#FFD54F','#66BB6A','#42A5F5','#AB47BC','#FF6B6B','#FF8FCF','#fff'];
  for(var i=0;i<60;i++){(function(){
    var c=document.createElement('div');c.className='cf';
    var sz=6+Math.random()*9,dur=1.2+Math.random()*1.6;
    c.style.cssText='left:'+(Math.random()*100)+'vw;top:-12px;width:'+sz+'px;height:'+sz+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+dur+'s;animation-delay:'+(Math.random()*.4)+'s;';
    document.body.appendChild(c);c.addEventListener('animationend',function(){c.remove();});
  })();}
}

function startGame(lv){
  initAC();
  if(lv>=LEVELS.length)lv=LEVELS.length-1;
  curLv=lv;streak=0;
  seqLen=LEVELS[curLv].start;
  document.getElementById('ss').style.display='none';
  document.getElementById('ws').style.display='none';
  document.getElementById('gs').style.display='flex';
  document.getElementById('hlvl').textContent=LEVELS[curLv].name;
  updateStreak();
  buildGrid();
  requestAnimationFrame(function(){
    genSeq();
    showSequence();
  });
}

function goHome(){
  state='idle';busy=false;
  document.getElementById('gs').style.display='none';
  document.getElementById('ws').style.display='none';
  document.getElementById('ss').style.display='flex';
}

/* 초기 화면 */
goHome();
</script>
</body>
</html>
