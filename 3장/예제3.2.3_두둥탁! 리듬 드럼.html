<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>두둥탁! 리듬 드럼 🥁</title>
</head>
<body>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Segoe UI', sans-serif; }
  #app { width: 100%; padding: 10px 8px 16px; user-select: none; }

  /* ── 시작 화면 ── */
  #scr-start { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 0; }
  .big-title { font-size: 26px; font-weight: 900; text-align: center; color: #222; line-height: 1.4; }
  .sub-txt { font-size: 13px; color: #888; text-align: center; }
  .preview-drums { display: flex; gap: 14px; align-items: flex-end; }
  .pd { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 5px solid rgba(0,0,0,0.15); animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
  #btn-start { background: #E53935; color: #fff; border: none; border-radius: 20px; padding: 14px 46px; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 #8B0000; }
  #btn-start:active { transform: translateY(4px); box-shadow: 0 1px 0 #8B0000; }

  /* ── 게임 화면 ── */
  #scr-game { display: none; flex-direction: column; gap: 8px; }

  /* 탭 */
  .tabs { display: flex; gap: 5px; background: #f0f0f0; border-radius: 12px; padding: 4px; }
  .tab-btn { flex: 1; padding: 8px 0; border: none; border-radius: 9px; font-size: 13px; font-weight: 700; cursor: pointer; background: transparent; color: #888; }
  .tab-btn.on { background: #fff; color: #222; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }

  /* 정보 행 */
  .info-row { display: flex; justify-content: space-between; align-items: center; }
  .badge { font-size: 12px; font-weight: 700; border-radius: 8px; padding: 4px 10px; }
  .badge-lv { background: #EDE7FF; color: #5E35B1; }
  .badge-sc { background: #FFEBEE; color: #C62828; }

  /* 자유모드 메시지 */
  #free-msg { text-align: center; font-size: 28px; font-weight: 900; height: 52px; line-height: 52px; border-radius: 14px; background: #f5f5f5; border: 2px solid #ddd; color: #333; transition: background .15s, color .15s; }

  /* 리듬 표시줄 */
  #rhythm-box { background: #f5f5f5; border-radius: 14px; padding: 10px 10px 11px; }
  #rhythm-title { font-size: 11px; font-weight: 700; color: #888; margin-bottom: 7px; }
  #beat-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .beat-cell { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.3); border: 2px solid rgba(0,0,0,0.12); opacity: 0.35; transition: transform 0.15s; }
  .beat-cell.cur { opacity: 1; transform: scale(1.22); box-shadow: 0 0 0 3px #fff, 0 0 0 5px #888; animation: blink .6s ease-in-out infinite alternate; }
  .beat-cell.ok { opacity: 0.6; transform: scale(0.9); }
  @keyframes blink { from { box-shadow: 0 0 0 3px #fff, 0 0 0 5px rgba(0,0,0,0.4); } to { box-shadow: 0 0 0 3px #fff, 0 0 0 7px rgba(0,0,0,0.8); } }

  /* 피드백 */
  #feedback { text-align: center; font-size: 20px; font-weight: 900; height: 44px; line-height: 44px; border-radius: 12px; background: #f5f5f5; color: #333; transition: all .2s; }
  #feedback.win { background: #E8F5E9; color: #2E7D32; border: 2px solid #81C784; animation: pop .4s ease; }
  #feedback.err { background: #FFEBEE; color: #C62828; border: 2px solid #EF9A9A; animation: pop .3s ease; }
  @keyframes pop { 0%{ transform: scale(.85); } 60%{ transform: scale(1.06); } 100%{ transform: scale(1); } }

  /* 별 */
  .star-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .star-lbl { font-size: 12px; color: #888; font-weight: 600; }
  .star-wrap { display: flex; flex-wrap: wrap; gap: 2px; }
  .star-icon { font-size: 18px; animation: sp .4s ease; }
  @keyframes sp { 0%{ transform: scale(0) rotate(-30deg); } 70%{ transform: scale(1.3); } 100%{ transform: scale(1); } }

  /* ── 드럼 ── */
  #drum-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
  .drum-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .drum-btn {
    width: 100%; aspect-ratio: 1; border-radius: 50%; border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; position: relative; overflow: hidden;
    border-bottom: 8px solid rgba(0,0,0,0.22);
  }
  .drum-btn::before { content:''; position:absolute; inset:10px; border-radius:50%; border:3px solid rgba(255,255,255,0.25); pointer-events:none; }
  .drum-btn::after  { content:''; position:absolute; inset:22px; border-radius:50%; border:2px solid rgba(255,255,255,0.15); pointer-events:none; }
  .drum-btn .de { font-size: 24px; pointer-events: none; }
  .drum-btn .dn { font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.35); pointer-events: none; line-height: 1; }
  .drum-btn:active { transform: scale(0.88); filter: brightness(0.82); }
  .drum-btn.hit { animation: dhit .28s ease; }
  @keyframes dhit { 0%{transform:scale(1);} 25%{transform:scale(.82);} 65%{transform:scale(1.1);} 100%{transform:scale(1);} }
  .drum-sub { font-size: 12px; font-weight: 700; color: #888; }

  /* 꽃가루 */
  .cf { position:fixed; pointer-events:none; z-index:9999; animation:fall linear forwards; }
  @keyframes fall { 0%{transform:translateY(-10px) rotate(0); opacity:1;} 100%{transform:translateY(110vh) rotate(700deg); opacity:0;} }
</style>

<div id="app">

  <!-- 시작 화면 -->
  <div id="scr-start">
    <div class="preview-drums">
      <div class="pd" style="width:70px;height:70px;background:#E53935;animation-delay:0s">🥁</div>
      <div class="pd" style="width:58px;height:58px;background:#F9A825;animation-delay:.35s">👏</div>
      <div class="pd" style="width:64px;height:64px;background:#1E88E5;animation-delay:.7s">🪘</div>
    </div>
    <div class="big-title">🥁 신나는<br>드럼 놀이터!</div>
    <div class="sub-txt">두드리면 소리가 나요!</div>
    <button id="btn-start" onclick="startGame()">▶ 시작하기</button>
  </div>

  <!-- 게임 화면 -->
  <div id="scr-game">

    <div class="tabs">
      <button class="tab-btn on" id="t-free"   onclick="goFree()">🎵 자유 연주</button>
      <button class="tab-btn"   id="t-mission" onclick="goMission()">🎯 리듬 따라치기</button>
    </div>

    <div class="info-row">
      <span class="badge badge-lv" id="lv-badge">레벨 1 · 3박자</span>
      <span class="badge badge-sc" id="sc-badge">⭐ 0점</span>
    </div>

    <!-- 자유모드 표시 -->
    <div id="free-msg">🥁 두드려 보세요!</div>

    <!-- 미션모드 리듬 -->
    <div id="rhythm-box" style="display:none">
      <div id="rhythm-title">🎯 이 순서대로 두드려 보세요!</div>
      <div id="beat-row"></div>
    </div>

    <div id="feedback">🥁 두드려 보세요!</div>

    <div class="star-row">
      <span class="star-lbl">🏆 점수</span>
      <div class="star-wrap" id="star-wrap"></div>
      <span style="font-size:12px;font-weight:700;color:#888" id="star-cnt"></span>
    </div>

    <!-- 드럼 3개 -->
    <div id="drum-row">
      <div class="drum-col">
        <button class="drum-btn" id="d0" style="background:#E53935;border-bottom-color:#8B0000" onclick="hitDrum(0)">
          <span class="de">🥁</span><span class="dn">쿵</span>
        </button>
        <div class="drum-sub">큰북</div>
      </div>
      <div class="drum-col">
        <button class="drum-btn" id="d1" style="background:#F9A825;border-bottom-color:#E65100" onclick="hitDrum(1)">
          <span class="de">👏</span><span class="dn">짝</span>
        </button>
        <div class="drum-sub">손뼉</div>
      </div>
      <div class="drum-col">
        <button class="drum-btn" id="d2" style="background:#1E88E5;border-bottom-color:#0D47A1" onclick="hitDrum(2)">
          <span class="de">🪘</span><span class="dn">탁</span>
        </button>
        <div class="drum-sub">작은북</div>
      </div>
    </div>

  </div>
</div>

<script>
var AC = null;
var mode = 'free';
var score = 0;
var stars = 0;
var seqLen = 3;
var level = 1;
var seq = [];
var step = 0;
var missionActive = false;
var nextTimer = null;

var COLORS = ['#E53935', '#F9A825', '#1E88E5'];
var NAMES  = ['쿵', '짝', '탁'];

/* ── 오디오 ── */
function noise(dur) {
  var n = Math.floor(AC.sampleRate * dur);
  var b = AC.createBuffer(1, n, AC.sampleRate);
  var d = b.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  var s = AC.createBufferSource(); s.buffer = b; return s;
}

function playKung() {
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(90, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(38, AC.currentTime + 0.35);
  g.gain.setValueAtTime(1.3, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.55);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.55);
  var c = AC.createOscillator(), cg = AC.createGain();
  c.frequency.value = 200; cg.gain.setValueAtTime(0.5, AC.currentTime);
  cg.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.04);
  c.connect(cg); cg.connect(AC.destination); c.start(); c.stop(AC.currentTime + 0.04);
}

function playJjak() {
  var ns = noise(0.18);
  var bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 0.6;
  var g = AC.createGain(); g.gain.setValueAtTime(0.9, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.18);
  ns.connect(bp); bp.connect(g); g.connect(AC.destination); ns.start(); ns.stop(AC.currentTime + 0.18);
  var o = AC.createOscillator(), og = AC.createGain();
  o.type = 'triangle'; o.frequency.value = 200;
  og.gain.setValueAtTime(0.3, AC.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.1);
  o.connect(og); og.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.1);
}

function playTak() {
  var ns = noise(0.09);
  var hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
  var g = AC.createGain(); g.gain.setValueAtTime(0.65, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.09);
  ns.connect(hp); hp.connect(g); g.connect(AC.destination); ns.start(); ns.stop(AC.currentTime + 0.09);
  var o = AC.createOscillator(), og = AC.createGain();
  o.type = 'square'; o.frequency.value = 560;
  og.gain.setValueAtTime(0.18, AC.currentTime);
  og.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.04);
  o.connect(og); og.connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.04);
}

var SND = [playKung, playJjak, playTak];

/* ── 시작 ── */
function startGame() {
  AC = new (window.AudioContext || window.webkitAudioContext)();
  document.getElementById('scr-start').style.display = 'none';
  document.getElementById('scr-game').style.display = 'flex';
}

/* ── 모드 ── */
function goFree() {
  mode = 'free'; missionActive = false;
  document.getElementById('t-free').classList.add('on');
  document.getElementById('t-mission').classList.remove('on');
  document.getElementById('free-msg').style.display = 'block';
  document.getElementById('rhythm-box').style.display = 'none';
  setFb('🥁 두드려 보세요!', '');
}

function goMission() {
  mode = 'mission';
  document.getElementById('t-mission').classList.add('on');
  document.getElementById('t-free').classList.remove('on');
  document.getElementById('free-msg').style.display = 'none';
  document.getElementById('rhythm-box').style.display = 'block';
  newSeq();
}

/* ── 리듬 ── */
function newSeq() {
  seq = [];
  for (var i = 0; i < seqLen; i++) seq.push(Math.floor(Math.random() * 3));
  step = 0; missionActive = true;
  renderBeats();
  setFb('👀 따라 쳐보세요!', '');
}

function renderBeats() {
  var row = document.getElementById('beat-row');
  row.innerHTML = '';
  for (var i = 0; i < seq.length; i++) {
    var id = seq[i];
    var cell = document.createElement('div');
    cell.className = 'beat-cell' + (i === 0 ? ' cur' : '');
    cell.id = 'bc' + i;
    cell.style.background = COLORS[id];
    cell.textContent = NAMES[id];
    row.appendChild(cell);
  }
}

/* ── 드럼 누르기 ── */
function hitDrum(id) {
  if (!AC) return;
  SND[id]();
  animDrum(id);

  if (mode === 'free') {
    var fm = document.getElementById('free-msg');
    var cols = ['#E53935', '#F9A825', '#1E88E5'];
    var emojis = ['🥁', '👏', '🪘'];
    fm.textContent = emojis[id] + ' ' + NAMES[id] + '!';
    fm.style.background = cols[id] + '33';
    fm.style.color = cols[id];
    fm.style.borderColor = cols[id];
    clearTimeout(fm._t);
    fm._t = setTimeout(function() {
      fm.textContent = '🥁 두드려 보세요!';
      fm.style.background = '';
      fm.style.color = '';
      fm.style.borderColor = '';
    }, 900);
    return;
  }

  if (!missionActive) return;

  if (id === seq[step]) {
    var cell = document.getElementById('bc' + step);
    if (cell) { cell.classList.remove('cur'); cell.classList.add('ok'); }
    step++;
    if (step >= seq.length) {
      onSuccess();
    } else {
      var nc = document.getElementById('bc' + step);
      if (nc) nc.classList.add('cur');
    }
  } else {
    onWrong();
  }
}

function animDrum(id) {
  var btn = document.getElementById('d' + id);
  if (!btn) return;
  btn.classList.remove('hit');
  void btn.offsetWidth;
  btn.classList.add('hit');
  btn.addEventListener('animationend', function() { btn.classList.remove('hit'); }, { once: true });
}

/* ── 성공 / 실패 ── */
var PRAISE = ['리듬 천재! 🎉', '완벽해요! 🌟', '대단해요! 🔥', '최고예요! 👑', '신기하다! ✨'];

function onSuccess() {
  missionActive = false;
  var pts = seqLen * 10;
  score += pts;
  addStar();
  setFb(PRAISE[Math.floor(Math.random() * PRAISE.length)], 'win');
  confetti();
  document.getElementById('sc-badge').textContent = '⭐ ' + score + '점';
  seqLen = Math.min(seqLen + 1, 8);
  level++;
  document.getElementById('lv-badge').textContent = '레벨 ' + level + ' · ' + seqLen + '박자';
  clearTimeout(nextTimer);
  nextTimer = setTimeout(function() { newSeq(); }, 1800);
}

function onWrong() {
  missionActive = false;
  setFb('다시 해봐요! 💪', 'err');
  clearTimeout(nextTimer);
  nextTimer = setTimeout(function() {
    step = 0; missionActive = true;
    renderBeats();
    setFb('👀 처음부터 다시!', '');
  }, 1000);
}

function setFb(txt, cls) {
  var f = document.getElementById('feedback');
  f.textContent = txt;
  f.className = cls || '';
}

function addStar() {
  stars++;
  var s = document.createElement('span');
  s.className = 'star-icon'; s.textContent = '⭐';
  document.getElementById('star-wrap').appendChild(s);
  document.getElementById('star-cnt').textContent = stars + '개';
}

function confetti() {
  var cols = ['#E53935','#F9A825','#1E88E5','#43A047','#AB47BC','#fff'];
  for (var i = 0; i < 55; i++) {
    (function() {
      var c = document.createElement('div');
      c.className = 'cf';
      var sz = 5 + Math.random() * 9;
      var dur = 1.1 + Math.random() * 1.6;
      var delay = Math.random() * 0.45;
      var col = cols[Math.floor(Math.random() * cols.length)];
      var isCircle = Math.random() > 0.5;
      c.style.cssText = 'left:' + (Math.random()*100) + 'vw;top:-12px;width:' + sz + 'px;height:' + sz + 'px;background:' + col + ';border-radius:' + (isCircle ? '50%' : '2px') + ';animation-duration:' + dur + 's;animation-delay:' + delay + 's;';
      document.body.appendChild(c);
      c.addEventListener('animationend', function() { c.remove(); });
    })();
  }
}
</script>
</body>
</html>
