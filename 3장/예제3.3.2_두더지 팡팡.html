<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>두더지 팡팡 🐾</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{height:100%;overflow:hidden;background:#FFF8F4;}
body{display:flex;justify-content:center;}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;font-family:'Segoe UI',sans-serif;user-select:none;padding:8px 8px 10px;}

/* START */
#ss{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.sttl{font-size:26px;font-weight:900;color:#1a1a1a;text-align:center;line-height:1.35;}
.ssub{font-size:13px;color:#666;text-align:center;}
.sbtn{background:#FF7043;color:#fff;border:none;border-radius:22px;padding:14px 50px;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #C84020;}
.sbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #C84020;}
.pv-row{display:flex;gap:10px;}
.pv-cell{width:72px;height:72px;background:#C4965A;border-radius:14px;border-bottom:4px solid #A07040;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;}
.pv-cell::after{content:'';position:absolute;bottom:-2px;left:10%;width:80%;height:38%;background:#2A1200;border-radius:50%;z-index:2;pointer-events:none;}
.pv-mole{font-size:26px;margin-bottom:4px;animation:pvBounce 1.5s ease-in-out infinite;position:relative;z-index:1;}
@keyframes pvBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}

/* GAME */
#gs{display:none;flex:1;flex-direction:column;gap:8px;min-height:0;}
#hud{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.hbox{display:flex;align-items:center;gap:5px;}
.hico{font-size:20px;}
.hnum{font-size:26px;font-weight:900;min-width:36px;}
#snum{color:#FF7043;}
#tnum{color:#7C6BFF;text-align:right;}
#tnum.urg{color:#FF2020;animation:turg .45s ease-in-out infinite alternate;}
@keyframes turg{from{transform:scale(1);}to{transform:scale(1.22);}}
.hlvl{font-size:12px;font-weight:700;background:#FFF0E8;color:#FF7043;border-radius:8px;padding:3px 8px;}

/* 그리드 — flex:1로 남은 공간 채우고, 내부에 3x3 고정 비율 */
#grid-wrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;}
#grid{
  width:100%;
  max-height:100%;
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  gap:10px;
}

/* 핵심: .cell은 grid 아이템 — 높이는 grid가 결정하므로 height:100% 명시 */
.cell{
  position:relative;
  background:#C4965A;
  border-radius:14px;
  border-bottom:4px solid #A07040;
  overflow:hidden;
  cursor:pointer;
  /* grid-item이 높이를 가지도록 */
  min-height:0;
}
/* 구멍 안쪽 어두운 부분 (두더지 뒤) */
.cell::after{
  content:'';position:absolute;bottom:-2px;left:12%;
  width:76%;height:26%;background:#2A1200;
  border-radius:50%;z-index:1;pointer-events:none;
}

/* 두더지 — cell 높이 기준 절대 배치 */
.mole{
  position:absolute;
  bottom:0;left:50%;
  transform:translateX(-50%) translateY(102%);
  transition:transform .24s cubic-bezier(0.34,1.56,0.64,1);
  z-index:2;cursor:pointer;
  width:64%;
}
.mole.up{transform:translateX(-50%) translateY(-8%);}
.mole.hit{transition:none;animation:moleHit .22s ease forwards;}
@keyframes moleHit{0%{transform:translateX(-50%) translateY(-8%) scale(1.12);}100%{transform:translateX(-50%) translateY(110%) scale(.7);}}

/* 구멍 앞쪽 흙더미 (두더지 아랫부분을 살짝 가려 구멍에서 나오는 느낌) */
.cell::before{
  content:'';position:absolute;bottom:-8px;left:5%;
  width:90%;height:24%;background:#A9784A;
  border-radius:50%;z-index:3;pointer-events:none;
}

.mf{
  width:100%;
  /* padding-bottom 대신 aspect-ratio 사용해 실제 크기 확보 */
  aspect-ratio:1/1;
  position:relative;
  background:#8B5E3C;
  border-radius:50% 50% 42% 42% / 55% 55% 45% 45%;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
}
.mole.gold .mf{background:#D4A820;box-shadow:0 3px 14px rgba(212,168,32,.45);}
.me{position:absolute;width:18%;height:18%;background:#1A0A00;border-radius:50%;top:26%;}
.me::after{content:'';position:absolute;top:14%;right:14%;width:36%;height:36%;background:white;border-radius:50%;}
.me.l{left:20%}.me.r{right:20%}
.mn{position:absolute;width:20%;height:13%;background:#FF8FA0;border-radius:50%;top:50%;left:50%;transform:translateX(-50%);}
.mole.gold .mn{background:#FF6B9D;}
.mck{position:absolute;width:18%;height:11%;background:rgba(255,150,150,.5);border-radius:50%;top:54%;}
.mck.l{left:7%}.mck.r{right:7%}
.mstar{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:15px;display:none;z-index:4;}

.pop-txt{position:absolute;top:16%;left:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:900;pointer-events:none;z-index:10;white-space:nowrap;animation:popTxt .85s ease-out forwards;}
@keyframes popTxt{0%{transform:translate(-50%,-50%) scale(.6);opacity:1;}45%{transform:translate(-50%,-110%) scale(1.15);opacity:1;}100%{transform:translate(-50%,-175%) scale(1);opacity:0;}}
.pop-pts{position:absolute;top:28%;right:8%;font-size:15px;font-weight:900;pointer-events:none;z-index:10;animation:popPts .7s ease-out forwards;}
@keyframes popPts{0%{transform:scale(.5);opacity:1;}100%{transform:translateY(-28px) scale(1.2);opacity:0;}}

/* END */
#es{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.eemj{font-size:64px;animation:ejmb .7s ease infinite alternate;}
@keyframes ejmb{from{transform:scale(1);}to{transform:scale(1.1);}}
.eslbl{font-size:13px;font-weight:700;color:#666;}
.escore{font-size:56px;font-weight:900;color:#FF7043;line-height:1;}
.epraise{font-size:18px;font-weight:900;color:#1a1a1a;text-align:center;}
.esub{font-size:13px;color:#666;text-align:center;background:#FFF0E8;border-radius:12px;padding:8px 16px;max-width:260px;}
.cf{position:fixed;pointer-events:none;z-index:9999;animation:cfall linear forwards;}
@keyframes cfall{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(110vh) rotate(700deg);opacity:0;}}
</style>
</head>
<body>
<div id="app">
  <div id="ss">
    <div class="pv-row">
      <div class="pv-cell"><div class="pv-mole" style="animation-delay:0s">🐾</div></div>
      <div class="pv-cell"><div class="pv-mole" style="animation-delay:.5s">🌟</div></div>
      <div class="pv-cell"><div class="pv-mole" style="animation-delay:1s">🐾</div></div>
    </div>
    <div class="sttl">🐾 두더지 팡팡!</div>
    <div class="ssub">구멍에서 나오는 두더지를 잡아봐요!</div>
    <button class="sbtn" onclick="startGame()">▶ 시작!</button>
  </div>

  <div id="gs">
    <div id="hud">
      <div class="hbox"><span class="hico">⭐</span><span class="hnum" id="snum">0</span></div>
      <span class="hlvl" id="lvl-txt">레벨 1</span>
      <div class="hbox"><span class="hnum" id="tnum">30</span><span class="hico">⏰</span></div>
    </div>
    <div id="grid-wrap">
      <div id="grid"></div>
    </div>
  </div>

  <div id="es">
    <div class="eemj" id="eemj">🎉</div>
    <div class="eslbl">오늘의 점수</div>
    <div class="escore" id="escore">0</div>
    <div class="epraise" id="epraise">잘 했어요!</div>
    <div class="esub" id="esub">두더지를 잡는 솜씨가 늘었어요!</div>
    <button class="sbtn" onclick="startGame()">🐾 다시 하기!</button>
  </div>
</div>

<script>
var AC=null,score=0,tLeft=30,active=false;
var spawnTmr=null,cntTmr=null,moleTmr=null,curMole=-1;
var PRAISE=['잡았다! 🎉','최고야! ⭐','야호! 🌟','대단해! 👏','빠르다! 💨','완벽해! 😊'];
var STAR_PRAISE=['황금 두더지! ✨','대박이야! 💫','특별 포획! 🌟'];

function initAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function getMoleTime(){if(score<5)return 2400;if(score<10)return 1900;if(score<15)return 1500;if(score<20)return 1200;return 1000;}
function getLvl(){if(score<5)return 1;if(score<10)return 2;if(score<15)return 3;if(score<20)return 4;return 5;}

function playHit(star){
  if(!AC)return;
  var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.setValueAtTime(star?880:523,t);
  if(star)o.frequency.exponentialRampToValueAtTime(1320,t+.15);
  g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.3);
}

function buildGrid(){
  var grid=document.getElementById('grid');
  grid.innerHTML='';
  for(var i=0;i<9;i++){
    (function(idx){
      var cell=document.createElement('div');
      cell.className='cell';cell.id='cell-'+idx;

      var mole=document.createElement('div');
      mole.className='mole';mole.id='mole-'+idx;
      mole.setAttribute('data-star','0');

      var mf=document.createElement('div');mf.className='mf';
      var el=document.createElement('div');el.className='me l';
      var er=document.createElement('div');er.className='me r';
      var mn=document.createElement('div');mn.className='mn';
      var ckl=document.createElement('div');ckl.className='mck l';
      var ckr=document.createElement('div');ckr.className='mck r';
      var ms=document.createElement('div');ms.className='mstar';ms.textContent='⭐';

      mf.appendChild(el);mf.appendChild(er);mf.appendChild(mn);
      mf.appendChild(ckl);mf.appendChild(ckr);mf.appendChild(ms);
      mole.appendChild(mf);
      cell.appendChild(mole);

      cell.addEventListener('click',function(){hitCell(idx);});
      cell.addEventListener('touchstart',function(e){e.preventDefault();hitCell(idx);},{passive:false});
      grid.appendChild(cell);
    })(i);
  }
}

function spawnMole(){
  if(!active)return;
  var avail=[];
  for(var i=0;i<9;i++){if(i!==curMole)avail.push(i);}
  var idx=avail[Math.floor(Math.random()*avail.length)];
  var star=Math.random()<.15;
  curMole=idx;
  var mole=document.getElementById('mole-'+idx);
  if(!mole)return;
  mole.setAttribute('data-star',star?'1':'0');
  if(star){
    mole.classList.add('gold');
    var s=mole.querySelector('.mstar');
    if(s)s.style.display='block';
  }
  mole.classList.add('up');
  moleTmr=setTimeout(function(){hideMole(idx,false);},getMoleTime());
}

function hideMole(idx,wasHit){
  clearTimeout(moleTmr);
  var mole=document.getElementById('mole-'+idx);
  if(!mole)return;
  var next=function(){
    mole.classList.remove('up','hit','gold');
    var s=mole.querySelector('.mstar');
    if(s)s.style.display='none';
    curMole=-1;
    if(active)spawnTmr=setTimeout(spawnMole,200+Math.random()*300);
  };
  if(wasHit){mole.classList.add('hit');setTimeout(next,240);}
  else next();
}

function hitCell(idx){
  if(!active)return;
  var mole=document.getElementById('mole-'+idx);
  if(!mole||!mole.classList.contains('up')||mole.classList.contains('hit'))return;
  var star=mole.getAttribute('data-star')==='1';
  var pts=star?3:1;
  score+=pts;
  document.getElementById('snum').textContent=score;
  document.getElementById('lvl-txt').textContent='레벨 '+getLvl();
  playHit(star);showPop(idx,pts,star);hideMole(idx,true);
}

function showPop(idx,pts,star){
  var cell=document.getElementById('cell-'+idx);if(!cell)return;
  var p=star?STAR_PRAISE[Math.floor(Math.random()*STAR_PRAISE.length)]:PRAISE[Math.floor(Math.random()*PRAISE.length)];
  var t=document.createElement('div');t.className='pop-txt';t.style.color=star?'#D4A820':'#FF7043';t.textContent=p;
  cell.appendChild(t);setTimeout(function(){t.remove();},900);
  var pt=document.createElement('div');pt.className='pop-pts';pt.style.color=star?'#D4A820':'#FF7043';pt.textContent='+'+pts;
  cell.appendChild(pt);setTimeout(function(){pt.remove();},750);
  if(star)launchConfetti();
}

function launchConfetti(){
  var cols=['#FF7043','#FFD54F','#66BB6A','#42A5F5','#AB47BC','#fff'];
  for(var i=0;i<40;i++){(function(){
    var c=document.createElement('div');c.className='cf';
    var sz=5+Math.random()*8,dur=1+Math.random()*1.4;
    c.style.cssText='left:'+(Math.random()*100)+'vw;top:-10px;width:'+sz+'px;height:'+sz+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()>.5?'50%':'2px')+';animation-duration:'+dur+'s;animation-delay:'+(Math.random()*.3)+'s;';
    document.body.appendChild(c);
    c.addEventListener('animationend',function(){c.remove();});
  })();}
}

function endGame(){
  active=false;
  clearTimeout(spawnTmr);clearTimeout(moleTmr);clearInterval(cntTmr);
  document.querySelectorAll('.mole').forEach(function(m){m.classList.remove('up','hit','gold');});
  document.getElementById('gs').style.display='none';
  document.getElementById('es').style.display='flex';
  document.getElementById('escore').textContent=score;
  var p;
  if(score<=5) p={e:'😊',t:'잘 했어요! 👏',s:'두더지가 빠르게 도망갔지요?'};
  else if(score<=10)p={e:'🌟',t:'멋져요! 🌟',s:'두더지를 많이 잡았어요!'};
  else if(score<=15)p={e:'🎉',t:'대단해요! 🎉',s:'정말 빠른 손놀림이에요!'};
  else p={e:'🏆',t:'두더지 달인! 🏆',s:'두더지 세계 최강자예요!'};
  document.getElementById('eemj').textContent=p.e;
  document.getElementById('epraise').textContent=p.t;
  document.getElementById('esub').textContent=p.s;
  launchConfetti();
}

function startGame(){
  initAC();score=0;tLeft=30;active=true;curMole=-1;
  document.getElementById('ss').style.display='none';
  document.getElementById('es').style.display='none';
  document.getElementById('gs').style.display='flex';
  document.getElementById('snum').textContent='0';
  document.getElementById('tnum').textContent='30';
  document.getElementById('tnum').classList.remove('urg');
  document.getElementById('lvl-txt').textContent='레벨 1';
  buildGrid();
  clearTimeout(spawnTmr);clearTimeout(moleTmr);clearInterval(cntTmr);
  spawnTmr=setTimeout(spawnMole,700);
  cntTmr=setInterval(function(){
    tLeft--;
    document.getElementById('tnum').textContent=tLeft;
    if(tLeft<=10)document.getElementById('tnum').classList.add('urg');
    if(tLeft<=0)endGame();
  },1000);
}
</script>
</body>
</html>
